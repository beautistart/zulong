monitoring:
  debug:
    backup_count: 5
    console_enabled: true
    log_rotation: true
    max_log_size_mb: 100
    save_logs: true
  performance:
    enabled: true
    log_threshold_ms: 100
    metrics_dir: ./data/metrics
security:
  api_keys:
    default: ${ZULONG_API_KEY}
  cors:
    allowed_methods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
    allowed_origins:
    - http://localhost:8080
    - http://localhost:3000
  rate_limit:
    enabled: false
    requests_per_minute: 60
system:
  cache_dir: ./cache
  data_dir: ./data
  debug_mode: false
  environment: production
  log_level: INFO
  models_dir: ./models
  name: ZULONG
  version: 2.0.0
tools:
  engine:
    max_workers: 5
    timeout: 60
  pipeline:
    workspace_dir: ./agent_workspace
  skill_packs:
    disabled_packs:
    - ide_coder
    - complex_task
    enabled: true
    enabled_packs: []
    packs_dir: ./zulong/skill_packs/packs
  web_search:
    enabled: true
    engine: searxng
    max_results: 5
    searxng_url: http://localhost:8101
vision:
  analysis:
    keyframes_count: 10
    min_frames_required: 10
    short_term_duration: 5
  camera:
    backend: auto
    device_index: 0
    enabled: false
    fps: 30
    resolution:
    - 1280
    - 720
  mediapipe:
    device: cpu
    face_tracking: false
    hand_tracking: true
    pose_tracking: true
  yolo:
    confidence_threshold: 0.25
    device: auto
    iou_threshold: 0.45
    model_path: models/yolov10n.pt
voice_intent_classification:
  albert:
    confidence_threshold: 0.6
    device: cpu
    head_weights_path: voice_intent_head.pt
    max_length: 128
    model_path: ./models/albert-tiny-chinese
  backend: albert
  enabled: true
web:
  api:
    cors_enabled: true
    docs_enabled: true
    enabled: true
    host: localhost
    port: 3000
  ui:
    auto_open_browser: true
    enabled: true
    host: localhost
    port: 8080
    static_dir: ./web/static
workspace:
  auto_open_vscode: false
  root: C:\Users\HiWin11/Zulong/workspace
  vscode_command: code
  vscode_extensions_dir: C:\Users\HiWin11/.vscode/extensions
  vscode_isolated_user_data: true
  vscode_restore_windows: none
  vscode_user_data_dir: C:\Users\HiWin11\AppData\Local/Zulong/vscode-user-data
