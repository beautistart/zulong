# Windows platform profile for ZULONG.
# Keep this file focused on host-specific defaults; shared architecture stays in zulong_config.yaml.

system:
  data_dir: ${ZULONG_DATA_DIR:./data}
  models_dir: ${ZULONG_MODEL_BASE_DIR:./models}
  cache_dir: ${ZULONG_CACHE_DIR:./cache}

llm:
  backend: ${ZULONG_LLM_BACKEND:deepseek}
  ollama:
    base_url: ${ZULONG_OLLAMA_BASE_URL:http://localhost:11434/v1}
    model_id: ${ZULONG_OLLAMA_MODEL_ID:deepseek-v4-pro:cloud}
    backup_model_id: ${ZULONG_OLLAMA_BACKUP_MODEL_ID:qwen3.5:4b}
    auto_discover: ${ZULONG_OLLAMA_AUTO_DISCOVER:true}
    health_check_interval: ${ZULONG_OLLAMA_HEALTH_CHECK_INTERVAL:30}
    keep_alive: ${ZULONG_OLLAMA_KEEP_ALIVE:5m}
  vllm:
    base_url: ${ZULONG_VLLM_BASE_URL:http://localhost:8000/v1}
    model_id: ${ZULONG_VLLM_MODEL_ID:./models/Qwen/Qwen3___5-0.8B-AWQ}
  sglang:
    base_url: ${ZULONG_SGLANG_BASE_URL:http://localhost:30000/v1}
    model_id: ${ZULONG_SGLANG_MODEL_ID:./models/Qwen/Qwen3___5-0.8B-AWQ}
  siliconflow:
    base_url: ${ZULONG_SILICONFLOW_BASE_URL:https://api.siliconflow.cn/v1}
    model_id: ${ZULONG_SILICONFLOW_MODEL_ID:deepseek-ai/DeepSeek-V4-Flash}
  openrouter:
    base_url: ${ZULONG_OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
    model_id: ${ZULONG_OPENROUTER_MODEL_ID:openai/gpt-4o-mini}
  oneapi:
    base_url: ${ZULONG_ONEAPI_BASE_URL:http://localhost:3000/v1}
    model_id: ${ZULONG_ONEAPI_MODEL_ID:gpt-4o-mini}
  custom:
    base_url: ${ZULONG_CUSTOM_LLM_BASE_URL:http://localhost:11434/v1}
    api_key: ${ZULONG_CUSTOM_LLM_API_KEY:EMPTY}
    model_id: ${ZULONG_CUSTOM_LLM_MODEL_ID:qwen3.5:4b}
  transformer:
    device: auto

audio:
  asr:
    device: auto
  tts:
    backend: kokoro
    device: auto
    cosyvoice:
      model_path: ${ZULONG_COSYVOICE3_MODEL_PATH:./models/CosyVoice3-0.5B/FunAudioLLM/Fun-CosyVoice3-0___5B-2512}
      ttsfrd_path: ${ZULONG_COSYVOICE_TTSFRD_PATH:./models/iic/CosyVoice-ttsfrd}
      integrated_python_path: ${ZULONG_COSYVOICE_PYTHON:python}
      code_path: ${ZULONG_COSYVOICE_CODE_PATH:./models/CosyVoice}
      model_dir: ${ZULONG_COSYVOICE_MODEL_DIR:./models/iic/CosyVoice2-0.5B}
      prompt_audio: ${ZULONG_COSYVOICE_PROMPT_AUDIO:./models/CosyVoice/asset/zero_shot_prompt.wav}
      server_url: ${ZULONG_COSYVOICE_GRADIO_URL:http://localhost:50000}

vision:
  camera:
    backend: auto
    device_index: 0
  yolo:
    device: auto

workspace:
  root: ${ZULONG_WORKSPACE:%USERPROFILE%/Zulong/workspace}
  vscode_command: ${ZULONG_VSCODE_COMMAND:code}
  vscode_isolated_user_data: true
  vscode_user_data_dir: ${ZULONG_VSCODE_USER_DATA_DIR:%LOCALAPPDATA%/Zulong/vscode-user-data}
  vscode_extensions_dir: ${ZULONG_VSCODE_EXTENSIONS_DIR:%USERPROFILE%/.vscode/extensions}
  vscode_restore_windows: none
