# Windows platform profile for ZULONG.
# Keep this file focused on host-specific defaults; shared architecture stays in zulong_config.yaml.

system:
  data_dir: ${ZULONG_DATA_DIR:./data}
  models_dir: ${ZULONG_MODEL_BASE_DIR:./models}
  cache_dir: ${ZULONG_CACHE_DIR:./cache}

audio:
  asr:
    device: auto
  tts:
    backend: kokoro
    device: auto
    cosyvoice:
      model_path: ${ZULONG_COSYVOICE3_MODEL_PATH:./models/CosyVoice3-0.5B/FunAudioLLM/Fun-CosyVoice3-0___5B-2512}
      ttsfrd_path: ${ZULONG_COSYVOICE_TTSFRD_PATH:./models/iic/CosyVoice-ttsfrd}
      integrated_python_path: ${ZULONG_COSYVOICE_PYTHON:python}
      code_path: ${ZULONG_COSYVOICE_CODE_PATH:./models/CosyVoice}
      model_dir: ${ZULONG_COSYVOICE_MODEL_DIR:./models/iic/CosyVoice2-0.5B}
      prompt_audio: ${ZULONG_COSYVOICE_PROMPT_AUDIO:./models/CosyVoice/asset/zero_shot_prompt.wav}
      server_url: ${ZULONG_COSYVOICE_GRADIO_URL:http://localhost:50000}

vision:
  camera:
    backend: auto
    device_index: 0
  yolo:
    device: auto

workspace:
  root: ${ZULONG_WORKSPACE:%USERPROFILE%/Zulong/workspace}
  vscode_command: ${ZULONG_VSCODE_COMMAND:code}
  vscode_isolated_user_data: true
  vscode_user_data_dir: ${ZULONG_VSCODE_USER_DATA_DIR:%LOCALAPPDATA%/Zulong/vscode-user-data}
  vscode_extensions_dir: ${ZULONG_VSCODE_EXTENSIONS_DIR:%USERPROFILE%/.vscode/extensions}
  vscode_restore_windows: none
