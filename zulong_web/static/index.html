        // ===================================================================
        // 记忆图谱 (Memory Graph) - SVG + d3-force + 分层折叠展开
        // ===================================================================

        let mgSimulation = null;
        let mgInitialized = false;
        var mgPendingFullData = null;
        var mgLastSnapshotStats = null;
        let mgZoomBehavior = null;
        let mgUserViewportChanged = false;
        let mgProgrammaticZoom = false;
        let mgFitTimers = [];
        let mgFallbackFetchTimer = null;
        let mgRealtimeRefreshTimer = null;
        let mgSnapshotFetchInFlight = false;
        let mgSnapshotFetchQueued = false;
        let mgNeedsSnapshotRefresh = false;
        const MG_DEFAULT_MIN_ZOOM = 0.02;
        const MG_HARD_MIN_ZOOM = 0.001;
        const MG_MAX_ZOOM = 8;
        const MG_FIT_PADDING = 48;

        // 核心状态（分层折叠展开）
        let mgState = {
            nodes: new Map(),        // id -> node data (含 x/y)
            edges: [],               // [{source, target, type, weight, protected}]
            expandedSet: new Set(),  // 已展开的节点 ID
            selectedNodeId: null,
            activeNodeIds: new Set(),
        };

        const MG_COLORS = {
            dialogue: '#8b5cf6', task: '#3b82f6', knowledge: '#22c55e',
            experience: '#f59e0b', episode: '#06b6d4', file: '#64748b',
            concept: '#ec4899', person: '#ef4444', document: '#94a3b8',
            group: '#a78bfa', code_symbol: '#10b981', module: '#0891b2',
            tool_call: '#14b8a6', tool_result: '#22c55e', approval: '#f97316'
        };

        const MG_RADIUS = {
            dialogue: 8, task: 7, knowledge: 5, experience: 5,
            episode: 6, file: 5, concept: 5, person: 7, document: 5,
            group: 14, code_symbol: 4, module: 6,
            tool_call: 6, tool_result: 5.5, approval: 6.5
        };

        function mgNodeSubType(d) {
            return (d && d.metadata && d.metadata.sub_type) || '';
        }

        function mgNodeRadius(d) {
            var base = MG_RADIUS[d.type] || 5;
            var subType = mgNodeSubType(d);
            if (d.type === 'dialogue') {
                if (subType === 'session') return 13;
                if (subType === 'round') return 9;
                if (subType === 'user_turn' || subType === 'agent_turn') return 5.5;
            }
            if (d.metadata && d.metadata.is_root_node) return Math.max(base, 12);
            return base;
        }

        function mgNodeLabel(d) {
            var label = d.label || '';
            var subType = mgNodeSubType(d);
            if (subType === 'session') return label.substring(0, 18);
            if (subType === 'round') return label.substring(0, 16);
            if (subType === 'user_turn') return '用户';
            if (subType === 'agent_turn') return '祖龙';
            if (d.type === 'tool_call') return '调用 ' + label.substring(0, 9);
            if (d.type === 'tool_result') return '结果 ' + label.substring(0, 9);
            if (d.type === 'approval') return '审批 ' + label.substring(0, 9);
            return label.substring(0, 14);
        }

        function mgIsExecutionNode(d) {
            return !!(d && (
                d.type === 'tool_call' ||
                d.type === 'tool_result' ||
                d.type === 'approval' ||
                (d.metadata && d.metadata.is_execution_event)
            ));
        }

        const MG_EDGE_STYLES = {
            hierarchy:   { stroke: '#475569', dasharray: 'none', width: 2 },
            dependency:  { stroke: '#ef4444', dasharray: '6 3', width: 1.5 },
            reference:   { stroke: '#3b82f6', dasharray: '3 3', width: 1 },
            temporal:    { stroke: '#8b5cf6', dasharray: 'none', width: 1.5 },
            semantic:    { stroke: '#06b6d4', dasharray: '4 2', width: 1 },
            causal:      { stroke: '#f59e0b', dasharray: 'none', width: 1.5 },
            association: { stroke: '#a78bfa', dasharray: '2 4', width: 1 },
        };

        function updateMgZoomText(scale) {
            var el = document.getElementById('mgZoomText');
            if (!el) return;
            var pct = Math.max(1, Math.round((scale || 1) * 100));
            el.textContent = pct + '%';
        }

        function mgSetZoomExtent(requiredMinScale) {
            if (!mgZoomBehavior) return;
            var minScale = Math.min(MG_DEFAULT_MIN_ZOOM, requiredMinScale || MG_DEFAULT_MIN_ZOOM);
            minScale = Math.max(MG_HARD_MIN_ZOOM, minScale);
            mgZoomBehavior.scaleExtent([minScale, MG_MAX_ZOOM]);
        }

        function mgGraphBounds() {
            var nodes = Array.from(mgState.nodes.values()).filter(function(n) {
                return n && Number.isFinite(n.x) && Number.isFinite(n.y);
            });
            if (nodes.length > 0) {
                var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
                nodes.forEach(function(n) {
                    var pad = mgNodeRadius(n) + 42;
                    minX = Math.min(minX, n.x - pad);
                    minY = Math.min(minY, n.y - pad);
                    maxX = Math.max(maxX, n.x + pad);
                    maxY = Math.max(maxY, n.y + pad);
                });
                return {
                    x: minX,
                    y: minY,
                    width: Math.max(1, maxX - minX),
                    height: Math.max(1, maxY - minY)
                };
            }

            var root = document.getElementById('mgRoot');
            if (root && root.getBBox) {
                try {
                    var box = root.getBBox();
                    if (box && box.width && box.height) return box;
                } catch (e) {}
            }
            return null;
        }

        function fitMemoryGraphViewport(padding, animate, force) {
            if (!mgInitialized || !mgZoomBehavior) return;
            if (!force && mgUserViewportChanged) return;
            if (force) mgUserViewportChanged = false;
            var svgEl = document.getElementById('memoryGraphSvg');
            if (!svgEl || !svgEl.parentElement) return;
            var rect = svgEl.parentElement.getBoundingClientRect();
            var width = rect.width || 600;
            var height = rect.height || 400;
            var bounds = mgGraphBounds();
            if (!bounds) return;

            padding = padding === undefined ? MG_FIT_PADDING : padding;
            var fitWidth = Math.max(1, width - padding * 2);
            var fitHeight = Math.max(1, height - padding * 2);
            var fitScale = Math.min(fitWidth / bounds.width, fitHeight / bounds.height);
            var scale = Math.max(MG_HARD_MIN_ZOOM, Math.min(MG_MAX_ZOOM, fitScale));
            mgSetZoomExtent(scale * 0.75);

            var tx = (width - bounds.width * scale) / 2 - bounds.x * scale;
            var ty = (height - bounds.height * scale) / 2 - bounds.y * scale;
            var transform = d3.zoomIdentity.translate(tx, ty).scale(scale);
            var svg = d3.select(svgEl);
            mgProgrammaticZoom = true;
            var selection = animate ? svg.transition().duration(420) : svg;
            selection.call(mgZoomBehavior.transform, transform);
            updateMgZoomText(scale);
            setTimeout(function() { mgProgrammaticZoom = false; }, animate ? 460 : 40);
        }

        function resetMemoryGraphZoom() {
            if (!mgInitialized || !mgZoomBehavior) return;
            var svg = d3.select('#memoryGraphSvg');
            mgSetZoomExtent(MG_DEFAULT_MIN_ZOOM);
            mgProgrammaticZoom = true;
            mgUserViewportChanged = true;
            svg.transition().duration(300).call(mgZoomBehavior.transform, d3.zoomIdentity);
            updateMgZoomText(1);
            setTimeout(function() { mgProgrammaticZoom = false; }, 340);
        }

        function scheduleMemoryGraphFit(force) {
            mgFitTimers.forEach(function(timer) { clearTimeout(timer); });
            mgFitTimers = [];
            if (!force && mgUserViewportChanged) return;
            [120, 420, 900].forEach(function(delay) {
                mgFitTimers.push(setTimeout(function() {
                    fitMemoryGraphViewport(MG_FIT_PADDING, delay > 120, force);
                }, delay));
            });
        }

        function initMemoryGraph() {
            const svgEl = document.getElementById('memoryGraphSvg');
            if (!svgEl) return;
            const svg = d3.select(svgEl);
            const rect = svgEl.parentElement.getBoundingClientRect();
            const width = rect.width || 600;
            const height = rect.height || 400;

            svg.selectAll('*').remove();

            // defs - arrowhead marker
            const defs = svg.append('defs');
            defs.append('marker')
                .attr('id', 'mg-arrow')
                .attr('viewBox', '0 -3 6 6')
                .attr('refX', 14).attr('refY', 0)
                .attr('markerWidth', 6).attr('markerHeight', 6)
                .attr('orient', 'auto')
                .append('path').attr('d', 'M0,-3L6,0L0,3').attr('fill', '#475569');

            const g = svg.append('g').attr('id', 'mgRoot');

            // zoom + pan
            mgZoomBehavior = d3.zoom()
                .scaleExtent([MG_DEFAULT_MIN_ZOOM, MG_MAX_ZOOM])
                .on('zoom', function(e) {
                    if (e.sourceEvent && !mgProgrammaticZoom) {
                        mgUserViewportChanged = true;
                    }
                    g.attr('transform', e.transform);
                    updateMgZoomText(e.transform.k);
                });
            svg.call(mgZoomBehavior);

            // 力导向模拟
            mgSimulation = d3.forceSimulation()
                .force('link', d3.forceLink().id(d => d.id).distance(80))
                .force('charge', d3.forceManyBody().strength(-150))
                .force('center', d3.forceCenter(width / 2, height / 2))
                .force('collision', d3.forceCollide().radius(d => mgNodeRadius(d) + 7))
                .on('tick', mgTick);

            mgInitialized = true;
            console.log('[MemoryGraph] SVG + d3-force 初始化完成（分层折叠模式）');
        }

        // ---- SVG 渲染 ----

        function renderMemoryGraph() {
            if (!mgInitialized) initMemoryGraph();
            if (!mgSimulation) return;

            var nodes = Array.from(mgState.nodes.values());
            var visibleNodeIds = new Set(nodes.map(function(n) { return String(n.id || ''); }));
            var edges = mgState.edges.map(function(e) {
                return {
                    source: typeof e.source === 'object' ? e.source.id : e.source,
                    target: typeof e.target === 'object' ? e.target.id : e.target,
                    type: e.type, weight: e.weight, protected: e.protected
                };
            }).filter(function(e) {
                return visibleNodeIds.has(String(e.source || '')) && visibleNodeIds.has(String(e.target || ''));
            });

            const g = d3.select('#mgRoot');

            // --- 边 ---
            const linkSel = g.selectAll('.mg-link').data(edges, d => d.source + '-' + d.target + '-' + d.type);
            linkSel.exit().remove();
            const linkEnter = linkSel.enter().append('line').attr('class', 'mg-link');
            const linkMerge = linkEnter.merge(linkSel);
            linkMerge
                .attr('stroke', d => (MG_EDGE_STYLES[d.type] || MG_EDGE_STYLES.reference).stroke)
                .attr('stroke-width', d => (MG_EDGE_STYLES[d.type] || MG_EDGE_STYLES.reference).width)
                .attr('stroke-dasharray', d => (MG_EDGE_STYLES[d.type] || MG_EDGE_STYLES.reference).dasharray)
                .attr('stroke-opacity', d => 0.3 + (d.weight || 0.5) * 0.5)
                .attr('marker-end', 'url(#mg-arrow)');

            // --- 节点 ---
            const nodeSel = g.selectAll('.mg-node').data(nodes, d => d.id);
            nodeSel.exit().remove();
            const nodeEnter = nodeSel.enter().append('g').attr('class', 'mg-node');
            nodeEnter.append('circle');
            nodeEnter.append('text').attr('class', 'mg-node-label');
            // children_count badge 元素
            var badgeG = nodeEnter.append('g').attr('class', 'mg-badge');
            badgeG.append('circle').attr('class', 'mg-badge-circle');
            badgeG.append('text').attr('class', 'mg-badge-text');

            // 拖拽
            nodeEnter.call(d3.drag()
                .on('start', mgDragStarted)
                .on('drag', mgDragged)
                .on('end', mgDragEnded));

            // 单击节点 → 显示详情
            nodeEnter.on('click', function(event, d) {
                event.stopPropagation();
                mgState.selectedNodeId = d.id;
                showMgNodeDetail(d);
                g.selectAll('.mg-node circle').filter('.mg-main-circle').attr('stroke', '#1e293b').attr('stroke-width', 1.5);
                d3.select(this).select('.mg-main-circle').attr('stroke', '#f59e0b').attr('stroke-width', 3);
            });

            // 双击节点 → 展开/折叠
            nodeEnter.on('dblclick', function(event, d) {
                event.stopPropagation();
                event.preventDefault();
                if (mgState.expandedSet.has(d.id)) {
                    mgCollapseNode(d.id);
                } else if ((d.children_count || 0) > 0) {
                    mgExpandNode(d.id);
                }
            });

            const nodeMerge = nodeEnter.merge(nodeSel);

            nodeMerge
                .classed('mg-session-root', function(d) { return d.type === 'dialogue' && mgNodeSubType(d) === 'session'; })
                .classed('mg-dialogue-round', function(d) { return d.type === 'dialogue' && mgNodeSubType(d) === 'round'; })
                .classed('mg-message-node', function(d) {
                    var st = mgNodeSubType(d);
                    return d.type === 'dialogue' && (st === 'user_turn' || st === 'agent_turn');
                });

            // 给主圆标记 class 便于选择
            nodeMerge.select('circle:first-child')
                .attr('class', 'mg-main-circle')
                .attr('r', d => mgNodeRadius(d))
                .attr('fill', d => MG_COLORS[d.type] || '#64748b')
                .attr('stroke', function(d) {
                    var st = mgNodeSubType(d);
                    if (d.type === 'group') return '#7c3aed';
                    if (st === 'session') return '#7c3aed';
                    if (st === 'round') return '#6d28d9';
                    return '#1e293b';
                })
                .attr('stroke-width', function(d) {
                    var st = mgNodeSubType(d);
                    if (d.type === 'group') return 2.5;
                    if (st === 'session') return 1.8;
                    if (st === 'round') return 1.4;
                    return 1.5;
                })
                .attr('stroke-dasharray', function(d) {
                    var st = mgNodeSubType(d);
                    if (d.type === 'group') return '4 2';
                    if (st === 'user_turn' || st === 'agent_turn') return '2 2';
                    return 'none';
                })
                .attr('opacity', function(d) {
                    var st = mgNodeSubType(d);
                    if (d.type === 'group') return 0.85;
                    if (st === 'session') return 0.95;
                    if (st === 'round') return 0.82;
                    return 0.55 + (d.activation || 0) * 0.4;
                });

            nodeMerge.select('.mg-node-label')
                .attr('dy', d => -mgNodeRadius(d) - 4)
                .attr('text-anchor', 'middle')
                .text(d => mgNodeLabel(d));

            // children_count badge（未展开 + 有子节点）
            nodeMerge.select('.mg-badge').each(function(d) {
                var cc = d.children_count || 0;
                var show = cc > 0 && !mgState.expandedSet.has(d.id);
                var badgeG = d3.select(this);
                badgeG.attr('display', show ? null : 'none');
                if (show) {
                    var r = mgNodeRadius(d);
                    var badgeText = cc > 99 ? '99+' : String(cc);
                    var badgeR = badgeText.length > 2 ? 9 : (badgeText.length > 1 ? 7 : 6);
                    badgeG.select('.mg-badge-circle')
                        .attr('cx', r * 0.7).attr('cy', -r * 0.7)
                        .attr('r', badgeR)
                        .attr('fill', '#ef4444');
                    badgeG.select('.mg-badge-text')
                        .attr('x', r * 0.7).attr('y', -r * 0.7)
                        .attr('text-anchor', 'middle')
                        .attr('dominant-baseline', 'central')
                        .attr('fill', '#fff')
                        .attr('font-size', '8px')
                        .attr('font-weight', 'bold')
                        .text(badgeText);
                }
            });

            // 活跃节点高亮（脉冲动画 CSS class）
            nodeMerge
                .classed('mg-active', function(d) { return mgState.activeNodeIds.has(d.id); })
                .classed('mg-active-dialogue', function(d) { return mgState.activeNodeIds.has(d.id) && d.type === 'dialogue'; })
                .classed('mg-active-task', function(d) { return mgState.activeNodeIds.has(d.id) && d.type === 'task'; });

            // 选中高亮
            if (mgState.selectedNodeId) {
                nodeMerge.select('.mg-main-circle').each(function(d) {
                    if (d.id === mgState.selectedNodeId) {
                        d3.select(this).attr('stroke', '#f59e0b').attr('stroke-width', 3);
                    }
                });
            }

            // 更新模拟
            mgSimulation.nodes(nodes);
            mgSimulation.force('link').links(edges);
            mgSimulation.alpha(0.6).restart();

            // 更新统计
            var renderStats = mgLastSnapshotStats
                ? Object.assign({}, mgLastSnapshotStats, {
                    returned_nodes: mgState.nodes.size,
                    returned_edges: mgState.edges.length
                })
                : {
                    total_nodes: mgState.nodes.size,
                    total_edges: mgState.edges.length
                };
            updateMemoryGraphStats(renderStats);
        }

        function updateMemoryGraphStats(stats) {
            var statsEl = document.getElementById('mgStats');
            if (!statsEl) return;
            stats = stats || {};
            var totalNodes = stats.total_nodes;
            var totalEdges = stats.total_edges;
            var returnedNodes = stats.returned_nodes;
            var returnedEdges = stats.returned_edges;
            var nodeText = (totalNodes !== undefined && totalNodes !== null) ? totalNodes : mgState.nodes.size;
            var edgeText = (totalEdges !== undefined && totalEdges !== null) ? totalEdges : mgState.edges.length;
            var suffix = '';
            if (stats.transport === 'chunked' && returnedNodes !== undefined) {
                suffix = ' | 分批载入 ' + returnedNodes + ' 节点';
                if (returnedEdges !== undefined) suffix += ' / ' + returnedEdges + ' 边';
            } else if (stats.truncated && returnedNodes !== undefined) {
                suffix = ' | 已载入 ' + returnedNodes + ' 节点';
                if (returnedEdges !== undefined) suffix += ' / ' + returnedEdges + ' 边';
            } else if ((stats.limited || stats.transport === 'active_skeleton' || stats.transport === 'limited_root') && returnedNodes !== undefined) {
                suffix = ' | 已载入 ' + returnedNodes + ' 节点';
                if (returnedEdges !== undefined) suffix += ' / ' + returnedEdges + ' 边';
            }
            statsEl.textContent = nodeText + ' 节点 | ' + edgeText + ' 边' + suffix;
        }

        function mgTick() {
            const g = d3.select('#mgRoot');
            g.selectAll('.mg-link')
                .attr('x1', d => d.source.x || 0)
                .attr('y1', d => d.source.y || 0)
                .attr('x2', d => d.target.x || 0)
                .attr('y2', d => d.target.y || 0);
            g.selectAll('.mg-node')
                .attr('transform', d => 'translate(' + (d.x || 0) + ',' + (d.y || 0) + ')');
        }

        function mgDragStarted(event, d) {
            if (!event.active) mgSimulation.alphaTarget(0.3).restart();
            d.fx = d.x; d.fy = d.y;
        }
        function mgDragged(event, d) {
            d.fx = event.x; d.fy = event.y;
        }
        function mgDragEnded(event, d) {
            if (!event.active) mgSimulation.alphaTarget(0);
            d.fx = null; d.fy = null;
        }

        // ---- simulation 更新（折叠展开后刷新 SVG）----

        function mgUpdateSimulation(alpha) {
            if (!mgSimulation) return;
            renderMemoryGraph();
            scheduleMemoryGraphFit(false);
        }

        // ---- 展开/折叠 ----

        function mgExpandNode(nodeId) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                sendWsMessage({ type: 'EXPAND_NODE', node_id: nodeId });
            }
        }

        function handleMemoryGraphExpandResult(data) {
            if (!data || !data.parent_id) return;
            var parentNode = mgState.nodes.get(data.parent_id);
            if (!parentNode) return;

            var isVirtualGroup = data.parent_id.indexOf('__group:') === 0;
            mgState.expandedSet.add(data.parent_id);

            // 插入子节点（初始位置在父节点附近）
            var newNodes = data.nodes || [];
            for (var i = 0; i < newNodes.length; i++) {
                var nd = newNodes[i];
                if (!mgState.nodes.has(nd.id)) {
                    nd.x = parentNode.x + (Math.random() - 0.5) * 60;
                    nd.y = parentNode.y + (Math.random() - 0.5) * 60;
                    nd.vx = 0;
                    nd.vy = 0;
                    mgState.nodes.set(nd.id, nd);
                }
            }

            // 插入边（去重）
            var newEdges = data.edges || [];
            // 对虚拟分组节点，添加合成 hierarchy 边（group → child），
            // 保证折叠/全量更新时能正确识别后代关系
            if (isVirtualGroup) {
                for (var k = 0; k < newNodes.length; k++) {
                    newEdges.push({
                        source: data.parent_id,
                        target: newNodes[k].id,
                        type: 'hierarchy',
                        weight: 1,
                        protected: false
                    });
                }
            }
            var existingEdgeKeys = new Set();
            for (var j = 0; j < mgState.edges.length; j++) {
                var ex = mgState.edges[j];
                var ek = (typeof ex.source === 'object' ? ex.source.id : ex.source) + '-' +
                         (typeof ex.target === 'object' ? ex.target.id : ex.target) + '-' + ex.type;
                existingEdgeKeys.add(ek);
            }
            for (var j = 0; j < newEdges.length; j++) {
                var ne = newEdges[j];
                var nk = ne.source + '-' + ne.target + '-' + ne.type;
                if (!existingEdgeKeys.has(nk)) {
                    mgState.edges.push(ne);
                }
            }

            mgUpdateSimulation(0.5);
        }

        function mgCollapseNode(nodeId) {
            // 递归查找所有后代
            var descendants = new Set();
            var queue = [nodeId];
            while (queue.length > 0) {
                var current = queue.shift();
                for (var i = 0; i < mgState.edges.length; i++) {
                    var e = mgState.edges[i];
                    if (e.type !== 'hierarchy') continue;
                    var sid = typeof e.source === 'object' ? e.source.id : e.source;
                    var tid = typeof e.target === 'object' ? e.target.id : e.target;
                    if (sid === current && !descendants.has(tid)) {
                        descendants.add(tid);
                        queue.push(tid);
                    }
                }
            }

            descendants.forEach(function(did) {
                mgState.nodes.delete(did);
                mgState.expandedSet.delete(did);
            });

            mgState.edges = mgState.edges.filter(function(e) {
                var sid = typeof e.source === 'object' ? e.source.id : e.source;
                var tid = typeof e.target === 'object' ? e.target.id : e.target;
                return !descendants.has(sid) && !descendants.has(tid);
            });

            mgState.expandedSet.delete(nodeId);

            if (descendants.has(mgState.selectedNodeId)) {
                mgState.selectedNodeId = nodeId;
            }

            mgUpdateSimulation(0.3);
        }

        // ---- 数据加载 ----

        function mgLoadFullData(data) {
            var nodes = mgSnapshotNodes(data);
            var expectedNodes = data && data.stats && Number(data.stats.total_nodes || 0);
            if (nodes.length === 0) {
                if (data && data.replace_existing_snapshot === true && !data.unavailable_reason && expectedNodes === 0) {
                    mgState.nodes.clear();
                    mgState.edges = [];
                    mgState.expandedSet.clear();
                    mgState.selectedNodeId = null;
                    mgNeedsSnapshotRefresh = false;
                    renderMemoryGraph();
                }
                updateMemoryGraphStats(data && data.stats);
                if (isMemoryGraphViewVisible() && (data && data.unavailable_reason || expectedNodes > 0)) {
                    scheduleMemoryGraphFallbackFetch();
                }
                return;
            }
            mgState.nodes.clear();
            mgState.edges = [];
            mgState.expandedSet.clear();

            for (var i = 0; i < nodes.length; i++) {
                mgState.nodes.set(nodes[i].id, nodes[i]);
            }

            mgState.edges = mgSnapshotEdges(data).map(function(e) {
                return {
                    source: typeof e.source === 'object' ? e.source.id : e.source,
                    target: typeof e.target === 'object' ? e.target.id : e.target,
                    type: e.type, weight: e.weight, protected: e.protected
                };
            });

            if (data.active_node_ids) {
                mgState.activeNodeIds = new Set(data.active_node_ids);
            }

            mgUserViewportChanged = false;
            mgNeedsSnapshotRefresh = false;
            renderMemoryGraph();
            scheduleMemoryGraphFit(true);
        }

        function mgSnapshotNodes(data) {
            var merged = [];
            var seen = new Set();
            function addList(list) {
                list = list || [];
                for (var i = 0; i < list.length; i++) {
                    var nd = list[i];
                    if (!nd || !nd.id || seen.has(nd.id)) continue;
                    seen.add(nd.id);
                    merged.push(nd);
                }
            }
            addList(data && data.nodes);
            if (data && data.execution_view) addList(data.execution_view.nodes);
            return merged;
        }

        function mgSnapshotEdges(data) {
            var merged = [];
            var seen = new Set();
            function edgeKey(e) {
                if (!e) return '';
                var sid = typeof e.source === 'object' ? e.source.id : e.source;
                var tid = typeof e.target === 'object' ? e.target.id : e.target;
                return String(sid || '') + '|' + String(tid || '') + '|' + String(e.type || '');
            }
            function addList(list) {
                list = list || [];
                for (var i = 0; i < list.length; i++) {
                    var e = list[i];
                    var k = edgeKey(e);
                    if (!k || seen.has(k)) continue;
                    seen.add(k);
                    merged.push(e);
                }
            }
            addList(data && data.edges);
            if (data && data.execution_view) addList(data.execution_view.edges);
            return merged;
        }

        function mgMergeSnapshotPayload(existing, incoming) {
            incoming = incoming || {};
            var reset = !existing || incoming.update_type === 'full' ||
                (incoming.snapshot_id && existing.snapshot_id && incoming.snapshot_id !== existing.snapshot_id);
            var merged = reset ? {} : existing;
            Object.keys(incoming).forEach(function(key) {
                if (key !== 'nodes' && key !== 'edges' && key !== 'execution_view') {
                    merged[key] = incoming[key];
                }
            });

            function mergeByKey(oldList, nextList, keyFn) {
                var map = new Map();
                (oldList || []).forEach(function(item) {
                    var key = keyFn(item);
                    if (key) map.set(key, item);
                });
                (nextList || []).forEach(function(item) {
                    var key = keyFn(item);
                    if (key) map.set(key, item);
                });
                return Array.from(map.values());
            }

            merged.nodes = mergeByKey(
                reset ? [] : (merged.nodes || []),
                incoming.nodes || [],
                function(node) { return node && node.id ? String(node.id) : ''; }
            );
            merged.edges = mergeByKey(
                reset ? [] : (merged.edges || []),
                incoming.edges || [],
                function(edge) {
                    if (!edge) return '';
                    var sid = typeof edge.source === 'object' ? edge.source.id : edge.source;
                    var tid = typeof edge.target === 'object' ? edge.target.id : edge.target;
                    return String(sid || '') + '|' + String(tid || '') + '|' + String(edge.type || '');
                }
            );

            if (incoming.execution_view || (!reset && merged.execution_view)) {
                var oldView = reset ? {} : (merged.execution_view || {});
                var nextView = incoming.execution_view || {};
                merged.execution_view = {
                    nodes: mergeByKey(
                        oldView.nodes || [],
                        nextView.nodes || [],
                        function(node) { return node && node.id ? String(node.id) : ''; }
                    ),
                    edges: mergeByKey(
                        oldView.edges || [],
                        nextView.edges || [],
                        function(edge) {
                            if (!edge) return '';
                            var sid = typeof edge.source === 'object' ? edge.source.id : edge.source;
                            var tid = typeof edge.target === 'object' ? edge.target.id : edge.target;
                            return String(sid || '') + '|' + String(tid || '') + '|' + String(edge.type || '');
                        }
                    ),
                    execution_node_ids: Array.from(new Set(
                        (oldView.execution_node_ids || []).concat(nextView.execution_node_ids || [])
                    )),
                    stats: nextView.stats || oldView.stats || {}
                };
            }

            merged.update_type = 'full';
            return merged;
        }

        function handleMemoryGraphUpdate(data) {
            if (!data) return;

            if (data.stats) {
                mgLastSnapshotStats = Object.assign({}, mgLastSnapshotStats || {}, data.stats);
            }

            if (data.active_node_ids) {
                mgState.activeNodeIds = new Set(data.active_node_ids);
            }

            if (data.update_type === 'summary') {
                if (data.stats) updateMemoryGraphStats(data.stats);
                scheduleMemoryGraphRealtimeRefresh(350);
                return;
            }

            if (data.update_type === 'full' || data.update_type === 'full_chunk' || !mgInitialized) {
                var replaceExistingSnapshot = data.replace_existing_snapshot === true;
                if (data.snapshot_id || data.update_type === 'full_chunk') {
                    mgPendingFullData = mgMergeSnapshotPayload(mgPendingFullData, data);
                    if (replaceExistingSnapshot) {
                        mgPendingFullData.replace_existing_snapshot = true;
                    }
                    data = mgPendingFullData;
                    if (data.chunk_total && data.chunk_total > 1 && data.is_last_chunk !== true) {
                        if (data.stats) updateMemoryGraphStats(data.stats);
                        if (data.thought_view) updateThoughtView(data.thought_view);
                        return;
                    }
                }
                if (currentGraphTab === 'memory') {
                    if (!mgInitialized) initMemoryGraph();
                    if (mgState.nodes.size === 0 || data.replace_existing_snapshot === true || mgNeedsSnapshotRefresh) {
                        mgLoadFullData(data);
                    } else {
                        mgMergeFullUpdate(data);
                        mgNeedsSnapshotRefresh = false;
                    }
                    if (data.is_last_chunk) {
                        mgPendingFullData = null;
                    }
                } else {
                    mgPendingFullData = data;
                    if (data.replace_existing_snapshot === true) {
                        mgNeedsSnapshotRefresh = false;
                    }
                    if (data.stats) updateMemoryGraphStats(data.stats);
                }
            } else if (data.update_type === 'delta') {
                // CRG 流式索引 delta: 仅在记忆图谱 tab 激活时实时应用
                if (data.changes && data.changes.length > 0 && mgInitialized && currentGraphTab === 'memory') {
                    mgApplyDelta(data.changes);
                    mgNeedsSnapshotRefresh = false;
                    if (data.changes.some(function(ch) { return ch && ch.action === 'remove_node'; })) {
                        requestSessionListRefresh(250);
                    }
                } else if (data.changes && data.changes.length > 0) {
                    mgNeedsSnapshotRefresh = true;
                    if (data.changes.some(function(ch) { return ch && ch.action === 'remove_node'; })) {
                        requestSessionListRefresh(250);
                    }
                } else {
                    if (data.stats) updateMemoryGraphStats(data.stats);
                    scheduleMemoryGraphRealtimeRefresh(350);
                    requestSessionListRefresh(500);
                }
            }

            // 更新思维可视化浮动窗口
            if (data.thought_view) {
                updateThoughtView(data.thought_view);
            }
        }

        // ── 代码锚点缓存与事件处理 ──────────────────────────
        var codeAnchorCache = new Map(); // anchor_id -> anchor data

        function handleCodeAnchorUpdate(data) {
            if (!data || !data.payload) return;
            var payload = data.payload || data;
            var changes = payload.changes || [];
            
            for (var i = 0; i < changes.length; i++) {
                var change = changes[i];
                if (change.action === 'add_anchor' && change.data) {
                    codeAnchorCache.set(change.data.id, change.data);
                } else if (change.action === 'remove_anchor' && change.data) {
                    codeAnchorCache.delete(change.data.id);
                }
            }

            // 如果当前选中的节点有锚点关联，刷新详情面板
            if (mgState.selectedNodeId) {
                var selNode = mgState.nodes.get(mgState.selectedNodeId);
                if (selNode && selNode.metadata && selNode.metadata.code_anchors) {
                    showMgNodeDetail(selNode);
                }
            }
            
            console.log('[CodeAnchor] 缓存更新, 总计:', codeAnchorCache.size);
        }

        // ── 请求后端推送最新 MemoryGraph 快照 ─────────────────
        function isMemoryGraphViewVisible() {
            var activeTab = document.querySelector('.graph-tab-btn.active');
            var memoryView = document.getElementById('graphViewMemory');
            return currentGraphTab === 'memory' ||
                (activeTab && activeTab.dataset && activeTab.dataset.view === 'memory') ||
                (memoryView && memoryView.classList.contains('active'));
        }

        function ensureMemoryGraphVisibleData() {
            if (!isMemoryGraphViewVisible()) {
                return;
            }
            currentGraphTab = 'memory';
            if (!mgInitialized) {
                initMemoryGraph();
            }
            if (mgState.nodes.size > 0 && !mgNeedsSnapshotRefresh) {
                renderMemoryGraph();
                return;
            }
            fetchMemoryGraphSnapshot({ replaceExisting: mgState.nodes.size > 0 });
        }

        function scheduleMemoryGraphFallbackFetch() {
            if (mgFallbackFetchTimer) {
                clearTimeout(mgFallbackFetchTimer);
            }
            mgFallbackFetchTimer = setTimeout(function() {
                mgFallbackFetchTimer = null;
                if (!isMemoryGraphViewVisible() || (mgState.nodes.size > 0 && !mgNeedsSnapshotRefresh)) {
                    return;
                }
                fetchMemoryGraphSnapshot({ replaceExisting: mgState.nodes.size > 0 });
            }, 1500);
        }

        function scheduleMemoryGraphRealtimeRefresh(delayMs) {
            mgNeedsSnapshotRefresh = true;
            if (!isMemoryGraphViewVisible()) {
                return;
            }
            if (mgRealtimeRefreshTimer) {
                clearTimeout(mgRealtimeRefreshTimer);
            }
            mgRealtimeRefreshTimer = setTimeout(function() {
                mgRealtimeRefreshTimer = null;
                fetchMemoryGraphSnapshot({
                    includeExecution: true,
                    replaceExisting: true,
                    realtime: true
                });
            }, delayMs || 350);
        }

        function requestMemoryGraph() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                mgNeedsSnapshotRefresh = true;
                sendWsMessage({ type: 'REQUEST_MEMORY_GRAPH' });
                console.log('[MG] 已发送 REQUEST_MEMORY_GRAPH');
                scheduleMemoryGraphFallbackFetch();
            } else {
                console.warn('[MG] WebSocket 未连接，无法请求 MemoryGraph');
                if (currentGraphTab === 'memory') {
                    fetchMemoryGraphSnapshot({ replaceExisting: mgState.nodes.size > 0 });
                }
            }
        }

        function fetchMemoryGraphSnapshot(options) {
            options = options || {};
            if (mgSnapshotFetchInFlight) {
                if (options.replaceExisting === true || options.realtime === true) {
                    mgSnapshotFetchQueued = true;
                }
                return;
            }
            mgSnapshotFetchInFlight = true;
            var summaryOnly = options.summaryOnly === true;
            var includeExecution = options.includeExecution !== undefined ? !!options.includeExecution : !summaryOnly;
            var replaceExisting = options.replaceExisting === true;
            var url = '/api/memory-graph/snapshot?summary_only=' + (summaryOnly ? 'true' : 'false') +
                '&include_execution=' + (includeExecution ? 'true' : 'false');
            fetch(url)
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    if (data && data.nodes) {
                        data.type = 'MEMORY_GRAPH_UPDATE';
                        data = mgMergeSnapshotPayload(null, data);
                        if (replaceExisting) {
                            data.replace_existing_snapshot = true;
                        }
                        handleMemoryGraphUpdate(data);
                    }
                })
                .catch(function(e) {
                    console.warn('[MG] REST 快照获取失败:', e);
                })
                .then(function() {
                    mgSnapshotFetchInFlight = false;
                    if (mgSnapshotFetchQueued) {
                        mgSnapshotFetchQueued = false;
                        scheduleMemoryGraphRealtimeRefresh(350);
                    }
                });
        }

        // ── CRG 索引事件处理 ──────────────────────────────────
        function handleCrgIndexUpdate(data) {
            var payload = data.payload || data;
            var filePath = payload.file_path || '';
            var symCount = payload.symbol_count || 0;
            var edgeCount = payload.edge_count || 0;
            console.log('[CRG] 文件索引:', filePath, '符号:', symCount, '边:', edgeCount);
        }

        function handleCrgIndexComplete(data) {
            var payload = data.payload || data;
            var projName = payload.project_name || '';
            var symCount = payload.symbol_count || 0;
            var edgeCount = payload.edge_count || 0;
            var fileCount = payload.file_count || 0;
            console.log('[CRG] 全量索引完成:', projName, 
                        '符号:', symCount, '边:', edgeCount, '文件:', fileCount);
            addMessage('[CRG] 索引完成: ' + projName + ' (' + fileCount + ' files, ' + symCount + ' symbols, ' + edgeCount + ' edges)', 'system', false);
            // 项目结构已注入任务图谱，确保用户在任务图谱 tab 上看到
            if (currentGraphTab !== 'task') {
                switchGraphTab('task');
            }
        }

        function handleProgressReport(data) {
            var p = data.payload || {};
            var r = p.report || {};
            var turn = p.turn || '?';
            var text = '[进度 T' + turn + '] ';
            if (r.total_nodes) {
                text += '完成:' + (r.completed_count || 0) +
                    ' 进行中:' + (r.in_progress_count || 0) +
                    ' 待处理:' + (r.pending_count || 0) +
                    ' 总计:' + (r.total_nodes || 0);
            } else {
                text += '当前轮次 ' + turn;
            }
            if (p.auto_continue_count) {
                text += ' (续期#' + p.auto_continue_count + ')';
            }
            if (p.type === 'renewal') {
                text += ' [已续期]';
            }
            addIdeSystemMessage(text);
        }

        // ── TSD v1.7 §23.8.1: 新增消息类型处理函数 ──

        function handleAttentionUpdate(data) {
            var p = data.payload || data || {};
            var mode = p.mode || 'global';
            var turn = p.turn || '?';
            var focusNode = p.focus_node_id || '';
            var budget = p.budget_usage !== undefined ? (p.budget_usage + '%') : '';
            var modeLabels = { global: '全局注意', single_chain: '单链注意', focus: '局部注意' };
            var label = modeLabels[mode] || mode;
            if (isIdeConnected) {
                addIdeSystemMessage('[注意] T' + turn + ' ' + label + (budget ? ' (预算:' + budget + ')' : '') + (focusNode ? ' 焦点:' + focusNode : ''));
            }
        }

        function handleGraphMemoryDiff(data) {
            var p = data.payload || data || {};
            var changes = p.memory_changes || {};
            var created = changes.created || 0;
            var strengthened = changes.strengthened || 0;
            var pruned = changes.pruned || 0;
            if (created > 0 || strengthened > 0 || pruned > 0) {
                if (isIdeConnected) {
                    addIdeSystemMessage('[记忆] 新增:' + created + ' 强化:' + strengthened + ' 淘汰:' + pruned);
                }
            }
        }

        function handleToolPrediction(data) {
            var p = data.payload || data || {};
            var predictions = p.predictions || p.suggested_tools || p.predicted_tools || p.tools || [];

                var toolNames = predictions.map(function(t) {
                    return typeof t === 'string' ? t : (t.name || t.tool_name || '');
                }).filter(Boolean);
                if (toolNames.length) {
                    var pairId = p.pair_id || p.interaction_id || ('tool-prediction-' + (p.turn || Date.now()));
                    renderInteractionEvent({
                        payload: {
                            pair_id: pairId,
                            tool_names: toolNames,

                                kind: 'plan',
                                status: 'running',

            fetch('/api/ide/sessions')
                .then(function(r) { return r.json(); })

        function mgMergeFullUpdate(data) {
            var newNodes = mgSnapshotNodes(data);
            var newNodeMap = {};
            for (var i = 0; i < newNodes.length; i++) {
                newNodeMap[newNodes[i].id] = newNodes[i];
            }

            mgState.nodes.forEach(function(existing, id) {
                if (newNodeMap[id]) {
                    existing.label = newNodeMap[id].label;
                    existing.activation = newNodeMap[id].activation;
                    existing.metadata = newNodeMap[id].metadata;
                    existing.children_count = newNodeMap[id].children_count || 0;
                }
            });

            var hasParent = new Set();
            var allEdges = mgSnapshotEdges(data);
            for (var j = 0; j < allEdges.length; j++) {
                if (allEdges[j].type === 'hierarchy') {
                    hasParent.add(typeof allEdges[j].target === 'object' ? allEdges[j].target.id : allEdges[j].target);
                }
            }

            for (var i = 0; i < newNodes.length; i++) {
                var nd = newNodes[i];
                if (!mgState.nodes.has(nd.id) && (!hasParent.has(nd.id) || mgIsExecutionNode(nd) || data.execution_view)) {
                    mgState.nodes.set(nd.id, nd);
                }
            }

            var toRemove = [];
            mgState.nodes.forEach(function(existing, id) {
                if (!newNodeMap[id] && !mgState.expandedSet.has(id)) {
                    var isDescendant = false;
                    mgState.edges.forEach(function(e) {
                        if (e.type === 'hierarchy') {
                            var tid = typeof e.target === 'object' ? e.target.id : e.target;
                            if (tid === id) isDescendant = true;
                        }
                    });
                    if (!isDescendant) toRemove.push(id);
                }
            });
            for (var r = 0; r < toRemove.length; r++) {
                mgState.nodes.delete(toRemove[r]);
            }

            var existingEdgeKeys = new Set();
            for (var e0 = 0; e0 < mgState.edges.length; e0++) {
                var oldEdge = mgState.edges[e0];
                var oldSource = typeof oldEdge.source === 'object' ? oldEdge.source.id : oldEdge.source;
                var oldTarget = typeof oldEdge.target === 'object' ? oldEdge.target.id : oldEdge.target;
                existingEdgeKeys.add(String(oldSource || '') + '|' + String(oldTarget || '') + '|' + String(oldEdge.type || ''));
            }
            for (var e1 = 0; e1 < allEdges.length; e1++) {
                var nextEdge = allEdges[e1];
                var nextSource = typeof nextEdge.source === 'object' ? nextEdge.source.id : nextEdge.source;
                var nextTarget = typeof nextEdge.target === 'object' ? nextEdge.target.id : nextEdge.target;
                var nextKey = String(nextSource || '') + '|' + String(nextTarget || '') + '|' + String(nextEdge.type || '');
                if (!existingEdgeKeys.has(nextKey)) {
                    mgState.edges.push({
                        source: nextSource,
                        target: nextTarget,
                        type: nextEdge.type,
                        weight: nextEdge.weight,
                        protected: nextEdge.protected
                    });
                    existingEdgeKeys.add(nextKey);
                }
            }

            renderMemoryGraph();
            scheduleMemoryGraphFit(false);
        }

        function mgApplyDelta(changes) {
            // 先收集本批次新增的 hierarchy 边，判断哪些新节点的父节点已展开
            var newHierarchyEdges = {};
            for (var p = 0; p < changes.length; p++) {
                var ce = changes[p];
                if (ce.action === 'add_edge' && ce.data && ce.data.type === 'hierarchy') {
                    newHierarchyEdges[ce.data.target] = ce.data.source;
                }
            }

            for (var i = 0; i < changes.length; i++) {
                var ch = changes[i];
                if (ch.action === 'add_node') {
                    var nodeData = ch.data;
                    if (nodeData && nodeData.id && !mgState.nodes.has(nodeData.id)) {
                        // 只添加可见节点：父节点已展开，或无层级父边的新根节点
                        var hierParent = newHierarchyEdges[nodeData.id];
                        if (hierParent) {
                            // 有层级父节点 — 仅当父节点已展开时添加
                            if (mgState.expandedSet.has(hierParent)) {
                                mgState.nodes.set(nodeData.id, nodeData);
                            }
                        }
                        // 无层级父边的新节点不直接添加（属于虚拟分组，下次全量更新时体现）
                    }
                } else if (ch.action === 'update_node') {
                    var nd = mgState.nodes.get(ch.data && ch.data.id);
                    if (nd && ch.data) {
                        if (ch.data.label !== undefined) nd.label = ch.data.label;
                        if (ch.data.activation !== undefined) nd.activation = ch.data.activation;
                        if (ch.data.metadata !== undefined) nd.metadata = ch.data.metadata;
                    }
                } else if (ch.action === 'remove_node') {
                    if (ch.data && ch.data.id) {
                        mgState.nodes.delete(ch.data.id);
                        mgState.expandedSet.delete(ch.data.id);
                    }
                } else if (ch.action === 'add_edge') {
                    if (ch.data) {
                        mgState.edges.push(ch.data);
                        if (ch.data.type === 'hierarchy') {
                            var parent = mgState.nodes.get(ch.data.source);
                            if (parent) parent.children_count = (parent.children_count || 0) + 1;
                        }
                    }
                } else if (ch.action === 'remove_edge') {
                    if (ch.data) {
                        mgState.edges = mgState.edges.filter(function(e) {
                            var sid = typeof e.source === 'object' ? e.source.id : e.source;
                            var tid = typeof e.target === 'object' ? e.target.id : e.target;
                            return !(sid === ch.data.source && tid === ch.data.target);
                        });
                        if (ch.data.type === 'hierarchy') {
                            var parent = mgState.nodes.get(ch.data.source);
                            if (parent && parent.children_count > 0) parent.children_count--;
                        }
                    }
                }
            }
            renderMemoryGraph();
            scheduleMemoryGraphFit(false);
        }

                        html += '</div>';
                    }
                    html += '</div>';
                }
            }

            // 通用 metadata 展示（排除已显示的字段）
            const shownKeys = new Set(['sub_type', 'request_id', 'goal', 'total_turns', 'status',
                'completed_at', 'turn', 'tool_name', 'content', 'role', 'type', 'desc', 'result_preview', 'path',
                'graph_id', 'graph_address', 'task_graph_address', 'phase', 'pair_id', 'task_graph_id',
                'risk_level', 'approval_mode', 'decision', 'success', 'latency_ms', 'source_event_id',
                'action_summary', 'arguments_summary', 'content_summary', 'affected_files', 'is_execution_event']);
            const extraMeta = Object.entries(meta).filter(([k]) => !shownKeys.has(k));
            if (extraMeta.length > 0) {
                html += '<div class="mg-detail-field">';
                html += '<div class="mg-detail-field-label">其他属性</div>';
                html += '<div class="mg-detail-content-box">';
                for (const [k, v] of extraMeta) {
                    const val = typeof v === 'object' ? JSON.stringify(v) : String(v);
                    html += '<div><span style="color:#64748b">' + escHtml(k) + ':</span> ' + escHtml(val) + '</div>';
                }
                html += '</div></div>';
            }

            // 邻居节点列表
            const neighbors = findMgNeighbors(nodeData.id);
            if (neighbors.length > 0) {
                html += '<div class="mg-detail-field">';
                html += '<div class="mg-detail-field-label">关联节点 (' + neighbors.length + ')</div>';
                html += '<ul class="mg-detail-neighbors">';
                for (const nb of neighbors) {
                    const nbColor = MG_COLORS[nb.type] || '#64748b';
                    html += '<li onclick="navigateToMgNode(\'' + escHtml(nb.id) + '\')">';
                    html += '<span class="mg-neighbor-dot" style="background:' + nbColor + '"></span>';
                    html += '<span>' + escHtml((nb.label || nb.id).substring(0, 30)) + '</span>';
                    html += '<span style="margin-left:auto;font-size:9px;color:#475569">' + nb.edgeType + '</span>';
                    html += '</li>';
                }
                html += '</ul></div>';
            }

            // 代码锚点占位容器
            var anchorIds = (meta.code_anchors && Array.isArray(meta.code_anchors)) ? meta.code_anchors : [];
            if (anchorIds.length > 0) {
                html += '<div id="mg-code-anchors-container"></div>';
            }

            body.innerHTML = html;

            // 渲染代码锚点（DOM 已就绪后）
            if (anchorIds.length > 0) {
                renderCodeAnchorsSection(anchorIds, 'mg-code-anchors-container');
            }
        }

        function closeMgDetail() {
            const panel = document.getElementById('mgDetailPanel');
            if (panel) panel.classList.add('collapsed');
            mgSelectedNodeId = null;
            mgState.selectedNodeId = null;
            // 取消高亮
            const g = d3.select('#mgRoot');
            if (g) g.selectAll('.mg-main-circle').attr('stroke', '#1e293b').attr('stroke-width', 1.5);
        }

        function findMgNeighbors(nodeId) {
            var edges = mgState.edges;
            var result = [];
            for (var i = 0; i < edges.length; i++) {
                var e = edges[i];
                var sid = typeof e.source === 'object' ? e.source.id : e.source;
                var tid = typeof e.target === 'object' ? e.target.id : e.target;
                if (sid === nodeId) {
                    var nd = mgState.nodes.get(tid);
                    if (nd) result.push(Object.assign({}, nd, { edgeType: e.type || 'ref' }));
                } else if (tid === nodeId) {
                    var nd = mgState.nodes.get(sid);
                    if (nd) result.push(Object.assign({}, nd, { edgeType: e.type || 'ref' }));
                }
            }
            return result;
        }

        function navigateToMgNode(nodeId) {
            var target = mgState.nodes.get(nodeId);
            if (target) {
                mgState.selectedNodeId = nodeId;
                showMgNodeDetail(target);
                // 高亮目标节点
                var g = d3.select('#mgRoot');
                g.selectAll('.mg-main-circle').attr('stroke', '#1e293b').attr('stroke-width', 1.5);
                g.selectAll('.mg-node').each(function(d) {
                    if (d.id === nodeId) {
                        d3.select(this).select('.mg-main-circle').attr('stroke', '#f59e0b').attr('stroke-width', 3);
                    }
                });
            }
        }

        // ===== 思维可视化浮动窗口 (Thought View) =====

        let tvSimulation = null;
        let tvInitialized = false;
        let tvMinimized = false;
        let tvVisible = true;
        let tvState = { nodes: new Map(), edges: [], centerIds: new Set() };
        let tvUpdateTimer = null;

        function initThoughtView() {
            if (tvInitialized) return;
            tvInitialized = true;

            var svgEl = document.getElementById('thoughtViewSvg');
            if (!svgEl) return;
            var svg = d3.select(svgEl);
            svg.selectAll('*').remove();

            // defs - arrowhead
            var defs = svg.append('defs');
            defs.append('marker')
                .attr('id', 'tv-arrow')
                .attr('viewBox', '0 -3 6 6')
                .attr('refX', 12).attr('refY', 0)
                .attr('markerWidth', 5).attr('markerHeight', 5)
                .attr('orient', 'auto')
                .append('path')
                .attr('d', 'M0,-3L6,0L0,3')
                .attr('fill', '#475569');

            var g = svg.append('g').attr('id', 'tvRoot');

            var body = document.getElementById('tvBody');
            var rect = body.getBoundingClientRect();
            var w = rect.width || 300;
            var h = rect.height || 220;

            tvSimulation = d3.forceSimulation()
                .force('charge', d3.forceManyBody().strength(-60))
                .force('center', d3.forceCenter(w / 2, h / 2))
                .force('collision', d3.forceCollide().radius(function(d) {
                    return d.is_center ? 8 + (d.activation || 0) * 10 : 6;
                }))
                .force('link', d3.forceLink().id(function(d) { return d.id; }).distance(50))
                .on('tick', tvTick)
                .stop();

            setupTvDrag();
            setupTvResize();
        }

        function updateThoughtView(data) {
            if (!data) return;
            // 节流 150ms
            if (tvUpdateTimer) clearTimeout(tvUpdateTimer);
            tvUpdateTimer = setTimeout(function() {
                _doUpdateThoughtView(data);
            }, 150);
        }

        function _doUpdateThoughtView(data) {
            if (!tvInitialized) initThoughtView();

            var nodes = data.nodes || [];
            var edges = data.edges || [];
            var centerIds = new Set(data.center_ids || []);

            // 更新状态
            tvState.nodes.clear();
            nodes.forEach(function(n) {
                n.is_center = centerIds.has(n.id);
                tvState.nodes.set(n.id, n);
            });
            tvState.edges = edges;
            tvState.centerIds = centerIds;

            // 更新节点计数
            var countEl = document.getElementById('tvNodeCount');
            if (countEl) countEl.textContent = '(' + nodes.length + ')';

            // 空态处理
            var hint = document.getElementById('tvEmptyHint');
            var svgEl = document.getElementById('thoughtViewSvg');
            if (nodes.length === 0) {
                if (hint) hint.style.display = 'flex';
                if (svgEl) svgEl.style.display = 'none';
                return;
            } else {
                if (hint) hint.style.display = 'none';
                if (svgEl) svgEl.style.display = '';
            }

            renderThoughtView();
        }

        function renderThoughtView() {
            var g = d3.select('#tvRoot');
            if (g.empty()) return;

            var nodes = Array.from(tvState.nodes.values());
            var edges = tvState.edges.map(function(e) {
                return {
                    source: e.source,
                    target: e.target,
                    type: e.type,
                    weight: e.weight || 0.5,
                };
            });

            // 边
            var linkSel = g.selectAll('.tv-link').data(edges, function(d) {
                var s = typeof d.source === 'object' ? d.source.id : d.source;
                var t = typeof d.target === 'object' ? d.target.id : d.target;
                return s + '->' + t;
            });
            linkSel.exit().remove();
            var linkEnter = linkSel.enter().append('line')
                .attr('class', 'tv-link')
                .attr('marker-end', 'url(#tv-arrow)');
            var linkMerge = linkEnter.merge(linkSel);
            linkMerge.each(function(d) {
                var style = MG_EDGE_STYLES[d.type] || MG_EDGE_STYLES['reference'] || { stroke: '#475569', width: 1 };
                d3.select(this)
                    .attr('stroke', style.stroke)
                    .attr('stroke-width', Math.max(style.width * 0.7, 0.5));
            });

            // 节点
            var nodeSel = g.selectAll('.tv-node').data(nodes, function(d) { return d.id; });
            nodeSel.exit().remove();
            var nodeEnter = nodeSel.enter().append('g')
                .attr('class', function(d) { return 'tv-node' + (d.is_center ? ' tv-node-center' : ''); });

            nodeEnter.append('circle');
            nodeEnter.append('text').attr('class', 'tv-node-label');
            // tooltip on hover for neighbor nodes
            nodeEnter.append('title');

            var nodeMerge = nodeEnter.merge(nodeSel);

            nodeMerge.attr('class', function(d) { return 'tv-node' + (d.is_center ? ' tv-node-center' : ''); });

            nodeMerge.select('circle')
                .attr('r', function(d) {
                    return d.is_center ? 6 + (d.activation || 0) * 10 : 4;
                })
                .attr('fill', function(d) {
                    var color = MG_COLORS[d.type] || '#94a3b8';
                    return color;
                })
                .attr('opacity', function(d) { return d.is_center ? 1 : 0.5; })
                .attr('stroke', function(d) {
                    if (!d.is_center) return 'none';
                    return MG_COLORS[d.type] || '#f59e0b';
                })
                .attr('stroke-width', function(d) { return d.is_center ? 2 : 0; })
                .style('filter', function(d) {
                    if (!d.is_center) return 'none';
                    var intensity = Math.round((d.activation || 0) * 12);
                    var color = MG_COLORS[d.type] || '#f59e0b';
                    return 'drop-shadow(0 0 ' + intensity + 'px ' + color + ')';
                });

            // 标签：活跃节点始终显示，邻居节点隐藏
            nodeMerge.select('text.tv-node-label')
                .attr('dy', function(d) {
                    var r = d.is_center ? 6 + (d.activation || 0) * 10 : 4;
                    return -(r + 3);
                })
                .attr('text-anchor', 'middle')
                .attr('display', function(d) { return d.is_center ? null : 'none'; })
                .text(function(d) { return (d.label || '').substring(0, 8); });

            // tooltip
            nodeMerge.select('title')
                .text(function(d) {
                    var act = d.activation ? ' (act: ' + d.activation.toFixed(2) + ')' : '';
                    return (d.label || d.id) + act;
                });

            // 更新 simulation
            tvSimulation.nodes(nodes);
            tvSimulation.force('link').links(edges);
            tvSimulation.alpha(0.6).restart();
        }

        function tvTick() {
            var g = d3.select('#tvRoot');
            g.selectAll('.tv-link')
                .attr('x1', function(d) { return d.source.x || 0; })
                .attr('y1', function(d) { return d.source.y || 0; })
                .attr('x2', function(d) { return d.target.x || 0; })
                .attr('y2', function(d) { return d.target.y || 0; });
            g.selectAll('.tv-node')
                .attr('transform', function(d) { return 'translate(' + (d.x || 0) + ',' + (d.y || 0) + ')'; });
        }

        // 拖拽移动
        function setupTvDrag() {
            var header = document.getElementById('tvHeader');
            var win = document.getElementById('thoughtViewWindow');
            if (!header || !win) return;

            var startX, startY, startLeft, startTop;

            header.addEventListener('mousedown', function(e) {
                if (e.target.closest('.tv-btn')) return;
                e.preventDefault();
                var rect = win.getBoundingClientRect();
                startX = e.clientX;
                startY = e.clientY;
                startLeft = rect.left;
                startTop = rect.top;

                function onMove(ev) {
                    var dx = ev.clientX - startX;
                    var dy = ev.clientY - startY;
                    var newLeft = Math.max(0, Math.min(window.innerWidth - 40, startLeft + dx));
                    var newTop = Math.max(0, Math.min(window.innerHeight - 40, startTop + dy));
                    win.style.left = newLeft + 'px';
                    win.style.top = newTop + 'px';
                    win.style.right = 'auto';
                    win.style.bottom = 'auto';
                }
                function onUp() {
                    document.removeEventListener('mousemove', onMove);
                    document.removeEventListener('mouseup', onUp);
                }
                document.addEventListener('mousemove', onMove);
                document.addEventListener('mouseup', onUp);
            });
        }

        // Resize
        function setupTvResize() {
            var handle = document.getElementById('tvResizeHandle');
            var win = document.getElementById('thoughtViewWindow');
            if (!handle || !win) return;

            handle.addEventListener('mousedown', function(e) {
                e.preventDefault();
                e.stopPropagation();
                var startX = e.clientX;
                var startY = e.clientY;
                var startW = win.offsetWidth;
                var startH = win.offsetHeight;

                function onMove(ev) {
                    var newW = Math.max(200, Math.min(600, startW + (ev.clientX - startX)));
                    var newH = Math.max(160, Math.min(500, startH + (ev.clientY - startY)));
                    win.style.width = newW + 'px';
                    win.style.height = newH + 'px';
                    // 更新 force center
                    if (tvSimulation) {
                        var body = document.getElementById('tvBody');
                        if (body) {
                            var rect = body.getBoundingClientRect();
                            tvSimulation.force('center', d3.forceCenter(rect.width / 2, rect.height / 2));
                            tvSimulation.alpha(0.3).restart();
                        }
                    }
                }
                function onUp() {
                    document.removeEventListener('mousemove', onMove);
                    document.removeEventListener('mouseup', onUp);
                }
                document.addEventListener('mousemove', onMove);
                document.addEventListener('mouseup', onUp);
            });
        }

        function toggleTvMinimize() {
            var win = document.getElementById('thoughtViewWindow');
            if (!win) return;
            tvMinimized = !tvMinimized;
            win.classList.toggle('tv-minimized', tvMinimized);
            if (!tvMinimized && tvSimulation && tvState.nodes.size > 0) {
                tvSimulation.alpha(0.3).restart();
            }
        }

        function toggleTvVisible(show) {
            var win = document.getElementById('thoughtViewWindow');
            if (!win) return;
            if (typeof show === 'boolean') {
                tvVisible = show;
            } else {
                tvVisible = !tvVisible;
            }
            win.classList.toggle('tv-hidden', !tvVisible);
            if (tvVisible && tvSimulation && tvState.nodes.size > 0) {
                tvSimulation.alpha(0.3).restart();
            }
        }

        // 页面 resize 时检查浮动窗口位置
        window.addEventListener('resize', function() {
            var win = document.getElementById('thoughtViewWindow');
            if (!win || !tvVisible) return;
            var rect = win.getBoundingClientRect();
            if (rect.left > window.innerWidth - 40) {
                win.style.left = (window.innerWidth - 60) + 'px';
                win.style.right = 'auto';
            }
            if (rect.top > window.innerHeight - 40) {
                win.style.top = (window.innerHeight - 60) + 'px';
                win.style.bottom = 'auto';
            }
        });

        // ── 双向导航：记忆图谱 <-> 任务图谱 ──

        function navigateToTaskGraphNode(taskNodeId) {
            switchGraphTab('task');
            setTimeout(function() {
                var gnodeEl = document.querySelector('.gnode[data-id="' + taskNodeId + '"]');
                if (gnodeEl) {
                    gnodeEl.dispatchEvent(new Event('click', { bubbles: true }));
                    gnodeEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
                if (typeof onGraphSelect === 'function' && typeof gnodeMap !== 'undefined') {
                    try { onGraphSelect(taskNodeId, gnodeMap, G_D_EDGES); } catch(e) {}
                }
            }, 200);
        }

        function navigateToMemoryGraphNode(memNodeId) {
            switchGraphTab('memory');
            setTimeout(function() {
                var target = mgState.nodes.get(memNodeId);
                if (target && target.x !== undefined) {
                    mgState.selectedNodeId = memNodeId;
                    showMgNodeDetail(target);
                    // 平移 SVG 视图到目标节点位置
                    var svg = d3.select('#memoryGraphSvg');
                    var rect = svg.node().parentElement.getBoundingClientRect();
                    var cx = rect.width / 2;
                    var cy = rect.height / 2;
                    var currentTransform = d3.zoomTransform(svg.node());
                    var scale = currentTransform && currentTransform.k ? currentTransform.k : 1;
                    mgSetZoomExtent(scale);
                    var transform = d3.zoomIdentity
                        .translate(cx - target.x * scale, cy - target.y * scale)
                        .scale(scale);
                    if (mgZoomBehavior) {
                        mgProgrammaticZoom = true;
                        svg.transition().duration(500).call(mgZoomBehavior.transform, transform);
                        updateMgZoomText(scale);
                        setTimeout(function() { mgProgrammaticZoom = false; }, 540);
                    }
                    // 高亮节点
                    var g = d3.select('#mgRoot');
                    g.selectAll('.mg-main-circle').attr('stroke', '#1e293b').attr('stroke-width', 1.5);
                    g.selectAll('.mg-node').each(function(d) {
                        if (d.id === memNodeId) {
                            d3.select(this).select('.mg-main-circle').attr('stroke', '#f59e0b').attr('stroke-width', 3);
                        }
                    });
                }
            }, 200);
        }

        function escHtml(str) {
            return escapeHtml(str);
        }

    </script>
</body>
</html>
