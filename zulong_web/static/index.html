        // 处理会话删除确认
        function handleSessionDeleted(sessionId, nodesDeleted) {
            console.log('[Session] 后端会话已删除:', sessionId, '节点数:', nodesDeleted);
            removeSessionsFromLocalStore([sessionId].filter(Boolean));
            requestSessionListRefresh(250);
            scheduleMemoryGraphRealtimeRefresh(250);
        }
        
        // HTML 转义
        function escapeHtml(text) {
            const el = document.createElement('div');
            el.textContent = text;
            return el.innerHTML;
        }

        function escapeAttr(text) {
            return escapeHtml(text).replace(/"/g, '&quot;');
        }

        function sanitizeHref(url) {
            if (!url) return '';
            try {
                var parsed = new URL(url, window.location.origin);
                var protocol = (parsed.protocol || '').toLowerCase();
                if (protocol === 'http:' || protocol === 'https:' || protocol === 'mailto:') {
                    return parsed.href;
                }
            } catch (e) {}
            return '';
        }

        function renderInlineMarkdown(text) {
            if (!text) return '';
            var raw = String(text);
            var tokenMap = [];

            function stash(html) {
                var key = '@@MD' + tokenMap.length + '@@';
                tokenMap.push(html);
                return key;
            }

            raw = raw.replace(/`([^`]+)`/g, function(_, code) {
                return stash('<code>' + escapeHtml(code) + '</code>');
            });

            raw = raw.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function(_, label, href) {
                var safeHref = sanitizeHref(href);
                var safeLabel = escapeHtml(label);
                if (!safeHref) return safeLabel;
                return stash('<a href="' + escapeAttr(safeHref) + '" target="_blank" rel="noopener noreferrer">' + safeLabel + '</a>');
            });

            var escaped = escapeHtml(raw);
            escaped = escaped.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
            escaped = escaped.replace(/(^|[^\*])\*([^*]+)\*/g, '$1<em>$2</em>');
            escaped = escaped.replace(/~~([^~]+)~~/g, '<del>$1</del>');

            return escaped.replace(/@@MD(\d+)@@/g, function(_, idx) {
                return tokenMap[Number(idx)] || '';
            });
        }

        function parseMarkdownTable(lines, startIndex) {
            var headerLine = lines[startIndex];
            var separatorLine = lines[startIndex + 1];
            if (!headerLine || !separatorLine) return null;
            if (headerLine.indexOf('|') === -1 || !/^\s*\|?[\s:-]+\|[\s|:-]*$/.test(separatorLine)) return null;

            var end = startIndex + 2;
            while (end < lines.length && lines[end].indexOf('|') !== -1 && lines[end].trim()) {
                end++;
            }

            function splitCells(line) {
                var trimmed = line.trim();
                if (trimmed.startsWith('|')) trimmed = trimmed.slice(1);
                if (trimmed.endsWith('|')) trimmed = trimmed.slice(0, -1);
                return trimmed.split('|').map(function(cell) { return renderInlineMarkdown(cell.trim()); });
            }

            var headers = splitCells(headerLine);
            var bodyRows = [];
            for (var i = startIndex + 2; i < end; i++) {
                bodyRows.push(splitCells(lines[i]));
            }

            var html = '<table><thead><tr>' +
                headers.map(function(cell) { return '<th>' + cell + '</th>'; }).join('') +
                '</tr></thead><tbody>';
            bodyRows.forEach(function(row) {
                html += '<tr>' + row.map(function(cell) { return '<td>' + cell + '</td>'; }).join('') + '</tr>';
            });
            html += '</tbody></table>';
            return { html: html, nextIndex: end };
        }

        function renderMarkdownHtml(markdown) {
            var text = cleanDisplayText(markdown || '');
            if (!text) return '';
            var lines = String(text).replace(/\r\n?/g, '\n').split('\n');
            var html = [];
            var i = 0;

            while (i < lines.length) {
                var line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                var fenceMatch = line.match(/^```([\w-]+)?\s*$/);
                if (fenceMatch) {
                    var language = fenceMatch[1] || '';
                    var codeLines = [];
                    i++;
                    while (i < lines.length && !/^```/.test(lines[i])) {
                        codeLines.push(lines[i]);
                        i++;
                    }
                    if (i < lines.length && /^```/.test(lines[i])) i++;
                    html.push('<pre><code' + (language ? ' class="language-' + escapeAttr(language) + '"' : '') + '>' + escapeHtml(codeLines.join('\n')) + '</code></pre>');
                    continue;
                }

                var table = parseMarkdownTable(lines, i);
                if (table) {
                    html.push(table.html);
                    i = table.nextIndex;
                    continue;
                }

                var headingMatch = line.match(/^(#{1,6})\s+(.*)$/);
                if (headingMatch) {
                    var level = headingMatch[1].length;
                    html.push('<h' + level + '>' + renderInlineMarkdown(headingMatch[2].trim()) + '</h' + level + '>');
                    i++;
                    continue;
                }

                if (/^\s*>\s?/.test(line)) {
                    var quoteLines = [];
                    while (i < lines.length && /^\s*>\s?/.test(lines[i])) {
                        quoteLines.push(renderInlineMarkdown(lines[i].replace(/^\s*>\s?/, '')));
                        i++;
                    }
                    html.push('<blockquote>' + quoteLines.join('<br>') + '</blockquote>');
                    continue;
                }

                if (/^\s*[-*+]\s+/.test(line)) {
                    var ulItems = [];
                    while (i < lines.length && /^\s*[-*+]\s+/.test(lines[i])) {
                        ulItems.push('<li>' + renderInlineMarkdown(lines[i].replace(/^\s*[-*+]\s+/, '')) + '</li>');
                        i++;
                    }
                    html.push('<ul>' + ulItems.join('') + '</ul>');
                    continue;
                }

                if (/^\s*\d+\.\s+/.test(line)) {
                    var olItems = [];
                    while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
                        olItems.push('<li>' + renderInlineMarkdown(lines[i].replace(/^\s*\d+\.\s+/, '')) + '</li>');
                        i++;
                    }
                    html.push('<ol>' + olItems.join('') + '</ol>');
                    continue;
                }

                var paragraphLines = [];
                while (i < lines.length && lines[i].trim() &&
                    !/^```/.test(lines[i]) &&
                    !/^(#{1,6})\s+/.test(lines[i]) &&
                    !/^\s*>\s?/.test(lines[i]) &&
                    !/^\s*[-*+]\s+/.test(lines[i]) &&
                    !/^\s*\d+\.\s+/.test(lines[i])) {
                    var maybeTable = parseMarkdownTable(lines, i);
                    if (maybeTable) break;
                    paragraphLines.push(renderInlineMarkdown(lines[i]));
                    i++;
                }
                html.push('<p>' + paragraphLines.join('<br>') + '</p>');
            }

            return html.join('');
        }

        function renderMessageContent(contentDiv, text, sender) {
            if (!contentDiv) return;
            if (sender === 'assistant') {
                contentDiv.classList.add('markdown-body');
                contentDiv.innerHTML = renderMarkdownHtml(text);
                return;
            }
            contentDiv.classList.remove('markdown-body');
            contentDiv.textContent = text || '';
        }

        function toUnifiedMessage(message) {
            if (!message || message.type === 'handshake' || message.type.indexOf(':') >= 0) {
                return message;
            }
            var payload = Object.assign({}, message);
            delete payload.type;
            var sessionId = payload.session_id || '';
            var requestId = payload.request_id || generateId();
            delete payload.session_id;
            delete payload.request_id;
            switch (message.type) {
                case 'CHAT_MESSAGE':
                    return { msg_id: requestId, type: 'task:start', session_id: sessionId, ts: Date.now() / 1000, payload: payload };
                case 'TASK_EXECUTION_STATUS':
                    return { msg_id: requestId, type: 'task:execution_status', session_id: sessionId, ts: Date.now() / 1000, payload: payload };
                case 'STOP_GENERATION':
                case 'STOP_TASK':
                    return { msg_id: requestId, type: 'task:cancel', session_id: sessionId, ts: Date.now() / 1000, payload: payload };
                case 'LIST_DIALOGUE_SESSIONS':
                    return { msg_id: requestId, type: 'session:list', session_id: sessionId, ts: Date.now() / 1000, payload: payload };
                case 'GET_SESSION_MESSAGES':
                    return { msg_id: requestId, type: 'session:messages', session_id: sessionId, ts: Date.now() / 1000, payload: payload };
                case 'DELETE_DIALOGUE_SESSION':
                    return { msg_id: requestId, type: 'session:deleted', session_id: sessionId, ts: Date.now() / 1000, payload: payload };
                case 'REQUEST_MEMORY_GRAPH':
                    return { msg_id: requestId, type: 'graph:memory:update', session_id: sessionId, ts: Date.now() / 1000, payload: payload };
                case 'EXPAND_NODE':
                    return { msg_id: requestId, type: 'graph:memory:expand', session_id: sessionId, ts: Date.now() / 1000, payload: payload };
                case 'audio_start':
                    return { msg_id: requestId, type: 'audio:start', session_id: sessionId, ts: Date.now() / 1000, payload: payload };
                case 'audio_end':
                    return { msg_id: requestId, type: 'audio:end', session_id: sessionId, ts: Date.now() / 1000, payload: payload };
                case 'audio_chunk':
                    return { msg_id: requestId, type: 'audio:chunk', session_id: sessionId, ts: Date.now() / 1000, payload: payload };
                case 'conversation:switch':
                    return { msg_id: requestId, type: 'conversation:switch', session_id: sessionId, ts: Date.now() / 1000, payload: payload };
                case 'voice_bind':
                    return { msg_id: requestId, type: 'voice:bind', session_id: sessionId, ts: Date.now() / 1000, payload: payload };
                case 'ide_open_workspace':
                    return { msg_id: requestId, type: 'ide:open_workspace', session_id: sessionId, ts: Date.now() / 1000, payload: payload };
                case 'ide_open_file':
                    return { msg_id: requestId, type: 'ide:open_file', session_id: sessionId, ts: Date.now() / 1000, payload: payload };
                case 'ide_open_terminal':
                    return { msg_id: requestId, type: 'ide:open_terminal', session_id: sessionId, ts: Date.now() / 1000, payload: payload };
                case 'ide_get_context':
                    return { msg_id: requestId, type: 'ide:get_context', session_id: sessionId, ts: Date.now() / 1000, payload: payload };
                case 'ide_approval_result':
                    return { msg_id: requestId, type: 'ide:approval_result', session_id: sessionId, ts: Date.now() / 1000, payload: payload };
                default:
                    return message;
            }
        }

        function normalizeIncomingMessage(message) {
            if (!message || !message.type || message.type.indexOf(':') < 0) {
                return message;
            }
            var payload = message.payload || {};
            var normalized = Object.assign({}, payload, {
                request_id: message.msg_id || payload.request_id,
                session_id: message.session_id || payload.session_id
            });
            switch (message.type) {
                case 'task:execution_status':
                    normalized.type = 'TASK_EXECUTION_STATUS';
                    break;
                case 'task:ack':
                    normalized.type = 'WELCOME';
                    break;
                case 'task:complete':
                case 'text:final':
                    normalized.type = 'CHAT_RESPONSE';
                    normalized.text = payload.text || payload.result || '';
                    break;
                case 'task:error':
                    normalized.type = 'TASK_ERROR';
                    normalized.text = payload.error || payload.message || '任务失败';
                    break;
                case 'task:progress':
                case 'reasoning':
                    normalized.type = 'THINKING_STEP';
                    break;
                case 'text:stream':
                    normalized.type = 'STREAMING_RESPONSE';
                    normalized.text = payload.text || '';
                    normalized.chunk = payload.chunk || payload.text || '';
                    break;
                case 'graph:memory:update':
                    normalized.type = 'MEMORY_GRAPH_UPDATE';
                    break;
                case 'graph:memory:expand':
                    normalized.type = 'MEMORY_GRAPH_EXPAND_RESULT';
                    break;
                case 'graph:task:update':
                    normalized.type = 'TASK_GRAPH_UPDATE';
                    break;
                case 'session:list':
                    normalized.type = 'SESSION_LIST';
                    break;
                case 'session:messages':
                    normalized.type = 'SESSION_MESSAGES';
                    break;
                case 'session:deleted':
                    normalized.type = 'SESSION_DELETED';
                    break;
                case 'audio:transcript':
                    normalized.type = 'audio_transcript';
                    break;
                case 'turn:accepted':
                    normalized.type = 'TURN_ACCEPTED';
                    break;
                case 'voice:record_created':
                    normalized.type = 'VOICE_RECORD_CREATED';
                    break;
                case 'voice:record_linked':
                    normalized.type = 'VOICE_RECORD_LINKED';
                    break;
                case 'ide:context':
                    normalized.type = 'IDE_CONTEXT';
                    break;
                case 'ide:file_changed':
                    normalized.type = 'IDE_FILE_CHANGED';
                    break;
                case 'ide:terminal_status':
                    normalized.type = 'IDE_TERMINAL_STATUS';
                    break;
                case 'ide:approval_status':
                    normalized.type = 'IDE_APPROVAL_STATUS';
                    break;
                case 'ide:approval_result':
                    normalized.type = 'ide_approval_result';
                    normalized.action = 'ide:approval_result';
                    break;
                case 'ide:action_result':
                    normalized.type = 'ide_action_result';
                    normalized.action = payload.action || 'ide:action_result';
                    break;
                case 'ide:diff_status':
                    normalized.type = 'IDE_DIFF_STATUS';
                    break;
                case 'ide:checkpoint_status':
                    normalized.type = 'IDE_CHECKPOINT_STATUS';
                    break;
                // ── TSD v1.7 §23.8.1: 新增消息类型 ──
                case 'attention:update':
                    normalized.type = 'ATTENTION_UPDATE';
                    break;
                case 'graph:memory:diff':
                    normalized.type = 'GRAPH_MEMORY_DIFF';
                    break;
                case 'interaction:event':
                    normalized.type = 'INTERACTION_EVENT';
                    // interaction payload 在 message.payload.interaction 中
                    normalized.interaction = payload.interaction || null;
                    normalized.phase = payload.phase || '';
                    normalized.turn = payload.turn || 0;
                    break;
                case 'tool:prediction':
                    normalized.type = 'TOOL_PREDICTION';
                    normalized.predictions = payload.predictions || payload.tools || [];
                    break;
                default:
                    normalized.type = message.type;
            }
            return normalized;
        }

        function sendWsMessage(message) {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                return false;
            }
            ws.send(JSON.stringify(toUnifiedMessage(message)));
            return true;
        }

        function startResponseWatchdog(originalText, requestId) {
            clearResponseWatchdog();
            responseWatchdogTimer = setTimeout(function() {
                console.warn('[WebSocket] 等待回复超时:', requestId);
                removeTypingIndicator();
                switchToSendMode();
                if (chatInput && !chatInput.value.trim()) {
                    chatInput.value = originalText || '';
                    autoResizeChatInput();
                    chatInput.focus();
                }
                addIdeSystemMessage('等待回复超时，请检查后端日志或重试。');
            }, RESPONSE_WATCHDOG_MS);
        }

        function clearResponseWatchdog() {
            if (responseWatchdogTimer) {
                clearTimeout(responseWatchdogTimer);
                responseWatchdogTimer = null;
            }
        }
        
        // 连接 WebSocket
        function connect() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws`;
            
            console.log('[WebSocket] 正在连接到:', wsUrl);
            
            ws = new WebSocket(wsUrl);
            
            ws.onopen = () => {
                console.log('[WebSocket] ✅ 连接成功');
                updateStatus(true);
                // 统一协议握手: 声明客户端类型
                sendWsMessage({
                    type: "handshake",
                    payload: { client_type: "dashboard", api_version: "2.0" }
                });
                // 重连后自动同步后端状态（图谱+会话）
                syncBackendState();
            };
            
            ws.onclose = () => {
                console.log('[WebSocket] ❌ 连接关闭');
                updateStatus(false);
                setTimeout(connect, reconnectDelay);
            };
            
            ws.onerror = (error) => {
                console.error('[WebSocket] 错误:', error);
            };
            
            ws.onmessage = (event) => {
                const data = normalizeIncomingMessage(JSON.parse(event.data));
                handleMessage(data);
            };
        }
        
        // 更新连接状态
        function updateStatus(connected) {
            if (connected) {
                statusIndicator.className = 'status-indicator connected';
                connectionStatus.textContent = '已连接';
                sendButton.disabled = false;
            } else {
                statusIndicator.className = 'status-indicator disconnected';
                connectionStatus.textContent = '断开连接';
                sendButton.disabled = true;
            }
        }
        
        // 处理收到的消息
        function handleMessage(data) {
            console.log('[WebSocket] 收到消息:', data.type);
            clearResponseWatchdog();  // 任何后端消息都表明后端仍存活，重置超时
            
            switch (data.type) {
                case 'audio_transcript':
                    // 语音转录结果
                    if (data.payload && data.payload.text) {
                        chatInput.value += data.payload.text;
                        autoResizeChatInput();
                        console.log('[Voice] 转录结果:', data.payload.text);
                    }
                    break;

                case 'WELCOME':
                    console.log('[WebSocket] 欢迎消息:', data.message);
                    // 预填充已有活跃 IDE 会话映射
                    if (data.payload && data.payload.active_sessions) {
                        data.payload.active_sessions.forEach(function(s) {
                            if (s.session_id && !_ideSessionMap[s.session_id]) {
                                _ideSessionMap[s.session_id] = s.session_id;
                            }
                        });
                    }
                    // 自动重建：恢复后端已有的任务图谱
                    if (data.payload && data.payload.task_graph) {
                        if (shouldAttachPassiveBackendGraph(data.payload.task_graph)) {
                            addTaskGraph(data.payload.task_graph);
                            console.log('[WebSocket] 已从WELCOME恢复任务图谱');
                        } else {
                            console.log('[WebSocket] 跳过未绑定会话的历史任务图谱恢复');
                        }
                    }
                    if (data.payload && data.payload.task_execution_status) {
                        updateTaskStatusUi(data.payload.task_execution_status, { renderCard: false });
                    }
                    // 连接建立后请求后端对话会话列表
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        sendWsMessage({type: "LIST_DIALOGUE_SESSIONS"});
                    }
                    break;
                
                case 'THINKING_STEP':
                    clearResponseWatchdog();
                    handleThinkingStep(data);
                    break;
                
                case 'CHAT_RESPONSE':
                    clearResponseWatchdog();
                    removeTypingIndicator();
                    // 如果有流式消息在进行中，将其定稿为最终消息
                    finalizeStreamingMessage(data.text, data.request_id);
                    switchToSendMode();
                    break;

                case 'TASK_ERROR':
                    clearResponseWatchdog();
                    removeTypingIndicator();
                    addIdeSystemMessage(data.text || data.error || '任务执行失败');
                    switchToSendMode();
                    break;
                
                case 'STREAMING_RESPONSE':
                    clearResponseWatchdog();
                    removeTypingIndicator();
                    if (data.complete === true || data.streaming === false) {
                        finalizeStreamingMessage(data.text, data.request_id);
                        switchToSendMode();
                    } else {
                        updateStreamingMessage(data.text, data.chunk, data.request_id);
                    }
                    break;

                case 'TURN_ACCEPTED':
                    handleTurnAccepted(data);
                    break;

                case 'TASK_EXECUTION_STATUS':
                    updateTaskStatusUi(data);
                    break;

                case 'VOICE_RECORD_CREATED':
                    handleVoiceRecordCreated(data);
                    break;

                case 'VOICE_RECORD_LINKED':
                    handleVoiceRecordLinked(data);
                    break;

                case 'IDE_CONTEXT':
                    handleIdeContext(data);
                    break;

                case 'IDE_WORKSPACE_TRUST_REQUIRED':
                    handleWorkspaceTrustRequired(data);
                    updateTaskStatusUi({
                        state: 'workspace_trust_required',
                        phase: 'workspace_trust_required',
                        message: (data.payload && data.payload.message) || '等待你在 VS Code 信任当前任务目录；确认后会自动继续。',
                        interaction: data.payload && data.payload.interaction
                    });
                    break;

                case 'IDE_FILE_CHANGED':
                    handleIdeFileChanged(data);
                    break;

                case 'IDE_TERMINAL_STATUS':
                    handleIdeTerminalStatus(data);
                    break;

                case 'IDE_APPROVAL_STATUS':
                case 'approval_required':
                    data.type = 'IDE_APPROVAL_STATUS';
                    handleIdeApprovalStatus(data);
                    break;

                case 'IDE_DIFF_STATUS':
                case 'diff_ready':
                    data.type = 'IDE_DIFF_STATUS';
                    handleIdeDiffStatus(data);
                    break;

                case 'IDE_CHECKPOINT_STATUS':
                case 'checkpoint_created':
                    data.type = 'IDE_CHECKPOINT_STATUS';
                    handleIdeCheckpointStatus(data);
                    break;

                case 'ide_action_result':
                    handleIdeActionResult(data);
                    break;
                
                case 'MEMORY_GRAPH_UPDATE':
                    handleMemoryGraphUpdate(data);
                    break;

                case 'MEMORY_GRAPH_EXPAND_RESULT':
                    handleMemoryGraphExpandResult(data);
                    break;

                case 'CODE_ANCHOR_UPDATE':
                    handleCodeAnchorUpdate(data);
                    break;

                case 'USER_MESSAGE':
                    // 来自 API/测试脚本的用户消息，添加到聊天窗口
                    addMessage(data.text, 'user');
                    break;

                // ── IDE 会话事件（来自 broadcast_monitor_event 广播） ──
                case 'FC_START':
                    clearResponseWatchdog();
                    handleFCStart(data);
                    break;
                case 'MODEL_RESPONSE':
                    clearResponseWatchdog();
                    handleModelResponse(data);
                    break;
                case 'TOOL_CALL':
                case 'IDE_TOOL_REQUEST':
                    clearResponseWatchdog();
                    handleIdeToolCall(data);
                    break;
                case 'IDE_TOOL_RESULT':
                    clearResponseWatchdog();
                    handleIdeToolResult(data);
                    break;
                case 'IDE_TOOL_EXEC':
                    clearResponseWatchdog();
                    handleIdeToolExec(data);
                    break;
                case 'CALLING_MODEL':
                case 'TURN_COMPLETE':
                    // 轻量事件，仅日志
                    console.log('[IDE]', data.type, data.payload);
                    break;
                case 'DISPLAY_TEXT':
                    clearResponseWatchdog();
                    handleDisplayText(data);
                    break;
                case 'TASK_COMPLETE':
                    clearResponseWatchdog();
                    handleTaskComplete(data);
                    break;
                case 'FC_DONE':
                    handleFCDone(data);
                    break;
                case 'IDE_SESSION_START':
                    handleIdeSessionStart(data);
                    break;
                case 'IDE_SESSION_END':
                    handleIdeSessionEnd(data);
                    break;
                case 'IDE_SESSION_CANCEL':
                    handleIdeSessionCancel(data);
                    break;
                case 'IDE_SESSION_LINKED':
                    handleIdeSessionLinked(data);
                    break;
                case 'TASK_GRAPH_UPDATE':
                    if (data.payload && data.payload.graph) {
                        if (!shouldAttachRealtimeTaskGraphUpdate(data, data.payload.graph)) {
                            console.log('[TaskGraph] 跳过未绑定会话的图谱更新');
                            break;
                        }
                        addTaskGraph(data.payload.graph);
                        // TSD §23.11.4: 更新 session store 的 task_graph_id
                        var tgId = data.payload.graph.id || data.payload.task_graph_id || null;
                        if (tgId && currentSessionId) {
                            var st = loadSessionStore();
                            var cs = st.sessions.find(function(s) { return s.id === currentSessionId; });
                            if (cs) {
                                cs.task_graph_id = cs.task_graph_id || tgId;
                                var tgWorkspace = data.payload.graph.workspace_path || data.payload.graph.workspace_dir || '';
                                if (tgWorkspace) {
                                    cs.workspace_path = tgWorkspace;
                                    cs.cwd = tgWorkspace;
                                }
                                var tgFilePath = data.payload.graph.task_graph_file_path || data.payload.graph.graph_file_path || '';
                                if (tgFilePath) {
                                    cs.task_graph_file_path = tgFilePath;
                                    cs.graph_file_path = tgFilePath;
                                }
                                saveSessionStore(st);
                            }
                        }
                    }
                    break;
                case 'TASK_GRAPH_DELETED':
                    handleTaskGraphDeleted(data);
                    break;

                case 'CRG_INDEX_UPDATE':
                    handleCrgIndexUpdate(data);
                    break;
                case 'CRG_INDEX_COMPLETE':
                    handleCrgIndexComplete(data);
                    break;

                case 'PROGRESS_REPORT':
                    handleProgressReport(data);
                    break;

                case 'STOP_ACK':
                    addIdeSystemMessage('[系统] 停止指令已确认，任务正在终止...');
                    break;

                // ── 对话会话管理（后端 MemoryGraph 重建） ──
                case 'SESSION_LIST':
                    mergeBackendSessions(data.sessions || []);
                    break;
                case 'SESSION_MESSAGES':
                    renderSessionMessages(data.session_id, data.messages || []);
                    break;
                case 'SESSION_DELETED':
                    var deletedSessionIds = data.session_ids || [data.session_id, data.session_node_id];
                    removeSessionsFromLocalStore(deletedSessionIds.filter(Boolean));
                    handleSessionDeleted(data.session_id || data.session_node_id, data.nodes_deleted || 0);
                    break;

                // ── TSD v1.7 §23.8.1: 新增消息类型处理 ──
                case 'ATTENTION_UPDATE':
                    handleAttentionUpdate(data);
                    break;
                case 'GRAPH_MEMORY_DIFF':
                    handleGraphMemoryDiff(data);
                    break;
                case 'INTERACTION_EVENT':
                    renderInteractionEvent(data);
                    break;
                case 'TOOL_PREDICTION':
                    handleToolPrediction(data);
                    break;

                default:
                    console.log('[WebSocket] 未知消息类型:', data.type);
            }
        }

        // ── IDE 会话事件处理函数 ──────────────────────────────

        function handleTurnAccepted(data) {
            var route = data.route || (data.payload && data.payload.route) || '';
            var payload = data.payload || {};
            var acceptedWorkspace = normalizeWorkspacePath(payload.workspace_path || payload.cwd || '');
            var activeWorkspace = getCurrentTaskGraphWorkspace();
            if (acceptedWorkspace && (!activeWorkspace || acceptedWorkspace === activeWorkspace)) {
                ideContext.workspace_path = acceptedWorkspace;
            }
            var reason = payload.reason || '';
            var routeText = route ? ('（' + route + (reason ? '：' + reason : '') + '）') : '';
            addIdeSystemMessage('已接收请求，正在交给后端推理链路处理' + routeText + '。');
        }

        function taskStatusLabelFor(state, phase) {
            if (state === 'waiting_approval' || state === 'awaiting_approval') return '等待审批';
            if (state === 'workspace_trust_required' || phase === 'workspace_trust_required') return '等待信任';
            if (state === 'possibly_stalled' || state === 'stalled' || phase === 'stalled_watch') return '疑似卡住';
            if (state === 'completed' || state === 'succeeded') return '已完成';
            if (state === 'failed') return '失败';
            if (state === 'blocked') return '受阻';
            if (state === 'running') return '任务中';
            return '空闲';
        }

        function disableStaleApprovalCards(reason) {
            document.querySelectorAll('.approval-message:not(.approved):not(.rejected)').forEach(function(card) {
                var enabled = Array.from(card.querySelectorAll('button.approval-btn')).some(function(btn) {
                    return !btn.disabled;
                });
                if (!enabled) return;
                card.classList.add('rejected');
                var actions = card.querySelector('.approval-actions');
                if (actions) actions.remove();
                var title = card.querySelector('.approval-title');
                if (title) title.textContent = '审批已结束';
                var meta = card.querySelector('.approval-meta');
                if (meta) meta.textContent = reason || '本次审批已过期，请重新发起操作。';
            });
        }

        function updateTaskStatusUi(status, options) {
            options = options || {};
            var p = status && status.payload && status.payload.state ? status.payload : (status || {});
            var state = p.state || 'idle';
            var phase = p.phase || '';
            var message = p.message || (state === 'idle' ? '当前没有正在执行的任务。' : '任务状态更新。');
            message = sanitizeInteractionText(message, message);
            var prevState = (currentTaskExecutionStatus && currentTaskExecutionStatus.state) || 'idle';
            var wasGenerating = _isGenerating === true;
            var isTerminalState = isTerminalTaskState(state);
            if (!isTerminalState) {
                chatAutoScrollStoppedAfterTerminal = false;
                chatTerminalAutoScrollPending = false;
                if (chatTerminalStopTimer) {
                    clearTimeout(chatTerminalStopTimer);
                    chatTerminalStopTimer = null;
                }
                if (isChatNearBottom()) chatAutoScrollPaused = false;
            }
            currentTaskExecutionStatus = Object.assign({}, currentTaskExecutionStatus, p, { state: state, phase: phase, message: message });
            if (!taskStatusStrip) return;
            taskStatusStrip.className = 'task-status-strip visible ' + state;
            taskStatusLabel.textContent = taskStatusLabelFor(state, phase);
            taskStatusMessage.textContent = message;
            var isWaitingApproval = state === 'waiting_approval' || state === 'awaiting_approval' || state === 'workspace_trust_required';
            if (isWaitingApproval) {
                clearResponseWatchdog();
                removeTypingIndicator();
                _isGenerating = true;
                _currentSendMode = 'send';
                sendButton.textContent = '发送补充';
                sendButton.classList.remove('stop-mode');
                sendButton.classList.add('adjust-mode');
            } else if (state === 'running' || state === 'possibly_stalled') {
                if (!chatInput.value.trim()) {
                    switchToStopMode();
                }
            } else if (state === 'completed' || state === 'succeeded' || state === 'failed' || state === 'blocked' || state === 'cancelled' || state === 'idle') {
                switchToSendMode();
            }
            if (!isWaitingApproval && (state === 'completed' || state === 'succeeded' || state === 'failed' || state === 'blocked' || state === 'cancelled' || state === 'idle')) {
                disableStaleApprovalCards(state === 'blocked' || state === 'failed' ? '本次审批已过期，任务已受阻。' : '本次审批已结束。');
            }
            if (p.interaction && options.renderCard !== false) {
                renderInteractionEvent({ payload: Object.assign({}, p, { interaction: p.interaction }) }, { persist: false });
            }
            if (isTerminalState && (state !== 'idle' || wasGenerating || !isTerminalTaskState(prevState))) {
                scheduleChatAutoScrollTerminalStop();
            }
        }

        function handleVoiceRecordCreated(data) {
            var p = data.payload || {};
            if (!p.voice_event_id) return;
            if (p.linked) return;
            addIdeSystemMessage('语音记录已保存，暂未自动绑定到当前聊天页。');
        }

        function handleVoiceRecordLinked(data) {
            var p = data.payload || {};

        function handleIdeApprovalStatus(data) {
            renderInteractionEvent(data);
            var p = data.payload || data || {};
            var approvalId = p.approval_id || p.approvalId;
            var summary = friendlyActionSummary(p.action_summary || p.summary || '', p.tool_name);
            var risk = String(p.risk_level || 'medium').toUpperCase();
            var reason = sanitizeInteractionText(p.risk_reason || '', '');
            var isApproved = p.status === 'approved' || p.status === 'confirmed' || p.approved === true || p.confirmation_state === 'approved' || p.confirmation_state === 'confirmed';
            var isRejected = p.status === 'rejected' || p.status === 'denied' || p.approved === false || p.confirmation_state === 'rejected' || p.confirmation_state === 'denied';
            var resolved = isApproved || isRejected;
            if (resolved) {
                resolveApprovalCardById(
                    approvalId,
                    isApproved,
                    isApproved ? '审批已通过，任务继续执行。' : '审批已拒绝，不会执行。'
                );
                updateTaskStatusUi({
                    state: isApproved ? 'running' : 'blocked',
                    phase: 'approval_resolved',
                    message: isApproved ? '审批已通过，任务继续执行。' : '审批已拒绝，任务将停止或重新规划。',
                    tool_name: p.tool_name || '',
                    awaiting_approval: false
                }, { renderCard: false });
                return;
            }
            updateTaskStatusUi({
                state: 'waiting_approval',
                phase: 'approval_required',
                message: '任务已暂停，等待用户审批：' + summary,
                tool_name: p.tool_name || '',

                interaction: p.interaction || null
            }, { renderCard: false });

                addIdeSystemMessage('需要审批: ' + summary + (reason ? '（' + reason + '）' : ''));

            showWebApprovalRequest({
                approval_id: approvalId,

                tool_name: p.tool_name,
                action_summary: summary,

        function markApprovalBoxResolved(box, approved, message) {
            if (!box) return;
            box.classList.remove('approved', 'rejected');
            box.classList.add(approved ? 'approved' : 'rejected');
            var actions = box.querySelector('.approval-actions');
            if (actions) actions.remove();
            var title = box.querySelector('.approval-title');
            if (title) title.textContent = approved ? '已允许' : '已拒绝';
            var meta = box.querySelector('.approval-meta');
            if (meta) meta.textContent = message || (approved ? '审批已通过，任务继续执行。' : '审批已拒绝，不会执行。');
        }

        function resolveApprovalCardById(approvalId, approved, message) {
            if (!approvalId) return;
            var targetId = String(approvalId);
            document.querySelectorAll('.approval-message[data-approval-id]').forEach(function(card) {
                if (card.getAttribute('data-approval-id') === targetId) {
                    markApprovalBoxResolved(card, approved, message);
                }
            });
            updatePersistedApprovalCard(targetId, approved);
        }

        function showWebApprovalRequest(req, options) {
            options = options || {};
            var box = document.createElement('div');
            box.className = 'message assistant-message ide-system-message approval-message';
            if (req.approval_id) box.setAttribute('data-approval-id', req.approval_id);
            var risk = String(req.risk_level || '').toUpperCase();
            var riskText = risk === 'HIGH' ? '高风险' : (risk === 'LOW' ? '低风险' : (risk === 'CRITICAL' ? '严重风险' : '中风险'));
            var summary = friendlyActionSummary(req.action_summary || '', req.tool_name);
            var reason = sanitizeInteractionText(req.risk_reason || '', '');
            box.innerHTML =
                '<div class="approval-title">需要你确认</div>' +
                '<div class="approval-summary"></div>' +
                '<div class="approval-meta"></div>' +
                '<div class="approval-actions">' +
                '<button class="approval-btn approve">允许</button>' +
                '<button class="approval-btn reject">拒绝</button>' +
                '</div>';
            box.querySelector('.approval-summary').textContent = summary;
            box.querySelector('.approval-meta').textContent = riskText + (reason ? ' · ' + reason : '');
            var approveBtn = box.querySelector('.approve');
            var rejectBtn = box.querySelector('.reject');
            var actions = box.querySelector('.approval-actions');
            function markApprovalResolved(approved, message) {
                markApprovalBoxResolved(box, approved, message);
            }
            if (options.historical || req.confirmation_state) {
                approveBtn.disabled = true;
                rejectBtn.disabled = true;
                if (req.confirmation_state === 'approved') {
                    markApprovalResolved(true);
                } else if (req.confirmation_state === 'rejected') {
                    markApprovalResolved(false);
                } else if (options.historical) {
                    if (actions) actions.remove();
                }
            }
            function settle(approved) {
                approveBtn.disabled = true;
                rejectBtn.disabled = true;
                markApprovalResolved(approved, approved ? '已允许，正在执行。' : '已拒绝，不会执行。');
                updatePersistedApprovalCard(req.approval_id, approved);
                updateTaskStatusUi({
                    state: approved ? 'running' : 'blocked',
                    phase: 'approval_resolved',
                    message: approved ? '审批已通过，任务继续执行。' : '审批已拒绝，任务将停止或重新规划。',
                    awaiting_approval: false,
                    tool_name: req.tool_name || ''
                }, { renderCard: false });
                sendWsMessage({
                    type: 'ide_approval_result',
                    payload: {
                        approval_id: req.approval_id,
                        approved: approved,
                        ide_session_id: req.ide_session_id,
                        workspace_path: req.workspace_path,
                        tool_name: req.tool_name,
                        action_summary: summary
                    }
                });
            }
            approveBtn.onclick = function() { settle(true); };
            rejectBtn.onclick = function() { settle(false); };
            chatMessages.appendChild(box);
            scrollChatToBottom(false);
            if (options.persist !== false) {
                persistCardMessage({
                    id: req.approval_id || generateId(),
                    card_type: 'approval',
                    pair_id: req.approval_id || '',
                    text: summary,
                    event_type: 'IDE_APPROVAL_STATUS',
                    payload: Object.assign({}, req, { action_summary: summary, risk_reason: reason })
                });
            }
        }

        // IDE_TOOL_RESULT: 显示工具结果
        function handleIdeToolResult(data) {

            var p = data.payload || {};
            var results = p.results || [];
            if (!results.length) return;
            var names = results.map(function(r) { return r && r.tool_name; }).filter(Boolean);
            var failed = results.some(function(r) { return r && r.is_error; });
            var pairId = p.group_id || p.call_id || ('legacy-tool-result-' + (p.turn || Date.now()));
            renderInteractionEvent({
                payload: {
                    pair_id: pairId,
                    results: results,
                    interaction: {
                        pair_id: pairId,
                        kind: 'observation',
                        status: failed ? 'failed' : 'succeeded',
                        title: failed ? (friendlyToolGroupLabel(names) + '需要复核') : (friendlyToolGroupLabel(names) + '已完成'),
                        detail: failed ? '有步骤返回异常，原始结果已保留在执行细节中。' : '这一步已经返回结果，祖龙会基于结果继续推进。',
                        tool_name: names.join(','),
                        progress_items: results.map(function(r) {
                            var status = r && r.is_error ? 'failed' : 'completed';
                            return {

        // IDE_SESSION_START: 会话启动 + 自动绑定 Web 会话
        var _ideSessionMap = {};
        function handleIdeSessionStart(data) {
            var p = data.payload || {};
            var ideSessionId = p.session_id;
            var taskTitle = p.task_title || (p.task_preview || '').substring(0, 40) || '新任务';
            var isResume = p.is_resume === true;
            var taskGraphId = p.task_graph_id || null;

            // 恢复模式：优先查找已有的同 task_graph_id 会话，在其上继续
            if (isResume && taskGraphId) {
                var store = loadSessionStore();
                var existingSession = store.sessions.find(function(s) {
                    return s.task_graph_id === taskGraphId;
                });
                if (existingSession) {
                    // 复用已有会话，更新 ide_session_id 映射
                    _ideSessionMap[ideSessionId] = existingSession.id;
                    existingSession.ide_session_id = ideSessionId;
                    store.activeSessionId = existingSession.id;
                    saveSessionStore(store);
                    currentSessionId = existingSession.id;
                    renderSessionList();
                    addIdeSystemMessage('任务恢复: ' + cleanDisplayText((p.task_preview || '').substring(0, 100)));
                    return;
                }
            }

            // 新会话：在 Web 端创建/绑定
            if (ideSessionId && !_ideSessionMap[ideSessionId]) {
                var store = loadSessionStore();
                var newId = _generateIdForSession();
                var newSession = {
                    id: newId,
                    title: taskTitle.length > 20 ? taskTitle.substring(0, 20) + '...' : taskTitle,
                    messages: [],
                    createdAt: Date.now(),
                    source: 'ide',
                    ide_session_id: ideSessionId,
                    dialogue_session_id: p.dialogue_session_id || null,
                    project_id: p.project_id || null,
                    task_graph_id: taskGraphId,
                    cwd: p.cwd || null,
                    workspace_path: p.workspace_path || p.cwd || null,
                };
                store.sessions.unshift(newSession);
                store.activeSessionId = newId;
                saveSessionStore(store);
                _ideSessionMap[ideSessionId] = newId;
                currentSessionId = newId;
                document.getElementById('chatMessages').innerHTML = '';
                renderSessionList();
            }
            // 显示系统消息
            addIdeSystemMessage('IDE 会话启动: ' + cleanDisplayText((p.task_preview || '').substring(0, 100)));
        }

        function normalizeToolKey(name) {
            return String(name || '').trim().toLowerCase();
        }

        function extractToolNames(value) {
            if (!value) return [];
            if (Array.isArray(value)) {
                return value.map(function(item) {
                    if (!item) return '';
                    if (typeof item === 'object') return item.name || item.tool_name || '';
                    return String(item);
                }).filter(Boolean);
            }
            return String(value).split(',').map(function(part) { return part.trim(); }).filter(Boolean);
        }

        function friendlyToolName(name) {
            var key = normalizeToolKey(name);
            if (!key) return '处理任务步骤';
            if (ZULONG_FRIENDLY_TOOLS[key]) return ZULONG_FRIENDLY_TOOLS[key];
            if (ZULONG_FRIENDLY_TOOLS[key.toLowerCase()]) return ZULONG_FRIENDLY_TOOLS[key.toLowerCase()];
            if (/_/.test(key)) return '处理任务步骤';
            return String(name).trim();
        }

        function friendlyActionSummary(raw, toolName) {
            var summary = sanitizeInteractionText(raw || '', '');
            if (!summary || hasTechnicalNoise(summary)) {
                var toolLabel = friendlyToolName(toolName || '');
                return toolLabel === '处理任务步骤' ? '需要确认后继续执行这一步。' : '需要确认后继续' + toolLabel + '。';
            }
            return summary;
        }

        function friendlyToolGroupLabel(names) {
            var labels = extractToolNames(names).map(friendlyToolName).filter(Boolean);
            if (!labels.length) return '处理任务步骤';
            var seen = {};
            labels = labels.filter(function(label) {
                if (seen[label]) return false;
                seen[label] = true;
                return true;
            });
            if (labels.length > 2) return '并行处理 ' + labels.length + ' 项步骤';
            return labels.join('、');
        }

        function replaceKnownToolNames(text) {
            var output = String(text || '');
            Object.keys(ZULONG_FRIENDLY_TOOLS).forEach(function(key) {
                var re = new RegExp('\\b' + key.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'gi');
                output = output.replace(re, ZULONG_FRIENDLY_TOOLS[key]);
            });
            return output;
        }

        function hasTechnicalNoise(text) {
            var value = String(text || '');
            return /返回字段|call_id|pair_id|tool_call_id|ide_session_id|tool_name|arguments_preview|result_preview|\b[a-z]+_[a-z0-9_]+\b/i.test(value);
        }

        function sanitizeInteractionText(text, fallback) {
            var value = cleanDisplayText(String(text || '')).trim();
            if (!value) return fallback || '';
            value = replaceKnownToolNames(value);
            value = value
                .replace(/判断依据[:：]/g, '为什么做:')
                .replace(/候选能力[:：]/g, '可能会用到:')
                .replace(/等待\s*([^\s，。]+)\s*返回。?/g, '等待$1完成。')
                .replace(/返回字段[:：][^\n。]*/g, '已收到返回结果。')
                .replace(/工具[:：]\s*[^·\n]+/g, '')
                .replace(/\s+·\s+/g, ' · ')
                .trim();
            if (!value) return fallback || '';
            if (/^(ok|result|error|call_id|pair_id|tool_name)[:：=]/i.test(value)) return fallback || '已收到返回结果。';
            if (hasTechnicalNoise(value) && value.length < 80) return fallback || replaceKnownToolNames(value);
            return value;
        }

        function sanitizeProgressLabel(label, status) {
            var raw = String(label || '').trim();
            if (!raw) return '';
            raw = replaceKnownToolNames(raw);
            var failed = /异常|失败|需要复核|返回异常/.test(raw) || status === 'failed' || status === 'blocked';
            raw = raw.replace(/返回异常，需要复核/g, '需要复核');
            raw = raw.replace(/返回异常/g, '需要复核');
            raw = raw.replace(/^执行\s+(.+)$/i, function(_, name) {
                return '正在' + friendlyToolGroupLabel(name);
            });
            raw = raw.replace(/^使用\s+(.+)$/i, function(_, name) {
                return '正在' + friendlyToolGroupLabel(name);
            });
            raw = raw.replace(/^(.+)\s+已返回$/i, function(_, name) {
                return friendlyToolGroupLabel(name) + '已完成';
            });
            raw = raw.replace(/^(.+)\s+已完成$/i, function(_, name) {
                return friendlyToolGroupLabel(name) + '已完成';
            });
            Object.keys(ZULONG_FRIENDLY_TOOLS).forEach(function(key) {
                var labelText = ZULONG_FRIENDLY_TOOLS[key];
                if (raw === labelText) {
                    raw = status === 'completed' ? labelText + '已完成' : (status === 'running' ? '正在' + labelText : labelText);
                }
            });
            if (failed && !/需要复核|失败|受阻/.test(raw)) raw += '需要复核';
            if (/\b[a-z]+_[a-z0-9_]+\b/i.test(raw)) raw = failed ? '任务步骤需要复核' : '处理任务步骤';
            return raw;
        }

        function sanitizeProgressDetail(detail, status) {
            var raw = String(detail || '').trim();
            if (!raw) return '';
            var cleaned = sanitizeInteractionText(raw, '');
            if (!cleaned) return '';
            if (hasTechnicalNoise(raw) || cleaned.length > 180) {
                return (status === 'failed' || status === 'blocked') ? '返回信息较复杂，已放入执行细节。' : '已收到返回结果。';
            }
            return cleaned;
        }

        function summaryItemKey(value) {
            var text = replaceKnownToolNames(String(value || '')).trim();
            text = text
                .replace(/已完成执行步骤[:：]?/g, '')
                .replace(/正在/g, '')
                .replace(/已完成/g, '')
                .replace(/已返回结果/g, '')
                .replace(/返回结果/g, '')
                .replace(/需要复核/g, '')
                .replace(/待关注/g, '')
                .replace(/异常/g, '')
                .replace(/失败/g, '')
                .replace(/[，,、；;。:：\s]/g, '');
            return text;
        }

        function filterResolvedPendingItems(items) {
            var resolved = {};
            (items || []).forEach(function(item) {
                var status = item.status || 'pending';
                var key = summaryItemKey(item.label);
                if (key && status === 'completed') resolved[key] = true;
            });
            return (items || []).filter(function(item) {
                var status = item.status || 'pending';
                if (status !== 'pending' && status !== 'failed' && status !== 'blocked') return true;
                var key = summaryItemKey(item.label);
                return !key || !resolved[key];
            });
        }

        function filterResolvedSummaryLists(completed, verified, pending) {
            var resolved = {};
            (completed || []).concat(verified || []).forEach(function(item) {
                var key = summaryItemKey(item);
                if (key) resolved[key] = true;
            });
            pending = (pending || []).filter(function(item) {
                var key = summaryItemKey(item);
                return !key || !resolved[key];
            });
            return { completed: completed || [], verified: verified || [], pending: pending };
        }

        function cleanRiskSummary(risk, pending) {
            var text = sanitizeInteractionText(risk || '', '');
            if (!text) return '';
            if (!pending || !pending.length) {
                text = text
                    .replace(/存在(?:工具|步骤)失败或异常[:：][^；;。]*(?:[；;。]\s*)?/g, '')
                    .replace(/存在未完成或需复核事项(?:[；;。]\s*)?/g, '')
                    .trim();
            }
            return text;
        }

        function cleanSummaryNextStep(nextStep, pending) {
            var text = sanitizeInteractionText(nextStep || '', '');
            if (!text) return '';
            if ((!pending || !pending.length) && /未完成|异常|复核|受阻/.test(text)) {
                return '等待用户继续补充或提出新调整。';
            }
            return text;
        }

        function summaryHasVisiblePending(interaction) {
            if (!interaction || interaction.kind !== 'summary') return false;
            return normalizeProgressItems(interaction).some(function(item) {
                return item.status === 'pending' || item.status === 'failed' || item.status === 'blocked';
            });
        }

        function formatInteractionTitle(interaction, payload, fallback) {
            var kind = interaction.kind || '';
            var status = interaction.status || '';
            var toolNames = extractToolNames(interaction.tool_name || payload.tool_name || payload.tool_names || payload.tools);
            var toolLabel = friendlyToolGroupLabel(toolNames);
            if (kind === 'plan') return '先确认目标和上下文';
            if (kind === 'approval') {
                if (status === 'approved' || interaction.confirmation_state === 'approved') return '已允许继续执行';
                if (status === 'rejected' || interaction.confirmation_state === 'rejected') return '已拒绝本次操作';
                return fallback || '需要确认后继续';
            }
            if (kind === 'summary') return fallback && fallback !== '任务完成' ? sanitizeInteractionText(fallback, '这轮处理完成') : '这轮处理完成';
            if (kind === 'observation') {
                return status === 'failed' || status === 'blocked' ? (toolLabel + '需要复核') : (toolLabel + '已完成');
            }
            if (kind === 'action') {
                return toolLabel.indexOf('并行处理') === 0 ? ('正在' + toolLabel) : ('正在' + toolLabel);
            }
            if (status === 'blocked') return '执行受阻，需要复核';
            if (status === 'failed') return '执行异常，需要复核';
            return sanitizeInteractionText(fallback || interaction.title || payload.message || '执行状态', '执行状态');
        }

        function formatInteractionWhy(interaction) {
            var thought = sanitizeInteractionText(interaction.thought || '', '');
            if (!thought) return '';
            if (thought.length > 220) thought = thought.substring(0, 217).trim() + '...';
            return '为什么做: ' + thought;
        }

        function formatInteractionDetail(interaction, fallback, payload) {
            payload = payload || {};
            var kind = interaction.kind || '';
            var status = interaction.status || '';
            var cleaned = sanitizeInteractionText(fallback || interaction.detail || payload.message || '', '');
            if (kind === 'plan') return cleaned || '我会先确认目标、上下文和可用能力，再决定是否需要调用工具。';
            if (kind === 'approval') return cleaned || '这一步需要你确认后才会继续执行。';
            if (kind === 'action') {
                if (cleaned && !hasTechnicalNoise(cleaned)) return cleaned;
                return '我正在执行这一步，完成后会把结果接回当前任务。';
            }
            if (kind === 'observation') {
                if (status === 'failed' || status === 'blocked') return cleaned || '这一步返回异常，已标记为需要复核。';
                return cleaned && !hasTechnicalNoise(cleaned) ? cleaned : '这一步已经返回结果，祖龙会基于结果继续推进。';
            }
            if (kind === 'summary') return cleaned || '已整理本轮完成项、验证项和仍需关注的地方。';
            return cleaned;
        }

        function formatInteractionResult(interaction, payload, fallbackTitle) {
            if (interaction.kind === 'summary') {
                return formatSummaryPayload(Object.assign({}, payload.summary || {}, interaction));
            }
            if (payload.summary) return formatSummaryPayload(payload.summary);
            if (payload.results && payload.results.length) {
                var failed = payload.results.filter(function(r) { return r && r.is_error; }).length;
                if (failed) return failed + ' 项步骤需要复核，其余结果已接回当前任务。';
                if (payload.results.length > 1) return payload.results.length + ' 项步骤已返回结果。';
                return friendlyToolName(payload.results[0].tool_name || interaction.tool_name) + '已返回结果。';
            }
            if (interaction.result_preview) {
                return sanitizeProgressDetail(interaction.result_preview, interaction.status);
            }
            if (interaction.status === 'blocked' || interaction.status === 'failed') {
                return sanitizeInteractionText(interaction.detail || fallbackTitle || '', '需要复核后继续。');
            }
            return '';
        }

        function buildInteractionRawDetails(interaction, payload, displayTitle, displayDetail) {
            var lines = [];
            function add(label, value) {
                value = value === undefined || value === null ? '' : String(value).trim();
                if (!value) return;
                lines.push(label + ': ' + value);
            }
            if ((interaction.title || '') !== displayTitle) add('原始标题', interaction.title);
            if ((interaction.detail || '') !== displayDetail) add('原始说明', interaction.detail);
            add('工具标识', interaction.tool_name || payload.tool_name || '');
            add('下一步', interaction.next_step || payload.next_step || '');
            if (interaction.thought) add('模型说明', interaction.thought);
            if (interaction.result_preview) add('返回预览', interaction.result_preview);
            if (payload.results && payload.results.length) {
                payload.results.forEach(function(r, idx) {
                    if (!r) return;
                    add('返回 ' + (idx + 1), (r.tool_name || '工具') + (r.is_error ? ' [失败] ' : ' [完成] ') + (r.result_preview || ''));
                });
            }
            return lines.join('\n');
        }

        function renderInteractionEvent(data, options) {
            options = options || {};
            var p = data.payload || data || {};
            var interaction = getInteractionPayload(data);
            if (!interaction) return false;
            var pairId = interaction.pair_id || interaction.interaction_id || p.pair_id || p.call_id;
            if (!pairId) return false;
            var existing = interactionCardMap[pairId];
            if (!existing) {
                var box = document.createElement('div');
                var kindClass = interaction.kind ? ' kind-' + interaction.kind : '';
                box.className = 'message assistant-message ide-system-message interaction-card ' + (interaction.status || 'running') + kindClass;
                box.setAttribute('data-pair-id', pairId);
                box.innerHTML =
                    '<div class="interaction-title"></div>' +
                    '<div class="interaction-detail"></div>' +
                    '<div class="interaction-why" style="display:none"></div>' +
                    '<div class="interaction-checklist" style="display:none"></div>' +
                    '<div class="interaction-meta"></div>' +
                    '<div class="interaction-result" style="display:none"></div>' +
                    '<details class="interaction-raw" style="display:none"><summary>执行细节</summary><pre></pre></details>';
                chatMessages.appendChild(box);
                existing = interactionCardMap[pairId] = box;
            }
            var kindClass = interaction.kind ? ' kind-' + interaction.kind : '';
            existing.className = 'message assistant-message ide-system-message interaction-card ' + (interaction.status || 'running') + kindClass;
            var rawTitle = interaction.title || p.message || p.phase || '执行状态';
            var rawDetail = interaction.detail || p.message || '';
            var title = formatInteractionTitle(interaction, p, rawTitle);
            var detail = formatInteractionDetail(interaction, rawDetail, p);
            var metaParts = [];
            if (interaction.risk_level) metaParts.push('风险: ' + interaction.risk_level);
            if (interaction.confirmation_state) {
                var confirmText = interaction.confirmation_state === 'approved' ? '已允许' : (interaction.confirmation_state === 'rejected' ? '已拒绝' : '待确认');
                metaParts.push('确认: ' + confirmText);
            }
            if (interaction.current_step !== undefined && interaction.total_steps) {
                metaParts.push('步骤: ' + interaction.current_step + '/' + interaction.total_steps);
            }
            if (interaction.next_step) {
                var nextStepText = sanitizeInteractionText(interaction.next_step, '继续推进');
                if (!(interaction.kind === 'summary' && /未完成|异常|复核|受阻/.test(nextStepText) && !summaryHasVisiblePending(interaction))) {
                    metaParts.push('下一步: ' + nextStepText);
                }
            }
            existing.querySelector('.interaction-title').textContent = title;
            existing.querySelector('.interaction-detail').textContent = detail;
            var why = existing.querySelector('.interaction-why');
            var whyText = formatInteractionWhy(interaction);
            why.textContent = whyText;
            why.style.display = whyText ? '' : 'none';
            renderInteractionChecklist(existing.querySelector('.interaction-checklist'), interaction);
            existing.querySelector('.interaction-meta').textContent = metaParts.join(' · ');
            var result = existing.querySelector('.interaction-result');
            var resultText = '';
            if (interaction.kind === 'observation' || interaction.kind === 'summary' || interaction.status === 'blocked' || interaction.status === 'failed') {
                resultText = formatInteractionResult(interaction, p, title);
                result.textContent = resultText;
                result.style.display = resultText ? '' : 'none';
            } else {
                result.textContent = '';
                result.style.display = 'none';
            }
            var rawDetails = existing.querySelector('.interaction-raw');
            var rawText = buildInteractionRawDetails(interaction, p, title, detail);
            if (rawDetails) {
                rawDetails.querySelector('pre').textContent = rawText;
                rawDetails.style.display = rawText && hasTechnicalNoise(rawText) ? '' : 'none';
            }
            scrollChatToBottom(false, {
                allowTerminalFinal: interaction.kind === 'summary' || interaction.status === 'succeeded'
            });
            if (options.persist !== false) {
                persistCardMessage({
                    id: pairId,
                    card_type: 'interaction',
                    pair_id: pairId,
                    text: detail || title,
                    event_type: p.step_type || data.step_type || '',
                    payload: p,
                    interaction: Object.assign({}, interaction)
                });
            }
            return true;
        }

        function normalizeProgressItems(interaction) {
            var raw = interaction.progress_items || [];
            var items = [];
            if (Array.isArray(raw)) {
                raw.forEach(function(item) {
                    if (typeof item === 'string') {
                        items.push({ label: item, status: 'pending' });
                    } else if (item && typeof item === 'object') {
                        items.push({
                            label: item.label || item.title || item.text || '',
                            status: item.status || 'pending',
                            detail: item.detail || '',
                            source: item.source || '',
                            pair_id: item.pair_id || item.id || ''
                        });
                    }
                });
            }
            if (!items.length && interaction.plan_steps && interaction.plan_steps.length) {
                interaction.plan_steps.forEach(function(step, idx) {
                    items.push({
                        label: step,
                        status: idx === 0 && interaction.status !== 'succeeded' ? 'running' : (interaction.status === 'succeeded' ? 'completed' : 'pending'),
                        source: 'plan'
                    });
                });
            }
            if (!items.length && interaction.kind === 'summary') {
                (interaction.completed_items || interaction.completed || []).forEach(function(item) {
                    items.push({ label: item, status: 'completed', source: 'summary' });
                });
                (interaction.pending_items || interaction.remaining || []).forEach(function(item) {
                    items.push({ label: item, status: 'pending', source: 'summary' });
                });
            }
            items = items.map(function(item) {
                var status = item.status || 'pending';
                return Object.assign({}, item, {
                    label: sanitizeProgressLabel(item.label, status),
                    detail: sanitizeProgressDetail(item.detail || '', status)
                });
            }).filter(function(item) { return item.label; });
            return filterResolvedPendingItems(items).slice(0, 8);
        }

        function renderInteractionChecklist(container, interaction) {
            if (!container) return;
            var items = normalizeProgressItems(interaction);
            if (!items.length) {
                container.style.display = 'none';
                container.innerHTML = '';
                return;
            }
            container.innerHTML = '';
            items.forEach(function(item) {
                var status = item.status || 'pending';
                var row = document.createElement('div');
                row.className = 'interaction-check-item ' + status;
                var icon = document.createElement('span');
                icon.className = 'interaction-check-icon';
                icon.textContent = status === 'completed' ? '✓' : (status === 'running' ? '…' : (status === 'failed' || status === 'blocked' ? '!' : ''));
                var body = document.createElement('div');
                var label = document.createElement('div');
                label.className = 'interaction-check-label';
                label.textContent = item.label;
                body.appendChild(label);
                if (item.detail) {
                    var detail = document.createElement('div');
                    detail.className = 'interaction-check-detail';
                    detail.textContent = item.detail;
                    body.appendChild(detail);
                }
                row.appendChild(icon);
                row.appendChild(body);
                container.appendChild(row);
            });
            container.style.display = '';
        }

        function normalizePipelineInteraction(eventData, pipelineType) {
            var interaction = eventData.interaction || null;
            if (interaction) {
                if (!interaction.pair_id && eventData.tool_call_id) interaction.pair_id = eventData.tool_call_id;
                if (!interaction.tool_name && eventData.tool) interaction.tool_name = eventData.tool;
                if (interaction.progress === undefined && eventData.progress) interaction.progress = eventData.progress.percent;
                if (!interaction.result_preview && eventData.tool_result) interaction.result_preview = eventData.tool_result;
                if (!interaction.progress_items && eventData.progress_items) interaction.progress_items = eventData.progress_items;
                return interaction;
            }
            var progress = eventData.progress || {};
            var pct = progress.percent !== undefined ? progress.percent : '';
            if (pipelineType === 'agent_tool_call') {
                var tool = eventData.tool || '工具';
                var hasResult = !!eventData.tool_result;
                var friendlyTool = friendlyToolName(tool);
                return {
                    pair_id: eventData.tool_call_id || ('tool-' + (eventData.turn || 0) + '-' + (eventData.tool || 'unknown')),
                    kind: hasResult ? 'observation' : 'action',
                    status: hasResult ? 'succeeded' : 'running',
                    title: hasResult ? (friendlyTool + '已完成') : ('正在' + friendlyTool),
                    detail: hasResult ? '这一步已经返回结果，祖龙会基于结果继续推进。' : ('正在' + friendlyTool + '，完成后会继续下一步。'),
                    tool_name: eventData.tool || '',
                    progress: pct,
                    progress_items: [{
                        label: friendlyTool,
                        status: hasResult ? 'completed' : 'running',
                        detail: hasResult ? '已收到返回结果。' : '等待这一步完成。',
                        source: 'tool',
                        pair_id: eventData.tool_call_id || ''
                    }],
                    result_preview: eventData.tool_result || '',
                    next_step: hasResult ? '' : '等待这一步完成'
                };
            }
            if (pipelineType === 'pipeline_start') {
                return {
                    pair_id: 'pipeline-start-' + (eventData.turn || 0),
                    kind: 'plan',
                    status: 'running',
                    title: '先看任务上下文',
                    detail: '我会先确认目标、上下文和可用能力，再决定是否需要工具。',
                    progress: pct,
                    plan_steps: [
                        '确认目标和上下文',
                        '按需要调用工具',
                        '整理执行结果',
                        '结束前整理结果和风险'
                    ],
                    progress_items: [

        function formatSummaryPayload(summary) {
            if (!summary || typeof summary !== 'object') return '';
            var lines = [];
            var completed = summary.completed_items || summary.completed || [];
            var verified = summary.verified_items || summary.verified || [];
            var pending = summary.pending_items || summary.remaining || [];
            var risk = summary.risks_summary || summary.risk || '';
            function cleanList(values, status) {
                if (!values || !values.length) return [];
                return values.map(function(value) {
                    return sanitizeProgressLabel(String(value || ''), status);
                }).filter(Boolean).filter(function(value, idx, arr) {
                    return arr.indexOf(value) === idx;
                });
            }
            completed = cleanList(completed, 'completed');
            verified = cleanList(verified, 'completed');
            pending = cleanList(pending, 'pending');
            var filtered = filterResolvedSummaryLists(completed, verified, pending);
            completed = filtered.completed;
            verified = filtered.verified;
            pending = filtered.pending;
            risk = cleanRiskSummary(risk, pending);
            if (completed && completed.length) lines.push('完成: ' + completed.join('、'));
            if (verified && verified.length) lines.push('验证: ' + verified.join('、'));
            if (pending && pending.length) lines.push('待关注: ' + pending.join('、'));
            if (risk) lines.push('风险: ' + sanitizeInteractionText(risk, risk));
            if (summary.memory_changes) {
                var changes = summary.memory_changes || {};
                var memoryParts = [];
                if (changes.created !== undefined) memoryParts.push('新增 ' + (changes.created || 0));
                if (changes.strengthened !== undefined) memoryParts.push('强化 ' + (changes.strengthened || 0));
                if (changes.pruned !== undefined) memoryParts.push('淘汰 ' + (changes.pruned || 0));
                if (memoryParts.length) lines.push('记忆: ' + memoryParts.join('、'));
            }
            var nextStep = cleanSummaryNextStep(summary.next_step, pending);
            if (nextStep) lines.push('下一步: ' + nextStep);
            return lines.join('\n');
        }
        
        // 清洗显示文本：移除 <task> 标签、task_progress 系统指令等噪声
        function cleanDisplayText(text) {
            if (!text) return '';
            // 提取 <task>...</task> 内容（如果有）
            var taskMatch = text.match(/<task>\s*([\s\S]*?)\s*<\/task>/);
            if (taskMatch) {
                text = taskMatch[1].trim();
            }
            // 截断 # task_progress 及之后的系统指令
            var noiseIdx = text.search(/\n#\s*task_progress|<task_progress>|\n====|\n#\s*(?:When starting a new task|Benefits of)/i);
            if (noiseIdx > 0) {
                text = text.substring(0, noiseIdx).trim();
            }
            // 移除行首的 # task_progress ... 整行（如果出现在开头）
            text = text.replace(/^#\s*task_progress\s+RECOMMENDED[\s\S]*/i, '').trim();
            return text;
        }

        // 将流式消息定稿为最终消息（附加思考面板 + 保存历史）
        function finalizeStreamingMessage(text, requestId) {
            let streamingMessage = document.getElementById('streamingMessage');

            var dedupeKey = (requestId || currentRequestId || currentSessionId || 'global') + ':' + displayText;
            var now = Date.now();
            if (recentAssistantFinals[dedupeKey] && now - recentAssistantFinals[dedupeKey] < 8000) {
                return;
            }
            recentAssistantFinals[dedupeKey] = now;
            
            if (streamingMessage) {
                // 流式消息已存在，直接更新文本并定稿
                const contentDiv = streamingMessage.querySelector('.message-content');
                if (contentDiv) {
                    renderMessageContent(contentDiv, displayText, 'assistant');

                    contentDiv.appendChild(panel);

                    delete pendingThinkingSteps[rid];

                    streamingMessage.setAttribute('data-request-id', requestId);

                    request_id: requestId || currentRequestId || ''

                addMessage(displayText, 'assistant', true, requestId);
            }
