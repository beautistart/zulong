        // 发送消息
        function sendMessage() {
            const text = chatInput.value.trim();
            
            if (!text || !ws || ws.readyState !== WebSocket.OPEN) {
                return;
            }
            var now = Date.now();
            var fingerprint = (currentSessionId || '') + '::' + text;
            if (lastSendFingerprint === fingerprint && now - lastSendAt < 1200) {
                console.warn('[WebSocket] 忽略疑似重复发送:', fingerprint);
                return;
            }
            lastSendFingerprint = fingerprint;
            lastSendAt = now;
            resumeChatAutoScrollForNewTurn();
            var isAdjustment = _isGenerating;
            if (isAdjustment) {
                stopGeneration(true);
                addIdeSystemMessage('收到新的调整，正在打断当前执行并插入新要求。');
            }
            
            // 移除现有的流式消息容器
            const streamingMessage = document.getElementById('streamingMessage');
            if (streamingMessage) {
                streamingMessage.remove();
            }
            
            // 添加到聊天窗口
            addMessage(text, 'user');
            
            // 发送到服务器（包含测试信息）
            const requestId = generateId();
            currentRequestId = requestId;
            
            // 解析引用标记 @[名称#地址]（地址即节点完整路径，可用于模型定位）
            var refPattern = /@\[(.+?)#(.+?)\]/g;
            var match, referencedNodes = [];
            while ((match = refPattern.exec(text)) !== null) {
                referencedNodes.push({label: match[1], address: match[2]});
            }

            // 从 session store 读取当前会话的 task_graph_id (TSD §23.11.4)
            var store = loadSessionStore();
            var currentTaskGraphId = null;
            if (currentSessionId) {
                var activeSession = store.sessions.find(function(s) {
                    return s.id === currentSessionId;
                });
                if (activeSession) {
                    currentTaskGraphId = activeSession.task_graph_id || null;
                }
            }

            const messageData = {
                type: 'CHAT_MESSAGE',
                text: text,
                session_id: currentSessionId,  // 会话 ID (绑定根节点, TSD §23.11.3)
                conversation_id: currentSessionId,
                request_id: requestId,          // 请求 ID（关联思考过程）
                task_graph_id: currentTaskGraphId,  // 任务图谱 ID (TSD §23.11.4: 恢复锚点)
                task_graph_file_path: getActiveTaskGraphFilePath(),
                graph_file_path: getActiveTaskGraphFilePath(),
                workspace_path: getCurrentTaskGraphWorkspace(),
                cwd: getCurrentTaskGraphWorkspace(),
                referenced_nodes: referencedNodes,  // 引用的节点 {label, address} 列表
                source: isAdjustment ? 'web_chat_adjustment' : 'web_chat',
                user_adjustment: isAdjustment
            };
            
            console.log('[WebSocket] 📤 发送消息:', messageData);
            if (!sendWsMessage(messageData)) {
                console.error('[WebSocket] 发送失败，连接未就绪');
                addIdeSystemMessage('WebSocket 未连接，消息未发送。');
                return;
            }
            
            // 清空输入框
            chatInput.value = '';
            autoResizeChatInput();
            
            // 显示打字指示器
            showTypingIndicator();

            // 切换到停止模式
            switchToStopMode();
            startResponseWatchdog(text, requestId);
        }

        // ===== 思考过程面板功能 =====
        
        // 处理思考步骤消息
        function handleThinkingStep(data) {
            if (renderInteractionEvent(data)) return;
            var rid = data.request_id;
            if (!rid) return;
            
            var stepData = {
                step_type: data.step_type || 'unknown',
                iteration: data.iteration || 0,
                timestamp: data.timestamp || 0,
                data: data.data || {}
            };
            if (stepData.step_type === 'heartbeat' && stepData.data && stepData.data.state) {
                updateTaskStatusUi(Object.assign({}, stepData.data, {
                    request_id: data.request_id || '',
                    conversation_id: data.conversation_id || data.session_id || ''
                }));
            }
            
            // 🔥 流水线事件拦截：pipeline.* 类型的事件同时更新图谱
            if (stepData.step_type.indexOf('pipeline.') === 0) {
                handlePipelineEvent(stepData);
            }
            
            // 检查是否已有面板（已嵌入消息中）
            var panel = thinkingPanelMap[rid];
            if (panel) {
                appendStepToPanel(panel, stepData);
            } else {
                // 面板尚未创建（消息还没到），缓存步骤
                if (!pendingThinkingSteps[rid]) {
                    pendingThinkingSteps[rid] = [];
                }
                pendingThinkingSteps[rid].push(stepData);
                
                // 在打字指示器旁显示实时思考预览
                updateTypingThinkingPreview(rid, stepData);
            }
        }
        
        // 处理流水线事件（更新任务图谱）
        function handlePipelineEvent(stepData) {
            var pipelineType = stepData.step_type.replace('pipeline.', '');
            var eventData = stepData.data || {};
            
            switch (pipelineType) {
                case 'pipeline_start':
                    // Gatekeeper 发布的初始图谱事件
                    if (eventData.graph) {
                        var result0 = addTaskGraph(eventData.graph);
                        // 仅在首次创建新图谱时才自动展开面板（避免旧图重复推送触发展开）
                        if (result0.isNew) {
                            var wrapper0 = document.getElementById('appWrapper');
                            if (wrapper0 && !wrapper0.classList.contains('split-mode')) {
                                toggleTaskGraph();
                            }
                        }
                        console.log('[Pipeline] 图谱事件:', eventData.graph.title, result0.isNew ? '(新建)' : '(更新)');
                    }
                    renderPipelineInteraction(eventData, pipelineType);
                    updatePipelineProgressCard(eventData, pipelineType);
                    break;

                case 'agent_start':
                    // Agent启动 → 通过 addTaskGraph 做 backendId 匹配
                    if (eventData.graph) {
                        var result1 = addTaskGraph(eventData.graph);
                        // 仅新建时自动打开图谱面板
                        if (result1.isNew) {
                            var wrapper = document.getElementById('appWrapper');
                            if (wrapper && !wrapper.classList.contains('split-mode')) {
                                toggleTaskGraph();
                            }
                        }
                        console.log('[Agent] 图谱事件:', eventData.graph.title, '工具数:', eventData.tool_count, result1.isNew ? '(新建)' : '(更新)');
                    }
                    renderPipelineInteraction(eventData, pipelineType);
                    updatePipelineProgressCard(eventData, pipelineType);
                    break;

                case 'agent_tool_call':
                    // Agent工具调用 → 通过 addTaskGraph 做 backendId 匹配
                    // addTaskGraph 会自动：backendId 匹配则更新，不匹配则创建新条目
                    if (eventData.graph) {
                        addTaskGraph(eventData.graph);
                    }
                    renderPipelineInteraction(eventData, pipelineType);
                    updatePipelineProgressCard(eventData, pipelineType);
                    console.log('[Agent] Turn', eventData.turn, '调用工具:', eventData.tool);
                    break;

                case 'agent_done':
                    // Agent完成 → 最终图谱同步
                    if (eventData.graph) {
                        addTaskGraph(eventData.graph);
                    }
                    renderPipelineInteraction(eventData, pipelineType);
                    updatePipelineProgressCard(eventData, pipelineType);
                    console.log('[Agent] 完成, 耗时:', eventData.duration, 's, 轮次:', eventData.turns);
                    break;

                case 'agent_error':
                    renderPipelineInteraction(eventData, pipelineType);
                    updatePipelineProgressCard(eventData, pipelineType);
                    console.error('[Agent] 异常:', eventData.error);
                    break;

                case 'supervisor_inject':
                    console.log('[Agent] Supervisor 注入消息:', eventData.message);
                    break;

                case 'graph_update':
                    // 单节点更新
                    if (eventData.data && eventData.data.node_id) {
                        updateGraphNode(
                            eventData.data.node_id,
                            eventData.data.status,
                            eventData.data.result
                        );
                    }
                    break;
            }
        }

        // 确保图谱已创建（如果错过了 agent_start 事件）
        function ensureGraphExists(graphData) {
            if (!activeGraphId) {
                var result = addTaskGraph(graphData);
                if (result.isNew) {
                    var wrapper = document.getElementById('appWrapper');
                    if (wrapper && !wrapper.classList.contains('split-mode')) {
                        toggleTaskGraph();
                    }
                }
                console.log('[Agent] 补创建图谱:', graphData.title);
            }
        }
        
        // 🔥 更新活跃图谱的完整数据
        function updateActiveGraph(graphData) {
            if (!activeGraphId) return;
            var graphs = getSessionGraphs();
            for (var i = 0; i < graphs.length; i++) {
                if (graphs[i].id === activeGraphId) {
                    graphs[i].nodes = normalizeGraphNodes(graphData.nodes || graphs[i].nodes);
                    graphs[i].hEdges = graphData.hEdges || graphs[i].hEdges;
                    graphs[i].dEdges = graphData.dEdges || graphs[i].dEdges;
                    if (graphData.graphAddress) graphs[i].graphAddress = graphData.graphAddress;
                    break;
                }
            }
            saveSessionGraphs(graphs);
            renderGraphById(activeGraphId);
        }
        
        // 🔥 更新图谱中单个节点的状态
        function updateGraphNode(nodeId, status, result) {
            if (!activeGraphId) return;
            var graphs = getSessionGraphs();
            for (var i = 0; i < graphs.length; i++) {
                if (graphs[i].id === activeGraphId) {
                    var nodes = graphs[i].nodes || [];
                    for (var j = 0; j < nodes.length; j++) {
                        if (nodes[j].id === nodeId) {
                            nodes[j].status = status;
                            if (result !== undefined && result !== null) {
                                nodes[j].result = result;
                            }
                            break;
                        }
                    }
                    break;
                }
            }
            saveSessionGraphs(graphs);
            renderGraphById(activeGraphId);
        }
        
        // 创建执行明细面板 DOM

        // 向面板追加一个步骤
        function appendStepToPanel(panel, stepData) {
            var stepsContainer = panel.querySelector('.thinking-steps');
            if (!stepsContainer) return;
            
            var stepEl = document.createElement('div');
            stepEl.className = 'thinking-step ' + stepData.step_type;
            
            var icon = getStepIcon(stepData.step_type);
            var label = getStepLabel(stepData.step_type, stepData.data);
            var detail = getStepDetail(stepData.step_type, stepData.data);
            
            var html = (icon ? '<span class="step-icon">' + icon + '</span>' : '') + '<div class="step-body">';
            html += '<span class="step-label">' + label + '</span>';

            }
            html += '</div>';

                html += '<span class="step-time">iter ' + stepData.iteration + '</span>';
            }
            
            stepEl.innerHTML = html;
            stepsContainer.appendChild(stepEl);
            
            // 更新步骤计数

            if (countEl) {

        // 获取步骤图标
        function getStepIcon(stepType) {
            var icons = {
                'iteration_start': '🔄',
                'model_call': '🤖',
                'tool_call': '🔧',
                'tool_result': '📋',
                'cb_evaluation': '⚡',
                'inference_complete': '✅',
                'search_link': '🔗',
                'pipeline.graph_update': '📊',
                'pipeline.agent_start': '',
                'pipeline.agent_tool_call': '',
                'pipeline.agent_done': '',
                'pipeline.agent_error': '',
                'pipeline.supervisor_inject': ''
            };
            return icons[stepType] || '📌';
        }
        
        // 获取步骤标签
        function getStepLabel(stepType, data) {
            switch (stepType) {
                case 'iteration_start':
                    return '第 ' + (data.iteration_number || '?') + ' 轮推理';
                case 'model_call':
                    return '调用模型';
                case 'tool_call':
                    return '正在' + friendlyToolName(data.tool_name || '');
                case 'tool_result':
                    var dur = data.duration ? ' (' + data.duration.toFixed(1) + 's)' : '';
                    return friendlyToolName(data.tool_name || '') + '已完成' + dur;
                case 'cb_evaluation':
                    return 'CB 评估: ' + (data.result || '');
                case 'inference_complete':
                    return '推理完成';
                case 'search_link':
                    return '搜索链接';
                case 'pipeline.graph_update':
                    return '图谱更新';
                case 'pipeline.agent_start':
                    return '已准备上下文' + (data.tool_count ? ' (' + data.tool_count + ' 项候选能力)' : '');
                case 'pipeline.agent_tool_call':
                    return data.tool_result
                        ? (friendlyToolName(data.tool || '') + '已完成')
                        : ('正在' + friendlyToolName(data.tool || ''));
                case 'pipeline.agent_done':
                    var ad = data.duration ? (' (' + data.duration + 's)') : '';
                    return '这轮处理完成' + ad + (data.turns ? ' (' + data.turns + ' 轮)' : '');
                case 'pipeline.agent_error':
                    return '执行异常: ' + sanitizeInteractionText(data.error || '', '需要复核');
                case 'pipeline.supervisor_inject':
                    return (data.message || '').substring(0, 80);
                default:
                    return stepType;
            }
        }
        
        // 获取步骤详情 HTML
        function getStepDetail(stepType, data) {
            switch (stepType) {
                case 'iteration_start':
                    var maxIter = data.max_iterations || '?';
                    return '最大迭代: ' + maxIter;
                case 'model_call':
                    if (data.prompt_length) {
                        return 'Prompt 长度: ' + data.prompt_length;
                    }
                    return '';
                case 'tool_call':
                    if (data.arguments) {
                        var argStr = typeof data.arguments === 'string' ? data.arguments : JSON.stringify(data.arguments);
                        if (argStr.length > 120) argStr = argStr.substring(0, 120) + '...';
                        return '参数: ' + escapeHtml(argStr);
                    }
                    return '';
                case 'tool_result':
                    if (data.summary) {
                        var summary = data.summary;
                        if (summary.length > 150) summary = summary.substring(0, 150) + '...';
                        return escapeHtml(summary);
                    }
                    return '';
                case 'cb_evaluation':
                    if (data.detail) {
                        return escapeHtml(data.detail);
                    }
                    return '';
                case 'inference_complete':
                    var parts = [];
                    if (data.total_iterations) parts.push('共 ' + data.total_iterations + ' 轮');
                    if (data.total_duration) parts.push('耗时 ' + data.total_duration.toFixed(1) + 's');
                    return parts.join(' | ');
                case 'search_link':
                    if (data.urls && data.urls.length > 0) {
                        return data.urls.map(function(url) {
                            return '<a href="' + escapeHtml(url) + '" target="_blank" rel="noopener">' + escapeHtml(url) + '</a>';
                        }).join('<br>');
                    }
                    if (data.url) {
                        return '<a href="' + escapeHtml(data.url) + '" target="_blank" rel="noopener">' + escapeHtml(data.url) + '</a>';
                    }
                    return '';
                default:
                    return '';
            }
        }
        
        // HTML 转义
        function escapeHtml(str) {
            var div = document.createElement('div');
            div.appendChild(document.createTextNode(str));
            return div.innerHTML;
        }
        
        // 在打字指示器位置显示实时思考预览
        function updateTypingThinkingPreview(requestId, stepData) {
            var indicator = document.getElementById('typingIndicator');

        // ================================================================
        let _modulePollTimer = null;

        function toggleModulePanel() {
            const panel = document.getElementById('modulePanel');
            const visible = panel.classList.toggle('visible');
            if (visible) {
                fetchModuleStatus();
                if (!_modulePollTimer) {

                }

            }

        async function fetchModuleStatus() {
            try {
                const resp = await fetch('/api/status');
                if (!resp.ok) return;
                const data = await resp.json();
                renderModulePanel(data);
            } catch (e) {
                console.warn('[ModulePanel] 获取状态失败:', e);
            }
        }

        function renderModulePanel(data) {
            const modeEl = document.getElementById('mpMode');
            modeEl.textContent = data.mode ? (data.mode === 'full' ? 'Full 模式' : 'IDE 模式') : '--';

            const body = document.getElementById('modulePanelBody');
            if (!data.modules) { body.innerHTML = '<div style="color:#64748b;font-size:12px;text-align:center;padding:30px;">暂无模块信息</div>'; return; }

            const modules = Object.values(data.modules);
            const core = modules.filter(m => !m.optional);
            const optional = modules.filter(m => m.optional);

            let html = '';
            if (core.length > 0) {
                html += '<div class="module-section-title">核心模块</div>';
                core.forEach(m => { html += _renderModuleCard(m, false); });
            }
            if (optional.length > 0) {
                html += '<div class="module-section-title">可选模块</div>';
                optional.forEach(m => { html += _renderModuleCard(m, true); });
            }
            body.innerHTML = html;

            // 绑定开关事件
            body.querySelectorAll('.mc-switch input').forEach(input => {
                input.addEventListener('change', async function() {
                    const name = this.dataset.module;
                    const action = this.checked ? 'start' : 'stop';
                    this.disabled = true;
                    try {
                        const r = await fetch('/api/module/' + name + '/' + action, { method: 'POST' });
                        const result = await r.json();
                        if (result.error) { alert(result.error); }
                    } catch(e) { alert('操作失败: ' + e.message); }
                    setTimeout(fetchModuleStatus, 500);
                });
            });
        }

            const isRunning = stateClass === 'running';
            const switchHtml = switchable
                ? '<label class="mc-switch"><input type="checkbox" data-module="' + m.name + '"' + (isRunning ? ' checked' : '') + '><span class="slider"></span></label>'

            return '<div class="module-card">'
                + '<div class="mc-indicator ' + stateClass + '"></div>'
                + '<div class="mc-info"><div class="mc-name">' + (m.display_name || m.name) + '</div><div class="mc-state">' + stateLabel + (m.error ? ' - ' + m.error : '') + '</div></div>'

        }

        function renderLayerCard(layer) {
            const statusClass = layer.status || 'unloaded';
            const statusLabel = { running: '运行中', stopped: '已停止', unloaded: '未加载', error: '出错' }[statusClass] || statusClass;
            let summary = '';
            let bodyHtml = '';

            if (layer.type === 'rule') {
                summary = '规则驱动';
                bodyHtml = '<div style="color:#64748b;font-size:11px;padding:8px 0;">该层无独立模型配置</div>';
            } else if (layer.type === 'cloud') {
                const cfg = layer.config || {};
                summary = (_backendDisplayNames[cfg.backend] || cfg.backend || '') + ' / ' + ((cfg.model_id || '').split('/').pop() || '');
                bodyHtml = _renderCloudFields(layer);
            } else if (layer.type === 'local') {
                const cfg = layer.config || {};
                summary = (cfg.model_path || '').split('/').pop() + ' · ' + (cfg.device || '');
                bodyHtml = _renderLocalFields(layer);
            } else if (layer.type === 'vision') {
                const cfg = layer.config || {};
                summary = (cfg.model_path || '').split('/').pop() + ' · ' + (cfg.device || '');
                bodyHtml = _renderVisionFields(layer);
            } else if (layer.type === 'audio') {
                const cfg = layer.config || {};
                summary = (cfg.backend || '') + ' · ' + (cfg.voice || '');
                bodyHtml = _renderAudioFields(layer);
            } else if (layer.type === 'expert') {
                const experts = (layer.config || {}).experts || [];
                summary = experts.length + ' 个专家模型';
                bodyHtml = _renderExpertFields(layer);
            }

            return '<div class="layer-card" data-layer-id="' + layer.id + '">'
                + '<div class="layer-card-header">'
                + '<div class="layer-card-indicator ' + statusClass + '"></div>'
                + '<span class="layer-card-title">' + layer.name + '</span>'
                + '<span class="layer-card-summary">' + summary + '</span>'
                + '<span class="layer-card-expand">&#9660;</span>'
                + '</div>'
                + '<div class="layer-card-body">' + bodyHtml + '</div>'
                + '</div>';
        }

        function _renderCloudFields(layer) {
            const cfg = layer.config || {};
            let opts = '';
            _availableBackends.forEach(function(b) {
                opts += '<option value="' + b + '"' + (b === cfg.backend ? ' selected' : '') + '>' + (_backendDisplayNames[b] || b) + '</option>';
            });
            return '<div class="layer-field"><label>后端</label><select data-field="backend">' + opts + '</select></div>'

            for (var i = _CTX_PRESETS.length - 1; i >= 0; i--) {

        function onCtxValueClick(layerId) {
            var valEl = document.getElementById('ctxVal_' + layerId);
            var hidden = document.getElementById('ctxHidden_' + layerId);
            var currentVal = parseInt(hidden.value) || 131072;
            // 替换显示文本为输入框
            var input = document.createElement('input');
            input.type = 'number';
            input.className = 'ctx-window-input';
            input.value = currentVal;
            input.min = 1024;
            input.max = 2097152;
            input.step = 1024;
            valEl.replaceWith(input);
            input.focus();
            input.select();

            function commit() {
                var v = parseInt(input.value);
                if (!v || v < 1024) v = 1024;
                if (v > 2097152) v = 2097152;
                hidden.value = v;
                // 恢复显示
                var span = document.createElement('span');
                span.className = 'ctx-window-value';
                span.id = 'ctxVal_' + layerId;

                card.querySelectorAll('.ctx-preset-btn').forEach(function(btn, i) {
                    btn.classList.toggle('active', _CTX_PRESETS[i] === v);
                });
            }

            input.addEventListener('blur', commit);
            input.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') { e.preventDefault(); commit(); }
                if (e.key === 'Escape') {

                }
            });

        function deleteChatMessage(msgId, msgEl, deleteBelow) {
            if (!currentSessionId) return;

            // 收集要删除的消息 ID（后端批量删除）
            let removedIds = [];
            if (deleteBelow) {
                let el = msgEl;
                while (el) {
                    const mid = el.getAttribute('data-msg-id');
                    if (mid) removedIds.push(mid);
                    el = el.nextElementSibling;
                }
            } else {
                removedIds = [msgId];
            }

            // 前端 DOM 移除
            if (deleteBelow) {
                let el = msgEl;
                while (el) {
                    const next = el.nextElementSibling;
                    el.remove();
                    el = next;
                }
            } else {
                msgEl.remove();
            }

            const store = loadSessionStore();
            const session = store.sessions.find(function(s) { return s.id === currentSessionId; });
            if (session && Array.isArray(session.messages)) {
                const removedSet = new Set(removedIds);
                session.messages = session.messages.filter(function(msg) {
                    return !removedSet.has(msg.id) &&
                        !removedSet.has(msg.node_id || '') &&
                        !removedSet.has(msg.pair_id || '');
                });
                saveSessionStore(store);
            }

            // 后端删除（逐条）
            removedIds.forEach(function(id) {
                fetch('/api/chat/sessions/' + encodeURIComponent(currentSessionId) + '/messages/' + encodeURIComponent(id), {
                    method: 'DELETE'
                }).then(function(r) { return r.json(); }).then(function(result) {
                    if (result && result.mg_nodes_deleted > 0) {
                        console.log('[Message] 同步删除记忆节点:', result.mg_nodes_deleted);

                    scheduleMemoryGraphRealtimeRefresh(250);
                }).catch(function(e) {
                    console.warn('[Message] 后端删除失败:', e);
                });
            });

            showToast(deleteBelow ? '已删除该消息及以下内容' : '已删除消息', 'success');
        }

        var _graphUpdateTimers = {};

        function _syncCodeAnchorCacheFromGraph(graphData) {
            // 从任务图谱数据中回填 codeAnchorCache（页面刷新后恢复锚点数据）
            if (!graphData) return;
            // 节点中的代码锚点
            var nodes = graphData.nodes || [];
            for (var i = 0; i < nodes.length; i++) {
                var anchors = nodes[i].code_anchors;
                if (anchors && anchors.length) {
                    for (var j = 0; j < anchors.length; j++) {
                        var a = anchors[j];
                        if (a && a.id) {
                            codeAnchorCache.set(a.id, a);
                        }
                    }
                }
            }
            // 图谱级别的代码锚点（可能是以 id 为 key 的 map）
            var graphAnchors = graphData.code_anchors;
            if (graphAnchors && typeof graphAnchors === 'object') {
                var keys = Object.keys(graphAnchors);
                for (var k = 0; k < keys.length; k++) {
                    var ga = graphAnchors[keys[k]];
                    if (ga && ga.id && !codeAnchorCache.has(ga.id)) {
                        codeAnchorCache.set(ga.id, ga);
                    }
                }
            }
        }

        function normalizeFilePathForKey(path) {
            return (path || '').replace(/\//g, '\\').replace(/\\+/g, '\\').toLowerCase();
        }

        function shouldPreferFileRef(candidate, current) {
            var cp = candidate && candidate.path ? candidate.path : '';
            var op = current && current.path ? current.path : '';
            var cAbs = /^[a-z]:\\/i.test(cp) || /^\\\\/.test(cp);
            var oAbs = /^[a-z]:\\/i.test(op) || /^\\\\/.test(op);
            if (cAbs !== oAbs) return cAbs;
            return cp.length < op.length;
        }

        function dedupeGraphFiles(files) {
            if (!files || !files.length) return [];
            var exact = {};
            var byName = {};
            files.forEach(function(f) {
                if (!f) return;
                var name = f.name || ((f.path || '').split(/[\\/]/).pop()) || '文件';
                var ref = { name: name, path: f.path || '' };
                var key = normalizeFilePathForKey(ref.path || name);
                if (exact[key]) {
                    if (shouldPreferFileRef(ref, exact[key])) exact[key] = ref;
                    return;
                }
                exact[key] = ref;
            });
            Object.keys(exact).forEach(function(key) {
                var ref = exact[key];
                var nameKey = (ref.name || '').toLowerCase();
                if (!byName[nameKey] || shouldPreferFileRef(ref, byName[nameKey])) {
                    byName[nameKey] = ref;
                }
            });
            return Object.keys(byName).map(function(k) { return byName[k]; });
        }

        function isCodeGraphNodeId(nodeId) {
            return String(nodeId || '').indexOf('crg_') === 0;
        }

        function isCodeGraphNode(node) {
            return !!node && isCodeGraphNodeId(node.id);
        }

        function isTaskProgressNode(node) {
            return !!node && !isCodeGraphNode(node);
        }

        function getTaskProgressNodes(nodes) {
            return (nodes || []).filter(isTaskProgressNode);
        }

        function countDoneTaskNodes(nodes) {
            return getTaskProgressNodes(nodes).filter(function(n) {
                return n.status === 'completed' || n.status === 'skipped';
            }).length;
        }

        function normalizeGraphNodes(nodes) {
            return (nodes || []).map(function(n) {
                if (!n) return n;
                var copy = Object.assign({}, n);
                copy.files = dedupeGraphFiles(copy.files || []);
                return copy;
            });
        }

        function addTaskGraph(graphData) {
            const graphs = getSessionGraphs();
            var backendId = graphData.id || '';
            var backendTitle = cleanDisplayText(graphData.title || '');
            var graphAddress = graphData.graphAddress || '';
            var workspaceDir = normalizeWorkspacePath(
                graphData.workspace_dir || graphData.workspace_path || graphData.cwd || ''
            );
            var existingIdx = -1;
            if (backendId) {
                for (var i = 0; i < graphs.length; i++) {
                    if (graphs[i].backendId === backendId) {
                        existingIdx = i;
                        break;
                    }
                }
            }
            if (existingIdx >= 0) {
                graphs[existingIdx].nodes = normalizeGraphNodes(graphData.nodes || graphs[existingIdx].nodes);
                graphs[existingIdx].hEdges = graphData.hEdges || graphs[existingIdx].hEdges;
                graphs[existingIdx].dEdges = graphData.dEdges || graphs[existingIdx].dEdges;
                graphs[existingIdx].title = backendTitle || graphs[existingIdx].title;
                if (graphAddress) graphs[existingIdx].graphAddress = graphAddress;
                if (workspaceDir) {
                    graphs[existingIdx].workspace_dir = workspaceDir;
                    graphs[existingIdx].workspace_path = workspaceDir;
                    ideContext.workspace_path = workspaceDir;
                }
                var taskGraphFilePath = normalizeWorkspacePath(
                    graphData.task_graph_file_path ||
                    graphData.graph_file_path ||
                    (graphData.metadata && (graphData.metadata.task_graph_file_path || graphData.metadata.graph_file_path)) ||
                    ''
                );
                if (taskGraphFilePath) {
                    graphs[existingIdx].task_graph_file_path = taskGraphFilePath;
                    graphs[existingIdx].graph_file_path = taskGraphFilePath;
                }
                if (graphData.metadata) graphs[existingIdx].metadata = graphData.metadata;
                if (graphData.code_anchors) graphs[existingIdx].code_anchors = graphData.code_anchors;
                activeGraphId = graphs[existingIdx].id;
                _syncCodeAnchorCacheFromGraph(graphData);  // 回填 codeAnchorCache，防止页面刷新后锚点丢失

                // 增量更新：如果当前显示的图谱就是这个，尝试只更新变化的节点
                if (activeGraphId === graphs[existingIdx].id && _tryIncrementalUpdate(graphData)) {
                    // 增量更新成功，延迟写localStorage
                    _graphPendingData[backendId] = graphs;
                    if (!_graphUpdateTimers[backendId]) {
                        _graphUpdateTimers[backendId] = setTimeout(function() {
                            delete _graphUpdateTimers[backendId];
                            var pending = _graphPendingData[backendId];
                            delete _graphPendingData[backendId];
                            if (pending) saveSessionGraphs(pending);
                        }, 500);
                    }
                    renderGraphList();
                    return { id: graphs[existingIdx].id, isNew: false };
                }

                // 增量更新失败（首次渲染或结构变化），立即全量重绘 + 延迟写localStorage
                _graphPendingData[backendId] = graphs;
                if (!_graphUpdateTimers[backendId]) {
                    _graphUpdateTimers[backendId] = setTimeout(function() {
                        delete _graphUpdateTimers[backendId];
                        var pending = _graphPendingData[backendId];
                        delete _graphPendingData[backendId];
                        if (pending) saveSessionGraphs(pending);
                    }, 300);
                }
                renderGraphList();
                renderGraphById(activeGraphId);
                return { id: graphs[existingIdx].id, isNew: false };
            }
            const newGraph = {
                id: generateId(),
                backendId: backendId,
                graphAddress: graphAddress,
                title: backendTitle || '任务图谱 ' + (graphs.length + 1),
                createdAt: Date.now(),
                nodes: normalizeGraphNodes(graphData.nodes || []),
                hEdges: graphData.hEdges || [],
                dEdges: graphData.dEdges || [],
                workspace_dir: workspaceDir,
                workspace_path: workspaceDir,
                task_graph_file_path: normalizeWorkspacePath(
                    graphData.task_graph_file_path ||
                    graphData.graph_file_path ||
                    (graphData.metadata && (graphData.metadata.task_graph_file_path || graphData.metadata.graph_file_path)) ||
                    ''
                ),
                graph_file_path: normalizeWorkspacePath(
                    graphData.task_graph_file_path ||
                    graphData.graph_file_path ||
                    (graphData.metadata && (graphData.metadata.task_graph_file_path || graphData.metadata.graph_file_path)) ||
                    ''
                ),
                metadata: graphData.metadata || {},
                code_anchors: graphData.code_anchors || {}
            };
            if (workspaceDir) ideContext.workspace_path = workspaceDir;
            graphs.unshift(newGraph);
            saveSessionGraphs(graphs);
            activeGraphId = newGraph.id;
            _syncCodeAnchorCacheFromGraph(graphData);  // 回填 codeAnchorCache，防止页面刷新后锚点丢失
            renderGraphList();
            renderGraphById(newGraph.id);
            return { id: newGraph.id, isNew: true };
        }

        // 增量DOM更新：仅更新节点状态（status/class），不重建SVG
        // 返回true表示增量成功，false表示需要全量重绘
        function _tryIncrementalUpdate(graphData) {
            var singleCard = document.querySelector('#graphSvgArea .tg-single-node-card');
            if (singleCard) return false;
            var gsvg = document.getElementById('graphSvg');
            if (!gsvg || !gsvg.children.length) return false;
            var newNodes = graphData.nodes;
            if (!newNodes || !newNodes.length) return false;

            var existingNodes = gsvg.querySelectorAll('.gnode');
            if (existingNodes.length !== newNodes.length) return false;

            var changed = false;
            for (var i = 0; i < newNodes.length; i++) {
                var n = newNodes[i];
                var el = gsvg.querySelector('.gnode[data-id="' + n.id + '"]');
                if (!el) return false;  // 节点ID不匹配，需全量重绘

                var oldClass = el.getAttribute('class');
                var newClass = 'gnode status-' + (n.status || 'pending');
                if (oldClass !== newClass) {
                    el.setAttribute('class', newClass);
                    changed = true;

                    // 更新状态标签文字
                    var tagTexts = el.querySelectorAll('text');
                    var statusLabel = SZH[n.status] || n.status || '';
                    for (var j = tagTexts.length - 1; j >= 0; j--) {
                        var t = tagTexts[j];
                        if (t.textContent && t.textContent.startsWith('[')) {
                            t.textContent = '[' + statusLabel + ']';
                            break;
                        }
                    }
                    // 更新状态图标
                    var icoTexts = el.querySelectorAll('text[font-size="11"]');
                    if (icoTexts.length && SICO[n.status]) {
                        icoTexts[0].textContent = SICO[n.status];
                    }
                    // 更新状态标签背景色
                    var tagRects = el.querySelectorAll('rect');
                    for (var j = tagRects.length - 1; j >= 0; j--) {
                        var r = tagRects[j];
                        if (r.getAttribute('rx') === '4' && r.getAttribute('height') === '16') {
                            r.setAttribute('fill', STBG[n.status] || '#f1f5f9');
                            break;
                        }
                    }
                    // 更新左侧状态条颜色
                    var allRects = el.querySelectorAll('rect');
                    for (var k = 0; k < allRects.length; k++) {
                        var rr = allRects[k];
                        if (rr.getAttribute('width') === '4' && rr.getAttribute('rx') === '2') {
                            rr.setAttribute('fill', SCOLOR[n.status] || '#cbd5e1');
                            break;
                        }
                    }
                    // 更新标签前景色
                    var tagFgTexts = el.querySelectorAll('text[font-weight="700"]');
                    for (var j = tagFgTexts.length - 1; j >= 0; j--) {
                        var t = tagFgTexts[j];
                        if (t.textContent && t.textContent.startsWith('[')) {
                            t.setAttribute('fill', STFG[n.status] || '#64748b');
                            break;
                        }
                    }
                }
            }

            if (changed) {
                // 更新图谱节点完成数
                var taskNodes = getTaskProgressNodes(newNodes);
                var gTot = taskNodes.length;
                var gDone = countDoneTaskNodes(taskNodes);
                var gCode = newNodes.length - taskNodes.length;
                var gpPtext = document.getElementById('gp-ptext');
                var gpPfill = document.getElementById('gp-pfill');
                if (gpPtext) gpPtext.textContent = gDone+'/'+gTot+' 已完成' + (gCode > 0 ? ' · 代码 ' + gCode : '');
                if (gpPfill) gpPfill.style.width = (gTot > 0 ? (gDone/gTot*100).toFixed(0) : '0') + '%';
            }

            return true;
        }

        // 切换到指定图谱
        function switchToGraph(graphId) {
            activeGraphId = graphId;
            renderGraphList();
            renderGraphById(graphId);

            // 通知后端：用户激活了此图谱（接口预留，后端处理待讨论后实现）
            if (ws && ws.readyState === WebSocket.OPEN) {
                var graphs = getSessionGraphs();
                var graph = graphs.find(function(g) { return g.id === graphId; });
                if (graph) {
                    sendWsMessage({
                        type: 'ACTIVATE_TASK_GRAPH',
                        graphId: graphId,
                        graphData: {
                            title: graph.title,
                            nodes: graph.nodes,
                            hEdges: graph.hEdges,
                            dEdges: graph.dEdges
                        }
                    });
                    console.log('[WebSocket] 📤 激活图谱:', graphId);
                }
            }
        }

        // 删除图谱（前端 + 后端）
        function deleteGraph(graphId, ev) {
            if (ev) ev.stopPropagation();
            const graphs = getSessionGraphs();
            // 找到要删除的图谱，获取其 backendId
            const target = graphs.find(g => g.id === graphId);
            const backendId = target ? (target.backendId || '') : '';
            const filtered = graphs.filter(g => g.id !== graphId);
            saveSessionGraphs(filtered);

            if (activeGraphId === graphId) {
                if (filtered.length > 0) {
                    activeGraphId = filtered[0].id;
                    renderGraphList();
                    renderGraphById(filtered[0].id);
                } else {
                    activeGraphId = null;
                    renderGraphList();
                    clearGraphSvg();
                }
            } else {
                renderGraphList();
            }

            // 调用后端删除 API（使用 backendId）
            if (backendId) {
                fetch('/api/task-graph/' + encodeURIComponent(backendId), {
                    method: 'DELETE'
                }).then(function(r) { return r.json(); }).then(function(result) {
                    if (result.status === 'ok') {
                        console.log('[TaskGraph] 后端已删除:', backendId,
                            'cleared_active:', result.cleared_active,
                            'deleted_backup:', result.deleted_backup);
                    }
                }).catch(function(e) {
                    console.warn('[TaskGraph] 后端删除失败:', e);
                });
            }
            showToast('图谱已删除', 'success');
        }

        // 展开/收起图谱列表
        function toggleGraphList() {
            const list = document.getElementById('graphList');
            const btn = document.getElementById('graphListToggle');
            const collapsed = list.classList.toggle('collapsed');
            btn.textContent = collapsed ? '▶' : '▼';
        }

        // 渲染图谱列表
        function renderGraphList() {
            const container = document.getElementById('graphItems');
            if (!container) return;
            container.innerHTML = '';
            const graphs = getSessionGraphs();

            if (graphs.length === 0) {
                container.innerHTML = renderEmptyGraphSetup();
                return;
            }

            graphs.forEach(function(g) {
                const div = document.createElement('div');
                div.className = 'graph-item' + (g.id === activeGraphId ? ' active' : '');
                div.onclick = function() { switchToGraph(g.id); };

                const icon = document.createElement('span');
                icon.className = 'graph-item-icon';
                icon.textContent = '📊';

                const title = document.createElement('span');
                title.className = 'graph-item-title';
                title.textContent = cleanDisplayText(g.title);

                const taskNodes = getTaskProgressNodes(g.nodes || []);
                const nodeCount = taskNodes.length;
                const doneCount = countDoneTaskNodes(taskNodes);
                const status = document.createElement('span');
                status.className = 'graph-item-status';
                status.textContent = doneCount + '/' + nodeCount;

                const del = document.createElement('button');
                del.className = 'graph-item-delete';
                del.textContent = '\u2715';
                del.title = '删除图谱';
                del.onclick = function(e) { deleteGraph(g.id, e); };

                div.appendChild(icon);
                div.appendChild(title);
                div.appendChild(status);
                div.appendChild(del);
                container.appendChild(div);
            });
        }

        // 清空图谱SVG
        function clearGraphSvg() {
            destroyTaskGraphCanvas();
            var graphArea = document.getElementById('graphSvgArea');
            if (graphArea) graphArea.innerHTML = '';
            document.getElementById('gp-ptext').textContent = '0/0';
            document.getElementById('gp-pfill').style.width = '0%';
            if (document.getElementById('gp-detail')) {
                document.getElementById('gp-detail').innerHTML = '<div class="gp-placeholder">暂无图谱<br>选择或等待新图谱生成</div>';
            }
            if (document.getElementById('gp-llm')) {
                document.getElementById('gp-llm').innerHTML = '<div class="gp-placeholder">暂无图谱数据</div>';
            }
            if (document.getElementById('gp-fullText')) {
                document.getElementById('gp-fullText').textContent = '';
            }
        }

        // 根据ID渲染图谱
        function renderGraphById(graphId) {
            const graphs = getSessionGraphs();
            const graph = graphs.find(function(g) { return g.id === graphId; });
            if (!graph || !graph.nodes || graph.nodes.length === 0) {
                clearGraphSvg();
                return;
            }
            window._currentGraphCodeAnchors = graph.code_anchors || {};
            renderGraphData(graph.nodes, graph.hEdges, graph.dEdges);
        }

        function isDisplayTaskGraphNode(node) {
            return !!node;
        }

        function normalizeTaskGraphForDisplay(nodes, hEdges, dEdges) {
            var visibleNodes = (nodes || []).filter(isDisplayTaskGraphNode);
            var ids = new Set(visibleNodes.map(function(n) { return n.id; }));
            return {
                nodes: visibleNodes,
                hEdges: (hEdges || []).filter(function(e) {
                    return ids.has(e[0]) && ids.has(e[1]);
                }),
                dEdges: (dEdges || []).filter(function(e) {
                    return ids.has(e.s) && ids.has(e.t);
                })
            };
        }

        // 当图谱面板可见时刷新图谱列表（会话切换时调用）
        function refreshGraphListIfVisible() {
            var wrapper = document.getElementById('appWrapper');
            var container = document.getElementById('graphItems');
            if (!container) return;

                activeGraphId = graphs[0].id;

        // ===== 拖拽 Resize 功能 =====
        (function initResizeHandle() {
            var handle = document.getElementById('resizeHandle');
            var chatContainer = document.querySelector('.chat-container');
            var graphPanel = document.getElementById('graphPanel');
            var wrapper = document.getElementById('appWrapper');
            var isDragging = false;
            var startX = 0;
            var startChatWidth = 0;

            handle.addEventListener('mousedown', function(e) {
                if (e.target.classList.contains('graph-collapse-btn')) return; // 不拦截按钮点击
                e.preventDefault();
                isDragging = true;
                startX = e.clientX;
                startChatWidth = chatContainer.getBoundingClientRect().width;
                handle.classList.add('dragging');
                document.body.style.cursor = 'col-resize';
                document.body.style.userSelect = 'none';
            });

            document.addEventListener('mousemove', function(e) {
                if (!isDragging) return;
                var wrapperWidth = wrapper.getBoundingClientRect().width;
                var dx = e.clientX - startX;
                var newChatWidth = startChatWidth + dx;
                var minChat = wrapperWidth < 720 ? 220 : 280;
                var minGraph = wrapperWidth < 720 ? 220 : 300;
                var maxChat = Math.max(minChat, wrapperWidth - minGraph);
                newChatWidth = Math.max(minChat, Math.min(maxChat, newChatWidth));
                var chatPct = (newChatWidth / wrapperWidth) * 100;
                chatContainer.style.flex = '0 1 ' + chatPct + '%';
                chatContainer.style.maxWidth = 'none';
                graphPanel.style.flex = '1 1 0';
                graphPanel.style.maxWidth = 'none';
                refreshTaskGraphViewport();
            });

            document.addEventListener('mouseup', function() {
                if (!isDragging) return;
                isDragging = false;
                handle.classList.remove('dragging');
                document.body.style.cursor = '';
                document.body.style.userSelect = '';
                refreshTaskGraphViewport();
            });
        })();

        // Tab 切换：记忆图谱 / 任务图谱
        let currentGraphTab = 'task';
        function switchGraphTab(tab) {

            // 更新 tab 按钮样式
            document.querySelectorAll('.graph-tab-btn').forEach(function(btn) {

            });

                    initMemoryGraph();
                }
                // 如果有缓存数据则加载，否则向后端请求
                if (mgPendingFullData && mgSnapshotNodes(mgPendingFullData).length > 0 && !mgNeedsSnapshotRefresh) {

        // 图谱常量
        const SICO = { completed:'\u2705', in_progress:'\uD83D\uDD35', pending:'\u2B1C', blocked:'\uD83D\uDD34', skipped:'\u23ED\uFE0F', needs_adjust:'\u26A0\uFE0F' };
        const SZH  = { completed:'已完成', in_progress:'进行中', pending:'未开始', blocked:'阻塞', skipped:'已跳过', needs_adjust:'需调整' };
        const TCOLOR = { requirement:'#8b5cf6', analysis:'#6366f1', outline:'#3b82f6', task:'#06b6d4', subtask:'#10b981', summary:'#f59e0b' };
        const SCOLOR = { completed:'#22c55e', in_progress:'#3b82f6', pending:'#cbd5e1', blocked:'#ef4444', skipped:'#a78bfa', needs_adjust:'#f59e0b' };
        const STBG   = { completed:'#dcfce7', in_progress:'#dbeafe', pending:'#f1f5f9', blocked:'#fee2e2', skipped:'#ede9fe', needs_adjust:'#fef3c7' };
        const STFG   = { completed:'#15803d', in_progress:'#1d4ed8', pending:'#64748b', blocked:'#dc2626', skipped:'#7c3aed', needs_adjust:'#d97706' };

// Cytoscape.js 实例管理
        var _cyInstance = null;  // 当前图谱实例
        var _cyFoldState = new Map();  // 折叠状态
        var _lastGraphTap = { nodeId: null, at: 0 };
        
        // 获取或初始化Cytoscape实例
        function getCytoscapeInstance() {
            if (!_cyInstance) {
                const container = document.getElementById('graphSvgArea');
                if (!container) {
                    console.error('[Cytoscape] Container #graphSvgArea not found');
                    return null;
                }
                
                // 清空容器内的SVG元素（Cytoscape需要干净容器）
                container.innerHTML = '';
                
                // 检查容器尺寸
                const rect = container.getBoundingClientRect();
                console.log('[Cytoscape] Container size:', rect.width, 'x', rect.height);
                
                _cyInstance = cytoscape({
                    container: container,
                    
                    // 交互配置
                    minZoom: 0.03,
                    maxZoom: 3,
                    
                    // 元素样式
                    style: getCytoscapeStyles(),
                    
                    // 交互模式
                    userZoomingEnabled: true,
                    userPanningEnabled: true,
                    boxSelectionEnabled: true,
                    autoungrabify: true,
                    autounselectify: false
                });
                
                // 绑定事件
                setupCytoscapeEvents(_cyInstance);
            }
            return _cyInstance;
        }

        function refreshTaskGraphViewport() {
            setTimeout(function() {
                if (_cyInstance) {
                    fitTaskGraphViewport(20);
                } else if (activeGraphId) {
                    renderGraphById(activeGraphId);
                }
            }, 80);
        }

        function fitTaskGraphViewport(padding) {
            if (!_cyInstance) return;
            const container = document.getElementById('graphSvgArea');
            if (!container) return;
            if (container.querySelector('.tg-single-node-wrap')) return;
            const rect = container.getBoundingClientRect();
            if (rect.width <= 0 || rect.height <= 0) return;

            _cyInstance.resize();
            const nodes = _cyInstance.nodes();
            if (!nodes.length) return;
            if (typeof _cyInstance.minZoom === 'function') {
                _cyInstance.minZoom(nodes.length > 80 ? 0.02 : 0.03);
            }

            if (nodes.length === 1) {
                nodes[0].position({ x: rect.width / 2, y: rect.height / 2 });
                _cyInstance.zoom(1);
                _cyInstance.pan({ x: 0, y: 0 });
                return;
            }
            _cyInstance.fit(undefined, padding || 20);
        }

        function destroyTaskGraphCanvas() {
            if (_cyInstance) {
                try { _cyInstance.destroy(); } catch (e) {}
                _cyInstance = null;
            }
        }

        function renderSingleTaskGraphNode(node, G_D_EDGES) {
            const container = document.getElementById('graphSvgArea');
            if (!container || !node) return;
            destroyTaskGraphCanvas();
            const fullLabel = cleanDisplayText(node.label || node.fullLabel || '');
            const gnodeMapSingle = {};
            gnodeMapSingle[node.id] = Object.assign({}, node, { fullLabel: fullLabel });
            const statusLabel = SZH[node.status] || node.status || '进行中';
            container.innerHTML =
                '<div class="tg-single-node-wrap">' +

        // 绑定Cytoscape事件
        function setupCytoscapeEvents(cy) {
            // 节点点击
            cy.on('tap', 'node', function(evt) {
                const node = evt.target;
                const nodeId = node.id();
                
                // 排除折叠占位节点
                if (nodeId === '__folded__') return;

                updateNodeDetailPanel(nodeId, nodeData);

                const now = Date.now();
                if (_lastGraphTap.nodeId === nodeId && now - _lastGraphTap.at < 360 && (nodeData.childCount || 0) > 0) {
                    _lastGraphTap = { nodeId: null, at: 0 };
                    toggleNodeFold(nodeId);
                    return;
                }
                _lastGraphTap = { nodeId: nodeId, at: now };
            });

            cy.on('dbltap', 'node', function(evt) {
                const nodeId = evt.target.id();
                const nodeData = evt.target.data();
                if (nodeId !== '__folded__' && (nodeData.childCount || 0) > 0) {
                    toggleNodeFold(nodeId);
                }
            });
            
            // 节点右键
            cy.on('cxttap', 'node', function(evt) {
                const node = evt.target;
                const nodeId = node.id();
                const nodeData = node.data();
                
                // 显示右键菜单
                evt.originalEvent.preventDefault();
                showGraphContextMenu(
                    evt.originalEvent.clientX,
                    evt.originalEvent.clientY,
                    nodeId,
                    nodeData.fullLabel || nodeData.label,
                    nodeData.address
                );
            });
            
            // 边点击
            cy.on('tap', 'edge', function(evt) {
                const edge = evt.target;
                console.log('[Cytoscape] Edge selected:', edge.id());
            });
        }

                const gnodeMap = {};

                cy.nodes().forEach(n => {
                    gnodeMap[n.id()] = n.data();
                });

        function gEsc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

        function jsStringAttr(value) {
            return escapeAttr(JSON.stringify(String(value || '')));
        }

        function getGraphNodeFullLabel(n) {
            if (!n) return '';
            return n.fullLabel || n.label || '';
        }

        function formatGraphNodeLabel(label) {
            label = cleanDisplayText(label || '').trim();
            if (!label) return '';
            var parts = [];
            var colonParts = label.split(/[:：]/);
            if (colonParts.length > 1) {
                parts.push(colonParts[0]);
                label = colonParts.slice(1).join('：').trim();
            }
            var maxChars = 11;
            while (label.length > 0 && parts.length < 3) {
                parts.push(label.slice(0, maxChars));
                label = label.slice(maxChars);
            }
            if (label.length > 0 && parts.length > 0) {
                parts[parts.length - 1] = parts[parts.length - 1].replace(/.{1}$/, '…');
            }
            return parts.join('\n');
        }

        // 缓存 window 级事件处理器引用，切换图谱时清理旧的
        var _graphWindowHandlers = { mousemove: null, mouseup: null, wheelHandler: null };

        // 通用图谱渲染函数
        // 大图谱保护：超过此阈值启用折叠渲染
        var _GRAPH_FULL_RENDER_LIMIT = 300;

        // 节点折叠状态管理（全局）
        if (!window._nodeFoldState) {
            window._nodeFoldState = {
                expanded: new Map(),
                init: function(nodes, hEdges) {
                    const self = this;
                    nodes.forEach(function(n) {
                        if (!self.expanded.has(n.id)) {
                            self.expanded.set(n.id, true);
                        }
                    });
                },
                toggle: function(nodeId) {
                    const current = this.expanded.get(nodeId);
                    this.expanded.set(nodeId, !current);
                    return !current;
                },
                isExpanded: function(nodeId) {
                    return this.expanded.get(nodeId) !== false;
                }
            };
        }
        
        // 获取所有子节点（递归）
        function getAllDescendants(nodeId, hEdges, maxDepth) {
            const descendants = [];
            const visited = new Set();
            const queue = [{id: nodeId, depth: 0}];
            
            while (queue.length > 0) {
                const current = queue.shift();
                if (current.depth >= (maxDepth || 100)) continue;
                
                hEdges.forEach(function(e) {
                    if (e[0] === current.id && !visited.has(e[1])) {
                        visited.add(e[1]);
                        descendants.push(e[1]);
                        queue.push({id: e[1], depth: current.depth + 1});
                    }
                });
            }
            
            return descendants;
        }

        function buildGraphChildCountMap(hEdges) {
            const childCounts = {};
            (hEdges || []).forEach(function(e) {
                if (!e || e.length < 2) return;
                childCounts[e[0]] = (childCounts[e[0]] || 0) + 1;
            });
            return childCounts;
        }
        
        // 切换节点折叠状态
        function toggleNodeFold(nodeId) {
            const graphs = getSessionGraphs();
            const graph = graphs.find(function(g) { return g.id === activeGraphId; });
            if (!graph) return;
            
            // 切换折叠状态
            const currentState = _cyFoldState.get(nodeId) !== false;
            _cyFoldState.set(nodeId, !currentState);
            
            console.log('[Fold] Node', nodeId, '->', !currentState ? 'expanded' : 'collapsed');
            
            // 重新渲染（保持缩放）
            renderGraphData(graph.nodes, graph.hEdges, graph.dEdges, true);
        }
        
        function renderGraphData(G_NODES, G_H_EDGES, G_D_EDGES, skipAutoFit) {
            skipAutoFit = skipAutoFit || false;
            var normalizedGraph = normalizeTaskGraphForDisplay(G_NODES, G_H_EDGES, G_D_EDGES);
            G_NODES = normalizedGraph.nodes;
            G_H_EDGES = normalizedGraph.hEdges;
            G_D_EDGES = normalizedGraph.dEdges;
            
            if (!G_NODES || G_NODES.length === 0) {
                const cy = getCytoscapeInstance();
                cy.elements().remove();
                return;
            }
            if (G_NODES.length === 1) {
                renderSingleTaskGraphNode(G_NODES[0], G_D_EDGES || []);
                updateGraphProgress(G_NODES);
                return;
            }
            
            console.log('[Cytoscape] Rendering', G_NODES.length, 'nodes');
            const startTime = performance.now();
            const childCountByNode = buildGraphChildCountMap(G_H_EDGES);
            
            // 初始化折叠状态
            G_NODES.forEach(function(n) {
                if (!_cyFoldState.has(n.id)) {
                    const hasChildren = (childCountByNode[n.id] || 0) > 0;
                    _cyFoldState.set(n.id, isCodeGraphNode(n) && hasChildren ? false : true);
                }
            });
            
            // 过滤可见节点（考虑折叠状态）
            var visibleNodeIds = new Set();
            var queue = [];
            
            // 找到根节点
            G_NODES.forEach(function(n) {
                const hasParent = G_H_EDGES.some(function(e) { return e[1] === n.id; });
                if (!hasParent) {
                    visibleNodeIds.add(n.id);
                    queue.push(n.id);
                }
            });
            
            // BFS遍历
            while (queue.length > 0) {
                const parentId = queue.shift();
                const isExpanded = _cyFoldState.get(parentId) !== false;
                
                if (isExpanded) {
                    G_H_EDGES.forEach(function(e) {
                        if (e[0] === parentId && !visibleNodeIds.has(e[1])) {
                            visibleNodeIds.add(e[1]);
                            queue.push(e[1]);
                        }
                    });
                }
            }
            
            // 构造Cytoscape元素
            const elements = [];
            
            // 添加节点
            G_NODES.forEach(function(n) {
                if (!visibleNodeIds.has(n.id)) return;
                
                const fullLabel = cleanDisplayText(n.label || '');
                const childCount = childCountByNode[n.id] || 0;
                const descendantCount = childCount ? getAllDescendants(n.id, G_H_EDGES).length : 0;
                const isFolded = childCount > 0 && _cyFoldState.get(n.id) === false;
                let displayLabel = formatGraphNodeLabel(fullLabel);
                if (isFolded) {
                    displayLabel += '\n+' + descendantCount + ' 节点';
                }
                
                elements.push({
                    group: 'nodes',
                    data: {
                        id: n.id,
                        label: displayLabel,
                        fullLabel: fullLabel,
                        type: n.type || 'task',
                        status: n.status || 'pending',
                        desc: n.desc || '',
                        result: n.result || '',
                        metadata: n.metadata || {},
                        files: n.files || [],
                        address: n.address || '',
                        codeGraph: isCodeGraphNode(n) ? 'true' : 'false',
                        childCount: childCount,
                        descendantCount: descendantCount,
                        folded: isFolded ? 'true' : 'false'
                    }
                });
            });
            
            // 添加层级边
            G_H_EDGES.forEach(function(e) {
                if (visibleNodeIds.has(e[0]) && visibleNodeIds.has(e[1])) {
                    elements.push({
                        group: 'edges',
                        data: {
                            id: 'h_' + e[0] + '_' + e[1],
                            source: e[0],
                            target: e[1],
                            edgeType: 'hierarchy'
                        }
                    });
                }
            });
            
            // 添加依赖边
            if (G_D_EDGES) {
                G_D_EDGES.forEach(function(e) {
                    if (visibleNodeIds.has(e.s) && visibleNodeIds.has(e.t)) {
                        const srcNode = G_NODES.find(n => n.id === e.s);
                        const satisfied = srcNode && (srcNode.status === 'completed' || srcNode.status === 'skipped');
                        
                        elements.push({
                            group: 'edges',
                            data: {
                                id: 'd_' + e.s + '_' + e.t,
                                source: e.s,
                                target: e.t,
                                edgeType: 'dependency',
                                via: e.via || '',
                                satisfied: satisfied ? 'true' : 'false'
                            }
                        });
                    }
                });
            }
            
            // 获取Cytoscape实例并渲染
            const cy = getCytoscapeInstance();
            if (!cy) {
                console.error('[Cytoscape] Failed to get instance');
                return;
            }
            
            console.log('[Cytoscape] Elements to render:', elements.length, 'items');
            
            // 清空并添加新元素
            cy.elements().remove();
            cy.add(elements);

            const renderedNodeCount = cy.nodes().length;
            if (renderedNodeCount === 1) {
                fitTaskGraphViewport(20);
            } else {
                // 执行布局
                cy.layout({
                    name: 'dagre',
                    rankDir: 'TB',
                    nodeSep: 60,
                    rankSep: 80,
                    padding: 60,
                    animate: false,
                    fit: false
                }).run();
            }
            
            // 首次加载时自适应视图
            if (!skipAutoFit && renderedNodeCount !== 1) {
                setTimeout(function() {
                    fitTaskGraphViewport(20);
                }, 100);
            }
            
            const renderTime = performance.now() - startTime;
            console.log('[Cytoscape] Render completed in', renderTime.toFixed(2), 'ms');
            
            // 更新图谱节点完成数
            updateGraphProgress(G_NODES);

            if (!cy.$('node:selected').length && elements.length > 0) {
                const firstNode = cy.nodes().first();
                if (firstNode && firstNode.length) {
                    firstNode.select();
                    updateNodeDetailPanel(firstNode.id(), firstNode.data());
                }
            }
        }
        
        // 更新图谱节点完成数
        function updateGraphProgress(nodes) {
            const taskNodes = getTaskProgressNodes(nodes || []);
            const total = taskNodes.length;
            const done = countDoneTaskNodes(taskNodes);
            const codeCount = (nodes || []).length - taskNodes.length;

            if (gpPfill) gpPfill.style.width = (total > 0 ? (done/total*100).toFixed(0) : '0') + '%';
        }

        // 图谱选中/取消
        function graphDeselect(){
            document.querySelectorAll('.graph-panel .gnode').forEach(function(el){el.classList.remove('selected','dimmed');});
            document.querySelectorAll('.graph-panel .edge-hier').forEach(function(el){el.classList.remove('dimmed');});

        function onGraphSelect(id, gnodeMap, G_D_EDGES){
            var inD=G_D_EDGES.filter(function(e){return e.t===id;}), outD=G_D_EDGES.filter(function(e){return e.s===id;});
            var conn=new Set([id]); inD.forEach(function(e){conn.add(e.s);}); outD.forEach(function(e){conn.add(e.t);});
            document.querySelectorAll('.graph-panel .gnode').forEach(function(el){
                var nid=el.getAttribute('data-id');
                el.classList.toggle('selected',nid===id);
                el.classList.toggle('dimmed',!conn.has(nid));
            });
            document.querySelectorAll('.graph-panel .edge-hier').forEach(function(el){
                var s=el.getAttribute('data-s'),t=el.getAttribute('data-t');
                el.classList.toggle('dimmed',!conn.has(s)&&!conn.has(t));
            });
            document.querySelectorAll('.graph-panel .dep-group').forEach(function(el){
                var s=el.getAttribute('data-s'),t=el.getAttribute('data-t');
                var hit=s===id||t===id;
                el.classList.toggle('highlighted',hit);
                el.classList.toggle('dimmed',!hit);
            });
            renderGraphDetailView(id, gnodeMap, G_D_EDGES);
            renderGraphLLMView(id, gnodeMap, G_D_EDGES);
        }

        // 🔥 文件类型辅助函数（记忆图谱文件展示用）
        function isImageFile(path) {
            if (!path) return false;
            var ext = path.split('.').pop().toLowerCase();
            return ['png','jpg','jpeg','gif','bmp','webp','svg'].indexOf(ext) >= 0;
        }
        function getFileIcon(path) {
            if (isImageFile(path)) return '\u{1F5BC}\uFE0F';
            var ext = (path || '').split('.').pop().toLowerCase();
            if (['py','js','ts','html','css','json','md','txt','yaml','yml','toml','cfg','ini'].indexOf(ext) >= 0) return '\u{1F4C4}';
            return '\u{1F4CE}';
        }
        function getFileServeUrl(path) {
            return '/api/files/serve?path=' + encodeURIComponent(path);
        }

        // 🔥 打开文件到 IDE (通过 API 调用)
        function openFileInIDE(filePath) {
            console.log('[Web] 请求打开文件:', filePath);
            
            // 方案 1: 调用后端 API (如果 Web 服务器支持)
            fetch('/api/open-file', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({path: filePath})
            }).then(function(res) {
                if (res.ok) {
                    console.log('[Web] 文件已在 IDE 中打开');
                } else {
                    // 降级方案：直接在新窗口打开
                    window.open('file://' + filePath, '_blank');
                }
            }).catch(function(err) {
                console.warn('[Web] API 调用失败，尝试直接打开:', err);
                // 降级方案：直接在新窗口打开
                window.open('file://' + filePath, '_blank');
            });
        }

        function toggleDetailPanel() {
