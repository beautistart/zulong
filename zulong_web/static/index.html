            flex-shrink: 0;
        }
        .module-panel-header h3 {
            font-size: 14px;
            font-weight: 700;
            color: #e2e8f0;
            margin: 0;
        }
        .module-panel-header .mp-mode {
            font-size: 11px;
            color: #64748b;
            background: #334155;
            padding: 2px 8px;
            border-radius: 4px;
        }
        .module-panel-close {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 16px;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .module-panel-close:hover { color: #e2e8f0; background: #334155; }
        .module-panel-body {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }
        .module-card {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 4px;
            transition: background 0.15s;
        }
        .module-card:hover { background: #334155; }
        .module-card .mc-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .mc-indicator.running { background: #22c55e; box-shadow: 0 0 6px #22c55e; }
        .mc-indicator.starting { background: #f59e0b; animation: pulse 1s infinite; }
        .mc-indicator.stopped { background: #64748b; }
        .mc-indicator.error { background: #ef4444; box-shadow: 0 0 6px #ef4444; }
        .mc-indicator.unloaded { background: #475569; }
        .module-card .mc-info { flex: 1; min-width: 0; }
        .module-card .mc-name {
            font-size: 12px;
            font-weight: 600;
            color: #e2e8f0;
        }
        .module-card .mc-state {
            font-size: 10px;
            color: #64748b;
        }
        .module-card .mc-switch {
            position: relative;
            width: 36px;
            height: 20px;
            flex-shrink: 0;
        }
        .module-card .mc-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .module-card .mc-switch .slider {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background: #475569;
            border-radius: 10px;
            transition: background 0.3s;
        }
        .module-card .mc-switch .slider::before {
            content: "";
            position: absolute;
            height: 14px;
            width: 14px;
            left: 3px;
            bottom: 3px;
            background: white;
            border-radius: 50%;
            transition: transform 0.3s;
        }
        .module-card .mc-switch input:checked + .slider {
            background: #22c55e;
        }
        .module-card .mc-switch input:checked + .slider::before {
            transform: translateX(16px);
        }
        .module-card .mc-switch input:disabled + .slider {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .module-section-title {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #64748b;
            padding: 8px 12px 4px;
        }

        /* === 设置面板 === */
        .settings-toggle-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            border-radius: 8px;
            padding: 5px 10px;
            color: white;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: background 0.3s;
        }
        .settings-toggle-btn:hover { background: rgba(255,255,255,0.35); }

        /* ── TSD v1.7 §23.4: 审批模式切换按钮 ── */
        .approval-mode-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            border-radius: 8px;
            padding: 5px 10px;
            color: white;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: background 0.3s;
        }
        .approval-mode-btn:hover { background: rgba(255,255,255,0.35); }
        .approval-mode-btn[data-mode="full_auto"] { background: rgba(34, 197, 94, 0.4); }
        .approval-mode-btn[data-mode="whitelist"] { background: rgba(59, 130, 246, 0.4); }
        .approval-mode-btn[data-mode="manual"] { background: rgba(245, 158, 11, 0.4); }
        .approval-mode-btn[data-mode="popup"] { background: rgba(239, 68, 68, 0.4); }

        .settings-panel {
            position: fixed;
            z-index: 10001;
            top: 80px;
            right: 20px;
            width: 360px;
            max-height: 75vh;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            display: none;
            flex-direction: column;
            overflow: hidden;
        }
        .settings-panel.visible { display: flex; }
        .settings-panel-header {
            padding: 12px 16px;
            background: #0f172a;
            border-bottom: 1px solid #334155;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }
        .settings-panel-header h3 {
            font-size: 14px;
            font-weight: 700;
            color: #e2e8f0;
            margin: 0;
        }
        .settings-panel-close {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 16px;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .settings-panel-close:hover { color: #e2e8f0; background: #334155; }
        .settings-panel-body {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        /* 层级卡片 */
        .layer-card {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            margin-bottom: 6px;
            overflow: hidden;
            transition: border-color 0.2s;
        }
        .layer-card:hover { border-color: #475569; }
        .layer-card-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 12px;
            cursor: pointer;
            user-select: none;
        }
        .layer-card-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .layer-card-indicator.running { background: #22c55e; box-shadow: 0 0 6px #22c55e; }
        .layer-card-indicator.stopped { background: #64748b; }
        .layer-card-indicator.unloaded { background: #475569; }
        .layer-card-indicator.error { background: #ef4444; box-shadow: 0 0 6px #ef4444; }
        .layer-card-title {
            font-size: 12px;
            font-weight: 600;
            color: #e2e8f0;
            flex: 1;
        }
        .layer-card-summary {
            font-size: 10px;
            color: #64748b;
            max-width: 140px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .layer-card-expand {
            font-size: 10px;
            color: #64748b;
            transition: transform 0.2s;
        }
        .layer-card.expanded .layer-card-expand { transform: rotate(180deg); }
        .layer-card-body {
            display: none;
            padding: 0 12px 10px;
            border-top: 1px solid #1e293b;
        }
        .layer-card.expanded .layer-card-body { display: block; }
        .layer-field {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
        }
        .layer-field label {
            color: #94a3b8;
            font-size: 11px;
            min-width: 40px;
            text-align: right;
        }
        .layer-field input,
        .layer-field select {
            flex: 1;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 5px;
            color: #e2e8f0;
            font-size: 11px;
            padding: 4px 8px;
        }
        .layer-field select option { background: #1e293b; color: #e2e8f0; }
        .layer-field input::placeholder { color: #475569; }
        .layer-card-actions {
            display: flex;
            justify-content: flex-end;
            gap: 6px;
            margin-top: 10px;
        }
        .layer-save-btn {
            background: #3b82f6;
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 11px;
            padding: 4px 12px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }
        .layer-save-btn:hover { background: #2563eb; }

        /* 上下文窗口控件 */
        .ctx-window-control {
            margin-top: 10px;
            padding: 8px 0;
            border-top: 1px solid #1e293b;
        }
        .ctx-window-label {
            color: #94a3b8;
            font-size: 11px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .ctx-window-value {
            color: #3b82f6;
            font-weight: 600;
            cursor: pointer;
            padding: 1px 6px;
            border-radius: 3px;
            transition: background 0.2s;
        }
        .ctx-window-value:hover {
            background: #1e293b;
        }
        .ctx-window-input {
            width: 80px;
            background: #1e293b;
            border: 1px solid #3b82f6;
            border-radius: 3px;
            color: #e2e8f0;
            font-size: 11px;
            padding: 2px 6px;
            text-align: right;
        }
        .ctx-window-slider {
            width: 100%;
            height: 4px;
            -webkit-appearance: none;
            appearance: none;
            background: #334155;
            border-radius: 2px;
            outline: none;
            margin: 6px 0;
        }
        .ctx-window-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #3b82f6;
            cursor: pointer;
            border: 2px solid #1e293b;
        }
        .ctx-window-slider::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #3b82f6;
            cursor: pointer;
            border: 2px solid #1e293b;
        }
        .ctx-window-presets {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 4px;
        }
        .ctx-preset-btn {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 3px;
            color: #94a3b8;
            font-size: 10px;
            padding: 2px 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .ctx-preset-btn:hover {
            border-color: #3b82f6;
            color: #e2e8f0;
        }
        .ctx-preset-btn.active {
            background: #1e3a5f;
            border-color: #3b82f6;
            color: #3b82f6;
        }

        /* 添加层按钮 */
        .settings-add-layer-btn {
            display: block;
            width: 100%;
            padding: 8px;
            margin-top: 4px;
            background: none;
            border: 1px dashed #475569;
            border-radius: 8px;
            color: #64748b;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .settings-add-layer-btn:hover { border-color: #3b82f6; color: #3b82f6; }

        /* header 按钮容器 */
        .header-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-left: auto;
        }

        /* 右键上下文菜单 */
        .context-menu {
            position: fixed;
            z-index: 99999;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.4);
            padding: 4px 0;
            min-width: 120px;
            display: none;
        }
        .context-menu.visible { display: block; }
        .context-menu-item {
            padding: 8px 14px;
            font-size: 12px;
            color: #e2e8f0;
            cursor: pointer;
            transition: background 0.15s;
        }
        .context-menu-item:hover { background: #334155; }
        .context-menu-item.danger { color: #f87171; }
        .context-menu-item.danger:hover { background: #450a0a; }
    </style>
</head>
<body>
    <div class="app-wrapper" id="appWrapper">
    <div class="chat-container">
        <div class="chat-header">
            <button class="dark-mode-toggle" id="darkModeToggle" onclick="toggleDarkMode()" title="暗夜模式">&#127769;</button>
            <span class="status-indicator disconnected" id="statusIndicator"></span>
            <span style="margin-left:4px;">祖龙</span>
            <div class="header-actions">
                <button class="ide-action-btn" id="openWorkspaceBtn" onclick="openCurrentWorkspace()" title="打开 VS Code 工作区">打开 VS Code</button>
                <button class="ide-action-btn" id="openFileBtn" onclick="openCurrentFile()" title="查看当前文件">当前文件</button>
                <button class="ide-action-btn" id="openTerminalBtn" onclick="openIdeTerminal()" title="查看终端">终端</button>
                <button class="settings-toggle-btn" id="settingsToggleBtn" onclick="toggleSettingsPanel()" title="模型设置">设置</button>
                <button class="module-toggle-btn" id="moduleToggleBtn" onclick="toggleModulePanel()" title="模块管理">模块</button>
                <button class="graph-toggle-btn" id="graphToggleBtn" onclick="toggleTaskGraph()" title="任务图谱">图谱</button>
                <button class="approval-mode-btn" id="approvalModeBtn" onclick="toggleApprovalMode()" title="审批模式: 手动 (点击切换)">审批</button>
                <div class="connection-status" id="connectionStatus">连接中...</div>
            </div>
        </div>
        <div class="task-status-strip" id="taskStatusStrip" aria-live="polite">
            <span class="task-status-dot"></span>
            <span class="task-status-label" id="taskStatusLabel">空闲</span>
            <span class="task-status-message" id="taskStatusMessage">当前没有正在执行的任务。</span>
        </div>
        
        <div class="session-list">
            <div class="session-list-header">
                <span>会话列表</span>
                <button class="new-session-btn" onclick="createNewSession()">+ 新会话</button>
            </div>
            <div class="session-items" id="sessionItems">
                <!-- 会话列表项将动态渲染 -->
            </div>
        </div>
        
        <div class="chat-messages" id="chatMessages">
            <!-- 消息将动态添加到这里 -->
        </div>
        
        <div class="chat-input-container">
            <button class="voice-input-btn" id="voiceInputBtn" title="语音输入">🎤</button>
            <textarea
                class="chat-input" 
                id="chatInput" 
                placeholder="输入消息..."
                autocomplete="off"
                spellcheck="false"
                enterkeyhint="send"
                aria-label="输入消息"
                data-testid="chat-input"
                rows="1"
            ></textarea>
            <button class="send-button" id="sendButton" type="button" data-testid="send-button">发送</button>
        </div>
    </div><!-- chat-container end -->

    <!-- ===== 拖拽分隔条 + 图谱面板折叠按钮 ===== -->
    <div class="resize-handle" id="resizeHandle">
        <button class="graph-collapse-btn" id="graphCollapseBtn" onclick="toggleTaskGraph()" title="收起图谱面板">◀</button>
    </div>

    <!-- ===== 图谱面板（Tab 切换：记忆图谱 / 任务图谱） ===== -->
    <div class="graph-panel" id="graphPanel">
        <div class="graph-header">
            <div class="graph-tabs">
                <button class="graph-tab-btn active" data-view="task" onclick="switchGraphTab('task')">任务图谱</button>
                <button class="graph-tab-btn" data-view="memory" onclick="switchGraphTab('memory')">记忆图谱</button>
            </div>
            <div class="graph-progress" id="graphProgressBar">
                <span id="gp-ptext">0/0</span>
                <div class="graph-progress-bar"><div class="graph-progress-fill" id="gp-pfill" style="width:0%"></div></div>
            </div>
            <div class="mg-stats" id="mgStats" style="display:none;">0 节点 | 0 边</div>
            <button class="tv-reopen-btn" id="tvReopenBtn" onclick="toggleTvVisible(true)" title="打开思维视图">思维</button>
            <button class="graph-close-btn" onclick="toggleTaskGraph()">收起 ✕</button>
        </div>

        <!-- 任务图谱视图 -->
        <div class="graph-view-task" id="graphViewTask">
            <div class="graph-list" id="graphList">
                <div class="graph-list-header">
                    <span>图谱列表</span>
                    <button class="graph-list-toggle" id="graphListToggle" onclick="toggleGraphList()">▼</button>
                </div>
                <div class="graph-items" id="graphItems">
                    <!-- 图谱列表项将动态渲染 -->
                </div>
            </div>
            <div class="graph-body">
                <div class="graph-svg-area" id="graphSvgArea"><svg id="graphSvg"></svg></div>
                <div class="graph-detail-panel" id="graphDetailPanel">
                    <button class="detail-toggle-btn" id="detailToggleBtn" onclick="toggleDetailPanel()" title="收起/展开详情">◀</button>
                    <div class="gp-tabs">
                        <button class="gp-tab active" data-gptab="gp-detail">节点详情</button>
                        <button class="gp-tab" data-gptab="gp-llm">LLM 聚焦</button>
                        <button class="gp-tab" data-gptab="gp-full">全景文本</button>
                        <button class="gp-collapse-btn" onclick="toggleDetailPanel()" title="收起详情面板">&#10095;</button>
                    </div>
                    <div class="gp-tab-body" id="gp-detail">
                        <div class="gp-placeholder">点击图谱中的任意节点<br>查看详情和依赖关系</div>
                    </div>
                    <div class="gp-tab-body hidden" id="gp-llm">
                        <div class="gp-placeholder">点击节点后<br>此处生成模型聚焦上下文</div>
                    </div>
                    <div class="gp-tab-body hidden" id="gp-full">
                        <h3>全景图谱文本</h3>
                        <div class="gp-llm-box" id="gp-fullText"></div>
                    </div>
                </div>
            </div>
            <div class="graph-legend">
                <div class="gl-item"><div class="gl-line" style="border-color:#cbd5e1"></div> 层级</div>
                <div class="gl-item"><div class="gl-dash" style="border-color:#ef4444"></div> 依赖(待)</div>
                <div class="gl-item"><div class="gl-dash" style="border-color:#22c55e"></div> 依赖(通)</div>
                <span style="color:#e2e8f0;margin:0 2px">|</span>
                <div class="gl-item"><div class="gl-dot" style="background:#22c55e"></div> 已完成</div>
                <div class="gl-item"><div class="gl-dot" style="background:#3b82f6"></div> 进行中</div>
                <div class="gl-item"><div class="gl-dot" style="background:#cbd5e1"></div> 未开始</div>
                <div class="gl-item"><div class="gl-dot" style="background:#ef4444"></div> 阻塞</div>
                <div class="gl-item"><div class="gl-dot" style="background:#a78bfa"></div> 已跳过</div>
                <div class="gl-item"><div class="gl-dot" style="background:#f59e0b"></div> 需调整</div>
            </div>
        </div>

        <!-- 记忆图谱视图 -->
        <div class="graph-view-memory" id="graphViewMemory">
            <div class="mg-toolbar">
                <button class="mg-tool-btn" onclick="fitMemoryGraphViewport(48, true, true)" title="适配所有已载入的记忆节点">适配</button>
                <button class="mg-tool-btn" onclick="resetMemoryGraphZoom()" title="恢复 100% 缩放">100%</button>
                <div class="mg-toolbar-spacer"></div>
                <span class="mg-zoom-readout" id="mgZoomText">100%</span>
            </div>
            <div class="mg-content-row">
                <div class="mg-body">
                    <svg id="memoryGraphSvg"></svg>
                </div>
                <div class="mg-detail-panel" id="mgDetailPanel">
                    <div class="mg-detail-header">
                        <h3 id="mgDetailTitle">节点详情</h3>
                        <button class="mg-detail-close" onclick="closeMgDetail()">&times;</button>
                    </div>
                    <div class="mg-detail-body" id="mgDetailBody">
                        <div class="mg-detail-placeholder">点击图谱中的任意节点<br>查看完整对话内容和详情</div>
                    </div>
                </div>
            </div>
            <div class="mg-legend" id="mgLegend">
                <div class="mg-leg"><span class="mg-dot" style="background:#8b5cf6"></span>对话</div>
                <div class="mg-leg"><span class="mg-dot" style="background:#3b82f6"></span>任务</div>
                <div class="mg-leg"><span class="mg-dot" style="background:#22c55e"></span>知识</div>
                <div class="mg-leg"><span class="mg-dot" style="background:#f59e0b"></span>经验</div>
                <div class="mg-leg"><span class="mg-dot" style="background:#06b6d4"></span>片段</div>
                <div class="mg-leg"><span class="mg-dot" style="background:#ec4899"></span>概念</div>
                <div class="mg-leg"><span class="mg-dot" style="background:#ef4444"></span>人物</div>
                <div class="mg-leg"><span class="mg-dot" style="background:#64748b"></span>文件</div>
            </div>
        </div>

    </div><!-- graph-panel end -->

    <!-- 图谱节点右键菜单 -->
    <div id="graphContextMenu" class="graph-context-menu" style="display:none;">
        <div class="gcm-item" data-action="reference">引用到聊天</div>
        <div class="gcm-item" data-action="detail">查看详情</div>
    </div>

    </div><!-- app-wrapper end -->

    <!-- ===== 思维可视化浮动窗口 ===== -->
    <div class="thought-view-window" id="thoughtViewWindow">
        <div class="tv-header" id="tvHeader">
            <span class="tv-title">思维视图</span>
            <span class="tv-node-count" id="tvNodeCount">(0)</span>
            <button class="tv-btn" onclick="toggleTvMinimize()" title="最小化">&#x2500;</button>
            <button class="tv-btn" onclick="toggleTvVisible(false)" title="关闭">&#x2715;</button>
        </div>
        <div class="tv-body" id="tvBody">
            <svg id="thoughtViewSvg"></svg>
            <div class="tv-empty-hint" id="tvEmptyHint">暂无活跃思维节点</div>
        </div>
        <div class="tv-resize-handle" id="tvResizeHandle"></div>
    </div>

    <!-- ===== 模块管理浮动面板 ===== -->
    <div class="module-panel" id="modulePanel">
        <div class="module-panel-header">
            <h3>模块管理</h3>
            <span class="mp-mode" id="mpMode">--</span>
            <button class="module-panel-close" onclick="toggleModulePanel()">&times;</button>
        </div>
        <div class="module-panel-body" id="modulePanelBody">
            <div style="color:#64748b;font-size:12px;text-align:center;padding:30px;">加载中...</div>
        </div>
    </div>

    <!-- 设置面板 -->
    <div class="settings-panel" id="settingsPanel">
        <div class="settings-panel-header">
            <h3>模型设置</h3>
            <button class="settings-panel-close" onclick="toggleSettingsPanel()">&times;</button>
        </div>
        <div class="settings-panel-body" id="settingsPanelBody">
            <div style="color:#64748b;font-size:12px;text-align:center;padding:30px;">加载中...</div>
        </div>
    </div>

    <!-- 右键上下文菜单（会话列表） -->
    <div class="context-menu" id="contextMenu">
        <div class="context-menu-item" data-action="rename">重命名</div>
        <div class="context-menu-item danger" data-action="delete">删除</div>
    </div>

    <!-- 右键上下文菜单（聊天消息） -->
    <div class="context-menu" id="msgContextMenu">
        <div class="context-menu-item danger" data-action="delete-msg">删除此消息</div>
        <div class="context-menu-item danger" data-action="delete-below">删除此消息及以下</div>
    </div>
    
    <script>
        // WebSocket 连接
        let ws = null;
        const reconnectDelay = 3000; // 3 秒后重连
        
        // DOM 元素
        const chatMessages = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');
        const sendButton = document.getElementById('sendButton');
        const voiceInputBtn = document.getElementById('voiceInputBtn');
        const statusIndicator = document.getElementById('statusIndicator');
        const connectionStatus = document.getElementById('connectionStatus');
        const taskStatusStrip = document.getElementById('taskStatusStrip');
        const taskStatusLabel = document.getElementById('taskStatusLabel');
        const taskStatusMessage = document.getElementById('taskStatusMessage');
        let currentTaskExecutionStatus = { state: 'idle', phase: 'idle', awaiting_approval: false };
        let chatAutoScrollPaused = false;
        let chatAutoScrollStoppedAfterTerminal = false;
        let chatTerminalAutoScrollPending = false;
        let chatTerminalStopTimer = null;
        let chatProgrammaticScroll = false;
        const CHAT_BOTTOM_THRESHOLD = 72;

        function isChatNearBottom() {
            if (!chatMessages) return true;
            var remaining = chatMessages.scrollHeight - chatMessages.scrollTop - chatMessages.clientHeight;
            return remaining <= CHAT_BOTTOM_THRESHOLD;
        }

        function isTerminalTaskState(state) {
            return state === 'completed' || state === 'succeeded' || state === 'failed' ||
                state === 'blocked' || state === 'cancelled' || state === 'idle';
        }

        function resumeChatAutoScrollForNewTurn() {
            chatAutoScrollStoppedAfterTerminal = false;
            chatTerminalAutoScrollPending = false;
            if (chatTerminalStopTimer) {
                clearTimeout(chatTerminalStopTimer);
                chatTerminalStopTimer = null;
            }
            chatAutoScrollPaused = false;
        }

        function stopChatAutoScrollAfterTerminal() {
            chatAutoScrollStoppedAfterTerminal = true;
            chatTerminalAutoScrollPending = false;
            chatAutoScrollPaused = true;
            if (chatTerminalStopTimer) {
                clearTimeout(chatTerminalStopTimer);
                chatTerminalStopTimer = null;
            }
        }

        function scheduleChatAutoScrollTerminalStop() {
            chatTerminalAutoScrollPending = true;
            if (chatTerminalStopTimer) clearTimeout(chatTerminalStopTimer);
            chatTerminalStopTimer = setTimeout(function() {
                stopChatAutoScrollAfterTerminal();
            }, 6000);
        }

        function scrollChatToBottom(force, options) {
            options = options || {};
            if (!chatMessages) return;
            var allowTerminalFinal = options.allowTerminalFinal && chatTerminalAutoScrollPending;
            if (force) {
                if (!chatAutoScrollStoppedAfterTerminal) chatAutoScrollPaused = false;
                chatProgrammaticScroll = true;
                chatMessages.scrollTop = chatMessages.scrollHeight;
                requestAnimationFrame(function() { chatProgrammaticScroll = false; });
                return;
            }
            if (chatAutoScrollStoppedAfterTerminal && !allowTerminalFinal) return;
            if (chatTerminalAutoScrollPending && !allowTerminalFinal) return;
            if (chatAutoScrollPaused) return;
            chatProgrammaticScroll = true;
            chatMessages.scrollTop = chatMessages.scrollHeight;
            requestAnimationFrame(function() { chatProgrammaticScroll = false; });
        }

        chatMessages.addEventListener('scroll', function() {
            if (chatProgrammaticScroll) return;
            chatAutoScrollPaused = !isChatNearBottom();
        }, { passive: true });
        chatMessages.addEventListener('wheel', function() {
            if (!isChatNearBottom()) chatAutoScrollPaused = true;
        }, { passive: true });
        chatMessages.addEventListener('touchstart', function() {
            if (!isChatNearBottom()) chatAutoScrollPaused = true;
        }, { passive: true });
        document.addEventListener('visibilitychange', function() {
            if (!document.hidden && !chatAutoScrollStoppedAfterTerminal && isChatNearBottom()) {
                chatAutoScrollPaused = false;
            }
        });

        // ── TSD v1.7 §23.4: 审批模式 (Web 端全局设置) ──
        var approvalMode = 'manual';  // full_auto | whitelist | manual | popup
        var approvalModeLabels = {
            full_auto: '完全自动',
            whitelist: '白名单',
            manual: '手动审批',
            popup: '弹窗审批'
        };

        function toggleApprovalMode() {
            var modes = ['full_auto', 'whitelist', 'manual', 'popup'];
            var idx = modes.indexOf(approvalMode);
            approvalMode = modes[(idx + 1) % modes.length];
            var btn = document.getElementById('approvalModeBtn');
            if (btn) {
                btn.setAttribute('data-mode', approvalMode);
                btn.title = '审批模式: ' + approvalModeLabels[approvalMode] + ' (点击切换)';
                btn.textContent = '审批:' + approvalModeLabels[approvalMode].charAt(0);
            }
            // 发送到后端
            if (ws && ws.readyState === WebSocket.OPEN) {
                sendWsMessage({
                    type: 'settings_update',
                    payload: { approval_mode: approvalMode }
                });
            }
        }

        function getCurrentApprovalMode() {
            return approvalMode;
        }

        // ===== 语音录音功能 =====
        let isRecording = false;

        voiceInputBtn.addEventListener('click', async function() {
            if (isRecording) {
                // 停止录音
                isRecording = false;
                voiceInputBtn.classList.remove('recording');
                voiceInputBtn.textContent = '🎤';
                console.log('[Voice] 停止录音');

                // 发送 audio_end
                if (ws && ws.readyState === WebSocket.OPEN) {
                    sendWsMessage({
                        type: 'audio_end',
                        session_id: currentSessionId,
                        conversation_id: currentSessionId
                    });
                }
            } else {
                // 发送 audio_start
                if (ws && ws.readyState === WebSocket.OPEN) {
                    sendWsMessage({
                        type: 'audio_start',
                        session_id: currentSessionId,
                        conversation_id: currentSessionId
                    });
                    
                    isRecording = true;
                    voiceInputBtn.classList.add('recording');
                    voiceInputBtn.textContent = '⏹';
                    console.log('[Voice] 开始录音（后端采集）');
                } else {
                    console.error('[Voice] WebSocket 未连接');
                    alert('WebSocket 未连接，无法录音');
                }
            }
        });
        
        // ===== 多会话管理 =====
        const STORAGE_KEY = 'zulong_sessions';
        const SESSION_CACHE_MAX_MESSAGES = 40;
        const SESSION_CACHE_MAX_TEXT_CHARS = 4000;
        const SESSION_CACHE_MAX_PAYLOAD_CHARS = 3000;
        let currentSessionId = null;
        let ideContext = {
            workspace_path: '',
            active_file: '',
            active_selection: null
        };

        function normalizeWorkspacePath(path) {
            return (path || '').toString().trim();
        }

        function getActiveTaskGraph() {
            var graphs = getSessionGraphs();
            var graph = null;
            if (activeGraphId) {
                graph = graphs.find(function(g) { return g.id === activeGraphId; }) || null;
            }
            if (!graph && graphs.length) graph = graphs[0];
            return graph;
        }

        function getActiveTaskWorkspace() {
            var graph = getActiveTaskGraph();
            if (graph) {
                return normalizeWorkspacePath(
                    graph.workspace_dir ||
                    graph.workspace_path ||
                    graph.workspaceDir ||
                    graph.workspacePath ||
                    ''
                );
            }
            return '';
        }

        function setActiveTaskWorkspace(workspacePath) {
            var normalized = normalizeWorkspacePath(workspacePath);
            if (!normalized || !currentSessionId) return false;
            var graphs = getSessionGraphs();
            if (!graphs.length) return false;
            var graph = null;
            if (activeGraphId) {
                graph = graphs.find(function(g) { return g.id === activeGraphId; }) || null;
            }
            if (!graph) graph = graphs[0];
            graph.workspace_dir = normalized;
            graph.workspace_path = normalized;
            ideContext.workspace_path = normalized;
            saveSessionGraphs(graphs);
            renderGraphList();
            if (activeGraphId === graph.id) renderGraphById(activeGraphId);
            return true;
        }

        function getActiveTaskGraphBackendId() {
            var graph = getActiveTaskGraph();
            return graph ? (graph.backendId || graph.id || '') : '';
        }

        function getActiveTaskGraphFilePath() {
            var graph = getActiveTaskGraph();
            if (!graph) return '';
            var meta = graph.metadata || {};
            return normalizeWorkspacePath(
                graph.task_graph_file_path ||
                graph.graph_file_path ||
                meta.task_graph_file_path ||
                meta.graph_file_path ||
                ''
            );
        }

        function getCurrentTaskGraphWorkspace() {
            return getActiveTaskWorkspace();
        }

        function normalizeFsPathForCompare(path) {
            return normalizeWorkspacePath(path)
                .replace(/[\\\/]+/g, '/')
                .replace(/\/+$/g, '')
                .toLowerCase();
        }

        function isPathInsideWorkspace(path, workspacePath) {
            var p = normalizeFsPathForCompare(path);
            var w = normalizeFsPathForCompare(workspacePath);
            return !!p && !!w && (p === w || p.indexOf(w + '/') === 0);
        }

        function getActiveTaskFile(workspacePath) {
            var graph = getActiveTaskGraph();
            if (graph && ideContext.active_file && isPathInsideWorkspace(ideContext.active_file, workspacePath)) {
                return ideContext.active_file;
            }
            if (!graph || !graph.nodes || !graph.nodes.length) return '';
            var preferredStatuses = { in_progress: 0, running: 0, active: 0, editing: 0 };
            var fallback = '';
            for (var i = 0; i < graph.nodes.length; i++) {
                var node = graph.nodes[i] || {};
                var files = node.files || [];
                for (var j = 0; j < files.length; j++) {
                    var path = files[j] && files[j].path ? files[j].path : '';
                    if (!path || !isPathInsideWorkspace(path, workspacePath)) continue;
                    if (Object.prototype.hasOwnProperty.call(preferredStatuses, String(node.status || '').toLowerCase())) {
                        return path;
                    }
                    if (!fallback) fallback = path;
                }
            }
            return fallback;
        }
        
        // 思考过程面板管理
        let currentRequestId = null;
        const thinkingPanelMap = {};
        const pendingThinkingSteps = {};
        const recentAssistantFinals = {};
        let responseWatchdogTimer = null;
        const RESPONSE_WATCHDOG_MS = 120000;
        const persistedMessageIds = {};
        let lastSendFingerprint = null;
        let lastSendAt = 0;
        let _messagesReloadNeeded = false;  // 页面刷新后 WS 重连时需要重新加载消息
        
        // 生成唯一 ID
        function generateId() {
            if (crypto && crypto.randomUUID) {
                return crypto.randomUUID();
            }
            return 'id-' + Date.now() + '-' + Math.random().toString(36).substr(2, 9);
        }
        
        // 读取全部会话数据
        function loadSessionStore() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    parsed.sessions = (parsed.sessions || []).map(function(s) {
                        s.messages = s.messages || [];
                        return s;
                    });
                    return parsed;
                }
            } catch (e) {
                console.error('[Session] 加载失败:', e);
            }
            return { activeSessionId: null, sessions: [] };
        }
        
        // 写入全部会话数据
        function saveSessionStore(store) {
            try {
                var compact = compactSessionStore(store, false);
                localStorage.setItem(STORAGE_KEY, JSON.stringify(compact));
            } catch (e) {
                try {
                    var fallback = compactSessionStore(store, true);
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(fallback));
                    console.warn('[Session] 本地缓存过大，已降级为轻量会话壳:', e);
                } catch (e2) {
                    console.error('[Session] 保存失败:', e2);
                }
            }
        }

        function truncateSessionCacheText(value, limit) {
            var text = String(value || '');
            if (text.length <= limit) return text;
            return text.slice(0, limit) + '\n...[本地缓存截断，完整历史以后端记录为准]';
        }

        function compactSessionMessage(msg, summaryOnly) {
            msg = msg || {};
            var compact = {
                id: msg.id || generateId(),
                text: summaryOnly ? '' : truncateSessionCacheText(msg.text || '', SESSION_CACHE_MAX_TEXT_CHARS),
                sender: msg.sender || 'assistant',
                timestamp: msg.timestamp || Date.now(),
                request_id: msg.request_id || '',
                event_type: msg.event_type || ''
            };
            if (msg.card_type) compact.card_type = msg.card_type;
            if (msg.pair_id) compact.pair_id = msg.pair_id;
            if (!summaryOnly && msg.interaction) {
                compact.interaction = msg.interaction;
            }
            if (!summaryOnly && msg.payload) {
                try {
                    var payloadText = JSON.stringify(msg.payload);
                    if (payloadText.length <= SESSION_CACHE_MAX_PAYLOAD_CHARS) {
                        compact.payload = msg.payload;
                    }
                } catch (e) {}
            }
            return compact;
        }

        function compactSessionStore(store, summaryOnly) {
            var input = store || { activeSessionId: null, sessions: [] };
            return {
                activeSessionId: input.activeSessionId || null,
                sessions: (input.sessions || []).slice(0, 80).map(function(s) {
                    var messages = Array.isArray(s.messages) ? s.messages : [];
                    return {
                        id: s.id,
                        title: truncateSessionCacheText(s.title || '新会话', 80),
                        createdAt: s.createdAt || Date.now(),
                        source: s.source || 'local',
                        dialogue_session_id: s.dialogue_session_id || null,
                        task_graph_id: s.task_graph_id || s.graph_id || null,
                        graph_id: s.graph_id || s.task_graph_id || null,
                        task_graph_file_path: s.task_graph_file_path || null,
                        workspace_dir: s.workspace_dir || s.workspace_path || '',
                        workspace_path: s.workspace_path || s.workspace_dir || '',
                        messages: summaryOnly ? [] : messages.slice(-SESSION_CACHE_MAX_MESSAGES).map(function(m) {
                            return compactSessionMessage(m, false);
                        })
                    };
                })
            };
        }

        // 兼容旧代码：Web 端不再向后端持久化会话。
        // 后端 MemoryGraph 是唯一长期存储，localStorage 只保存当前浏览器 UI 状态。
        function _syncToServer(store) {
            return Promise.resolve({ status: 'skipped', storage: 'memory_graph_only' });
        }
        
        // 获取当前会话对象
        function getCurrentSession() {
            const store = loadSessionStore();
            return store.sessions.find(s => s.id === currentSessionId) || null;
        }

        function getCurrentSessionTaskGraphId() {
            var session = getCurrentSession();
            return (session && session.task_graph_id) || getActiveTaskGraphBackendId() || '';
        }

        function getMessageSessionId(data) {
            var p = data && data.payload && typeof data.payload === 'object' ? data.payload : {};
            return (data && (data.conversation_id || data.session_id)) || p.conversation_id || p.session_id || '';
        }

        function getMessageTaskGraphId(data) {
            var p = data && data.payload && typeof data.payload === 'object' ? data.payload : {};
            var graph = p.graph || data.graph || {};
            return (data && (data.task_graph_id || data.graph_id)) || p.task_graph_id || p.graph_id || graph.id || '';
        }

        function normalizeTaskGraphId(value) {
            var raw = (value || '').toString().trim();
            var match = raw.match(/\btg_\d+\b/);
            if (match) return match[0];
            if (raw.indexOf('tg:') === 0) raw = raw.slice(3);
            if (raw.indexOf('/') >= 0) raw = raw.split('/')[0];
            return raw;
        }

        function getBackendGraphIdFromGraph(graphData) {
            return normalizeTaskGraphId(
                graphData && (
                    graphData.id ||
                    graphData.graph_id ||
                    graphData.task_graph_id ||
                    graphData.graphAddress ||
                    graphData.graph_address ||
                    ''
                )
            );
        }

        function currentSessionHasBackendGraph(backendId) {
            backendId = normalizeTaskGraphId(backendId);
            if (!backendId) return false;
            var graphs = getSessionGraphs();
            return graphs.some(function(g) {
                return normalizeTaskGraphId(g.backendId || g.id || g.graphAddress || '') === backendId;
            });
        }

        function shouldAttachPassiveBackendGraph(graphData) {
            var backendId = getBackendGraphIdFromGraph(graphData);
            if (!backendId || !currentSessionId) return false;
            var session = getCurrentSession();
            if (!session) return false;
            var sessionGraphId = normalizeTaskGraphId(session.task_graph_id || session.graph_id || '');
            if (sessionGraphId) return sessionGraphId === backendId;
            return currentSessionHasBackendGraph(backendId);
        }

        function shouldAttachRealtimeTaskGraphUpdate(data, graphData) {
            var backendId = getBackendGraphIdFromGraph(graphData);
            if (!backendId || !currentSessionId) return false;
            if (shouldAttachPassiveBackendGraph(graphData)) return true;

            var eventSessionId = getMessageSessionId(data);
            if (eventSessionId && eventSessionId === currentSessionId) return true;

            var p = data && data.payload && typeof data.payload === 'object' ? data.payload : {};
            var eventRequestId = data.request_id || data.turn_id || p.request_id || p.turn_id || '';
            if (eventRequestId && currentRequestId && eventRequestId === currentRequestId) return true;

            var status = currentTaskExecutionStatus || {};
            var statusGraphId = normalizeTaskGraphId(status.task_graph_id || status.graph_id || '');
            var statusSessionId = status.conversation_id || status.session_id || '';
            if (
                statusGraphId &&
                statusGraphId === backendId &&
                (!statusSessionId || statusSessionId === currentSessionId) &&
                (_isGenerating || status.state === 'running' || status.state === 'thinking')
            ) {
                return true;
            }

            var session = getCurrentSession();
            var sessionGraphId = session ? normalizeTaskGraphId(session.task_graph_id || session.graph_id || '') : '';
            var currentGraphs = getSessionGraphs();
            var isFreshUserTurn = _isGenerating && lastSendAt && (Date.now() - lastSendAt < 300000);
            return Boolean(isFreshUserTurn && !sessionGraphId && currentGraphs.length === 0);
        }

        function belongsToCurrentSession(data, options) {
            options = options || {};
            if (!currentSessionId) return false;
            var sessionId = getMessageSessionId(data);
            if (sessionId) {
                return sessionId === currentSessionId;
            }
            var requestId = (data && data.request_id) || (data && data.payload && (data.payload.request_id || data.payload.turn_id)) || '';
            if (requestId && currentRequestId && requestId === currentRequestId) {
                return true;
            }
            var graphId = getMessageTaskGraphId(data);
            var currentGraphId = getCurrentSessionTaskGraphId();
            if (graphId && currentGraphId) {
                return graphId === currentGraphId;
            }
            return options.allowUnbound === true;
        }
        
        // 创建新会话
        function createNewSession() {
            const store = loadSessionStore();
            const newSession = {
                id: generateId(),
                title: '新会话',
                messages: [],
                createdAt: Date.now(),
                source: 'local',
                dialogue_session_id: null,
                task_graph_file_path: null
            };
            store.sessions.unshift(newSession);
            store.activeSessionId = newSession.id;
            saveSessionStore(store);
            switchToSession(newSession.id);
        }
        
        // 切换到指定会话
        function switchToSession(sessionId) {
            currentSessionId = sessionId;
            const store = loadSessionStore();
            store.activeSessionId = sessionId;
            saveSessionStore(store);
            notifyConversationSwitch(sessionId);
            
            // 清空当前聊天区
            chatMessages.innerHTML = '';
            interactionCardMap = {};
            pipelineProgressMessageMap = {};
            
            // 先用本地可见缓存做瞬时恢复，真正历史以后端回放为准。
            const session = store.sessions.find(s => s.id === sessionId);
            if (session && session.messages && session.messages.length > 0) {
                renderLocalSessionMessages(session.messages);
            }

            // 所有会话统一按 session_id 从后端加载，避免 local/remote 分叉导致正文丢失。
            if (ws && ws.readyState === WebSocket.OPEN) {
                const loadingDiv = document.createElement('div');
                loadingDiv.className = 'message system';
                loadingDiv.id = 'session-loading';
                loadingDiv.innerHTML = '<div class="message-content"><em>正在加载对话记录...</em></div>';
                chatMessages.appendChild(loadingDiv);
                
                sendWsMessage({
                    type: "GET_SESSION_MESSAGES",
                    session_id: sessionId
                });
            } else {
                _messagesReloadNeeded = true;
                const offDiv = document.createElement('div');
                offDiv.className = 'message system';
                offDiv.innerHTML = '<div class="message-content"><em>WebSocket 未连接，正在重连后将自动恢复对话...</em></div>';
                chatMessages.appendChild(offDiv);
            }
            
            renderSessionList();
            
            // 如果图谱面板已打开，刷新图谱列表
            refreshGraphListIfVisible();
            
            console.log('[Session] 切换到会话:', sessionId);
        }

        function notifyConversationSwitch(sessionId) {
            if (!sessionId || !ws || ws.readyState !== WebSocket.OPEN) return;
            sendWsMessage({
                type: 'conversation:switch',
                session_id: sessionId,
                conversation_id: sessionId
            });
        }
        
        // 删除会话：以后端级联删除为准，同步清理 MemoryGraph 与会话索引
        function deleteSession(sessionId, ev) {
            if (ev) ev.stopPropagation();

            const store = loadSessionStore();
            removeSessionsFromLocalStore([sessionId]);
            if (ws && ws.readyState === WebSocket.OPEN) {
                sendWsMessage({
                    type: "DELETE_DIALOGUE_SESSION",
                    session_id: sessionId
                });
            } else {
                fetch('/api/chat/sessions/' + encodeURIComponent(sessionId) + '?cascade=true', {
                    method: 'DELETE',
                }).then(function(r) { return r.json(); }).then(function(result) {
                    console.log('[Session] 级联删除完成:', result);
                    requestSessionListRefresh(250);
                    scheduleMemoryGraphRealtimeRefresh(250);
                }).catch(function(e) {
                    console.warn('[Session] 级联删除请求失败:', e);
                });
            }
            console.log('[Session] 已删除会话:', sessionId);
        }
        
        // 开始重命名会话
        function startRenameSession(sessionId, ev) {
            if (ev) ev.stopPropagation();
            const item = document.querySelector(`.session-item[data-sid="${sessionId}"]`);
            if (!item) return;
            
            const titleEl = item.querySelector('.session-title');
            const currentTitle = titleEl.textContent;
            
            // 替换为输入框
            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'session-title-input';
            input.value = currentTitle;
            titleEl.replaceWith(input);
            input.focus();
            input.select();
            
            function finishRename() {
                const newTitle = input.value.trim() || currentTitle;
                const store = loadSessionStore();
                const session = store.sessions.find(s => s.id === sessionId);
                if (session) {
                    session.title = newTitle;
                    saveSessionStore(store);
                }
                renderSessionList();
            }
            
            input.addEventListener('blur', finishRename);
            input.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') { input.blur(); }
                if (e.key === 'Escape') { input.value = currentTitle; input.blur(); }
            });
        }
        
        // 渲染会话列表
        function renderSessionList() {
            const store = loadSessionStore();
            const container = document.getElementById('sessionItems');
            container.innerHTML = '';
            
            store.sessions.forEach(s => {
                const div = document.createElement('div');
                div.className = 'session-item' + (s.id === currentSessionId ? ' active' : '');
                div.setAttribute('data-sid', s.id);
                div.onclick = function() { switchToSession(s.id); };
                // 右键菜单
                div.oncontextmenu = function(e) { showSessionContextMenu(e, s.id); };
                
                const title = document.createElement('span');
                title.className = 'session-title';
                title.textContent = s.title + (s.source === 'ide' ? ' [IDE]' : '') + (s.source === 'memory_graph' ? ' [记忆]' : '');
                title.ondblclick = function(e) { startRenameSession(s.id, e); };
                
                const del = document.createElement('button');
                del.className = 'session-delete';
                del.textContent = '\u2715';
                del.title = '删除会话';
                del.onclick = function(e) { deleteSession(s.id, e); };
                
                div.appendChild(title);
                div.appendChild(del);
                container.appendChild(div);
            });
        }
        
        // 保存消息到当前会话
        function saveMessageToSession(message) {
            const store = loadSessionStore();
            const session = store.sessions.find(s => s.id === currentSessionId);
            if (!session) return;

            // 自动标题：用第一条用户消息
            if (session.title === '新会话' && message.sender === 'user') {
                const text = message.text;
                session.title = text.length > 20 ? text.substring(0, 20) + '...' : text;
                renderSessionList();
            }
            // 仅保留轻量可见缓存，用于切换会话或刷新瞬时恢复。
            session.messages = session.messages || [];
            const cached = normalizeCachedMessage(message);
            const existingIndex = session.messages.findIndex(function(m) {
                if (cached.id && m.id === cached.id) return true;
                if (cached.request_id && cached.sender === 'assistant' && m.sender === 'assistant' && m.request_id === cached.request_id) return true;
                if (cached.card_type && cached.pair_id && m.card_type === cached.card_type && m.pair_id === cached.pair_id) return true;
                return false;
            });
            if (existingIndex >= 0) {
                session.messages[existingIndex] = cached;
            } else {
                session.messages.push(cached);
            }
            saveSessionStore(store);
        }

        function normalizeCachedMessage(message) {
            var payload = message.payload && typeof message.payload === 'object' ? message.payload : null;
            var cached = {
                id: message.id || generateId(),
                text: message.text || '',
                sender: message.sender || 'assistant',
                timestamp: message.timestamp || Date.now(),
                request_id: message.request_id || '',
                event_type: message.event_type || ''
            };
            if (message.card_type) cached.card_type = message.card_type;
            if (message.pair_id) cached.pair_id = message.pair_id;
            if (payload) cached.payload = payload;
            if (message.interaction) cached.interaction = message.interaction;
            if (message.pipeline_type) cached.pipeline_type = message.pipeline_type;
            if (message.event_data) cached.event_data = message.event_data;
            if (message.approval) cached.approval = message.approval;
            return cached;
        }

        function persistCardMessage(card) {
            if (!card || !currentSessionId) return;
            saveMessageToSession(Object.assign({
                sender: 'tool',
                timestamp: Date.now()
            }, card));
        }

        function updatePersistedApprovalCard(approvalId, approved) {
            if (!approvalId || !currentSessionId) return;
            var store = loadSessionStore();
            var session = store.sessions.find(function(s) { return s.id === currentSessionId; });
            if (!session || !Array.isArray(session.messages)) return;
            var targetId = String(approvalId);
            var changed = false;
            session.messages.forEach(function(msg) {
                if (!msg || msg.card_type !== 'approval') return;
                var payload = msg.payload || {};
                var msgId = payload.approval_id || payload.approvalId || msg.pair_id || msg.id || '';
                if (String(msgId) !== targetId) return;
                msg.payload = Object.assign({}, payload, {
                    approved: approved,
                    status: approved ? 'approved' : 'rejected',
                    confirmation_state: approved ? 'approved' : 'rejected'
                });
                changed = true;
            });
            if (changed) saveSessionStore(store);
        }

        function persistVisibleMessage(message) {
            if (!message || !message.text || !currentSessionId || !ws || ws.readyState !== WebSocket.OPEN) return;
            if (message.sender === 'user') return;
            if (message.sender === 'assistant' && message.request_id) return;
            var id = message.id || generateId();
            if (persistedMessageIds[id]) return;
            persistedMessageIds[id] = true;
            sendWsMessage({
                type: 'CHAT_VISIBLE_MESSAGE',
                session_id: currentSessionId,
                conversation_id: currentSessionId,
                request_id: message.request_id || currentRequestId || id,
                role: message.sender === 'user' ? 'user' : (message.sender === 'assistant' ? 'assistant' : 'tool'),
                text: message.text,
                source: 'web_ui'
            });
        }
        
        // 初始化会话系统
        function initSessionManager() {
            // 以后端 MemoryGraph/InteractionStore 返回的索引为准。
            // 本地 localStorage 只保留当前浏览器 UI 状态，不再向后端反向同步旧内容。
            fetch('/api/chat/sessions')
                .then(r => r.json())
                .then(serverStore => {
                    const localStore = loadSessionStore();
                    const merged = _mergeSessionStores(serverStore, localStore);
                    saveSessionStore(merged);
                    _applySessionStore(merged);
                })
                .catch(e => {
                    console.warn('[Session] 服务端加载失败，创建临时本地会话:', e);
                    _applySessionStore({ activeSessionId: null, sessions: [] });
                });
        }
        
        // 合并服务端和本地会话数据。
        // 服务端是唯一真相；本地只保留当前未落图谱的新会话壳和 UI 选中状态。
        function _mergeSessionStores(serverStore, localStore) {
            const allSessions = (serverStore.sessions || []).map(function(s) {
                s.source = s.source || 'interaction_store';
                s.messages = [];
                return s;
            });
            const activeId = serverStore.activeSessionId || localStore.activeSessionId;
            const merged = { activeSessionId: activeId, sessions: allSessions };
            return merged;
        }
        
        // 根据会话数据初始化 UI
        function _applySessionStore(store) {
            // 检查 URL 参数
            const urlParams = new URLSearchParams(window.location.search);
            const sessionIdFromUrl = urlParams.get('session_id');
            
            if (sessionIdFromUrl && store.sessions.find(s => s.id === sessionIdFromUrl)) {
                switchToSession(sessionIdFromUrl);
            } else if (store.activeSessionId && store.sessions.find(s => s.id === store.activeSessionId)) {
                switchToSession(store.activeSessionId);
            } else if (store.sessions.length > 0) {
                switchToSession(store.sessions[0].id);
            } else {
                createNewSession();
            }
        }
        
        // 兼容旧代码的函数
        function clearChatHistory() {
            if (currentSessionId) {
                deleteSession(currentSessionId);
            }
        }
        
        // ===== 后端 MemoryGraph 对话会话整合 =====
        
        // 合并后端对话会话到本地会话列表
        function mergeBackendSessions(backendSessions) {
            const store = loadSessionStore();
            backendSessions = backendSessions || [];
            const backendIds = new Set();
            const backendDialogueIds = new Set();
            const nextSessions = backendSessions.map(function(bs) {
                const id = bs.id;
                const dialogueId = bs.dialogue_session_id || bs.session_node_id || bs.id;
                if (id) backendIds.add(id);
                if (dialogueId) backendDialogueIds.add(dialogueId);
                const existingSession = store.sessions.find(function(s) {
                    return s.id === id ||
                        s.dialogue_session_id === id ||
                        s.dialogue_session_id === dialogueId ||
                        s.session_node_id === dialogueId;
                });
                return {
                    id: bs.id,
                    title: bs.title || (existingSession && existingSession.title) || '对话记录',
                    messages: existingSession && Array.isArray(existingSession.messages) ? existingSession.messages : [],
                    createdAt: (bs.created_at || 0) * 1000,
                    source: bs.source || 'interaction_store',
                    dialogue_session_id: dialogueId,
                    session_node_id: dialogueId,
                    round_count: bs.round_count || 0,
                    preview: bs.preview || '',
                    last_active_at: bs.last_active_at || bs.created_at || 0,
                    bound_task_id: bs.bound_task_id || '',
                    task_graph_id: bs.task_graph_id || (existingSession && existingSession.task_graph_id) || null,
                };
            });

            // 后端是长期存储真相；本地只保留尚未落库的新会话壳。
            store.sessions.forEach(function(local) {
                const isUnsyncedLocal = local.source === 'local' &&
                    !backendIds.has(local.id) &&
                    !backendDialogueIds.has(local.dialogue_session_id || local.session_node_id || '');
                if (isUnsyncedLocal && local.messages && local.messages.length > 0) {
                    nextSessions.push(local);
                }
            });

            nextSessions.sort((a, b) => {
                const ta = a.last_active_at || (a.createdAt / 1000) || 0;
                const tb = b.last_active_at || (b.createdAt / 1000) || 0;
                return tb - ta;
            });
            store.sessions = nextSessions;
            if (!store.sessions.find(function(s) { return s.id === store.activeSessionId; })) {
                store.activeSessionId = store.sessions[0] ? store.sessions[0].id : null;
            }
            saveSessionStore(store);
            if (currentSessionId && !store.sessions.find(function(s) { return s.id === currentSessionId; })) {
                if (store.sessions.length > 0) {
                    switchToSession(store.sessions[0].id);
                } else {
                    createNewSession();
                }
            } else {
                renderSessionList();
            }
            console.log('[Session] 已同步后端会话列表:', backendSessions.length);
        }

        let sessionListRefreshTimer = null;

        function requestSessionListRefresh(delayMs) {
            if (sessionListRefreshTimer) {
                clearTimeout(sessionListRefreshTimer);
            }
            sessionListRefreshTimer = setTimeout(function() {
                sessionListRefreshTimer = null;
                if (ws && ws.readyState === WebSocket.OPEN) {
                    sendWsMessage({ type: "LIST_DIALOGUE_SESSIONS" });
                    return;
                }
                fetch('/api/chat/sessions')
                    .then(function(r) { return r.json(); })
                    .then(function(data) {
                        mergeBackendSessions(data.sessions || []);
                    })
                    .catch(function(e) {
                        console.warn('[Session] 会话列表刷新失败:', e);
                    });
            }, delayMs || 300);
        }

        function removeSessionsFromLocalStore(sessionIds) {
            sessionIds = (sessionIds || []).filter(Boolean);
            if (sessionIds.length === 0) return;
            const removeSet = new Set(sessionIds);
            const store = loadSessionStore();
            store.sessions = store.sessions.filter(function(s) {
                return !removeSet.has(s.id) &&
                    !removeSet.has(s.dialogue_session_id || '') &&
                    !removeSet.has(s.session_node_id || '');
            });
            if (currentSessionId && removeSet.has(currentSessionId)) {
                currentSessionId = null;
            }
            if (!store.sessions.find(function(s) { return s.id === store.activeSessionId; })) {
                store.activeSessionId = store.sessions[0] ? store.sessions[0].id : null;
            }
            saveSessionStore(store);
            if (!currentSessionId) {
                if (store.sessions.length > 0) {
                    switchToSession(store.sessions[0].id);
                } else {
                    createNewSession();
                }
            } else {
                renderSessionList();
            }
        }
        
        // 渲染后端会话的完整消息列表
        function renderSessionMessages(sessionId, messages) {
            // 只在当前会话匹配时渲染
            if (sessionId !== currentSessionId) return;
            
            var shouldRestoreScroll = !chatAutoScrollPaused && isChatNearBottom();
            chatMessages.innerHTML = '';
            interactionCardMap = {};
            pipelineProgressMessageMap = {};
            const store = loadSessionStore();
            const session = store.sessions.find(function(s) { return s.id === sessionId; });
            if (session) {
                session.messages = normalizeSessionMessages(messages);
                saveSessionStore(store);
            }
            
            if (messages.length === 0) {
                const emptyDiv = document.createElement('div');
                emptyDiv.className = 'message system';
                emptyDiv.innerHTML = '<div class="message-content"><em>该会话暂无消息记录</em></div>';
                chatMessages.appendChild(emptyDiv);
                return;
            }
            
            for (const msg of messages) {
                renderSessionMessage(msg, false);
            }
            
            scrollChatToBottom(shouldRestoreScroll);
            if (isTerminalTaskState((currentTaskExecutionStatus && currentTaskExecutionStatus.state) || 'idle')) {
                stopChatAutoScrollAfterTerminal();
            }
        }

        function normalizeSessionMessages(messages) {
            return (messages || []).map(function(msg) {
                var payload = msg.payload || {};
                var eventType = msg.event_type || payload.step_type || msg.type || '';
                var interaction = getHistoricalInteraction(msg);
                var cardType = '';
                var pairId = '';
                if (interaction) {
                    cardType = 'interaction';
                    pairId = interaction.pair_id || interaction.interaction_id || '';
                } else if (eventType === 'IDE_APPROVAL_STATUS' || eventType === 'approval_required') {
                    cardType = 'approval';
                    pairId = payload.approval_id || payload.approvalId || msg.node_id || msg.id || '';
                }
                return {
                    id: msg.node_id || msg.id || generateId(),
                    text: msg.content || msg.text || '',
                    sender: msg.role === 'user' ? 'user' : (msg.role === 'tool' ? 'tool' : 'assistant'),
                    timestamp: msg.created_at ? Math.floor(msg.created_at * 1000) : Date.now(),
                    request_id: (payload && (payload.request_id || payload.turn_id)) || msg.turn_id || '',
                    event_type: eventType,
                    card_type: cardType,
                    pair_id: pairId,
                    payload: payload,
                    interaction: interaction || null
                };
            }).filter(function(msg) {
                return !!msg.text || !!msg.card_type;
            });
        }

        function renderLocalSessionMessages(messages) {
            var shouldRestoreScroll = !chatAutoScrollPaused && isChatNearBottom();
            chatMessages.innerHTML = '';
            interactionCardMap = {};
            pipelineProgressMessageMap = {};
            if (!messages || messages.length === 0) return;
            for (const msg of messages) {
                renderSessionMessage(msg, true);
            }
            scrollChatToBottom(shouldRestoreScroll);
            if (isTerminalTaskState((currentTaskExecutionStatus && currentTaskExecutionStatus.state) || 'idle')) {
                stopChatAutoScrollAfterTerminal();
            }
        }

        function getHistoricalInteraction(msg) {
            var payload = msg && msg.payload ? msg.payload : {};
            if (msg && msg.interaction) return msg.interaction;
            if (payload.interaction) return payload.interaction;
            if (payload.data && payload.data.interaction) return payload.data.interaction;
            return null;
        }

        function renderSessionMessage(msg, fromCache) {
            var normalized = msg || {};
            var payload = normalized.payload || {};
            var eventType = normalized.event_type || normalized.type || payload.step_type || '';
            var interaction = getHistoricalInteraction(normalized);
            if (interaction) {
                renderInteractionEvent({
                    payload: Object.assign({}, payload, {
                        interaction: interaction,
                        results: payload.results || (interaction.result_preview ? [{
                            tool_name: interaction.tool_name,
                            result_preview: interaction.result_preview,
                            is_error: interaction.status === 'failed'
                        }] : [])
                    })
                }, { persist: false });
                return;
            }
            if (eventType === 'IDE_APPROVAL_STATUS' || eventType === 'approval_required' || normalized.card_type === 'approval') {
                showWebApprovalRequest(buildApprovalRequestFromMessage(normalized), { persist: false, historical: true });
                return;
            }
            var role = normalized.role || (normalized.sender === 'user' ? 'user' : (normalized.sender === 'tool' ? 'tool' : 'assistant'));
            var text = normalized.content || normalized.text || '';
            if (role === 'user') {
                addMessage(text, 'user', false, null, normalized.node_id || normalized.id);
            } else if (role === 'assistant') {
                addMessage(text, 'assistant', false, normalized.request_id || null, normalized.node_id || normalized.id);
            } else if (role === 'tool') {
                addToolMessage(text, normalized.node_id || normalized.id);
            } else {
                addMessage(text, 'assistant', false, null, normalized.node_id || normalized.id);
            }
        }

        function buildApprovalRequestFromMessage(msg) {
            var payload = msg.payload || {};
            var status = payload.status || '';
            var approved = payload.approved;
            var confirmationState = payload.confirmation_state || '';
            if (!confirmationState) {
                if (status === 'approved' || status === 'confirmed' || approved === true) {
                    confirmationState = 'approved';
                } else if (status === 'rejected' || status === 'denied' || approved === false) {
                    confirmationState = 'rejected';
                }
            }
            return {
                approval_id: payload.approval_id || payload.approvalId || msg.pair_id || msg.id || '',
                ide_session_id: payload.session_id || payload.ide_session_id,
                workspace_path: payload.workspace_path,
                tool_name: payload.tool_name,
                action_summary: payload.action_summary || payload.summary || msg.text || '需要确认操作',
                risk_level: payload.risk_level || 'medium',
                risk_reason: payload.risk_reason || '',
                confirmation_state: confirmationState
            };
        }
        
        // 添加工具消息（折叠卡片形式）
        function addToolMessage(content, nodeId) {
            const msgId = nodeId || generateId();
            const div = document.createElement('div');

            div.setAttribute('data-msg-id', msgId);

            const displayTool = friendlyToolName(toolName);
            
            div.innerHTML = `
                <div class="message-content tool-card" style="font-size:12px; opacity:0.9; border-left:3px solid #6366f1; padding-left:8px;">
                    <details>

                        <pre style="margin-top:4px; white-space:pre-wrap; font-size:11px; max-height:200px; overflow-y:auto;">${escapeHtml(toolContent.slice(0, 500))}</pre>
                    </details>
