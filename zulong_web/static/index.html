<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>祖龙对话</title>
    <!-- dagre布局算法核心库 -->
    <script src="https://unpkg.com/dagre@0.8.5/dist/dagre.min.js"></script>
    <!-- Cytoscape.js 核心（使用3.26.0稳定版） -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.26.0/cytoscape.min.js"></script>
    <!-- Cytoscape dagre布局扩展 -->
    <script src="https://unpkg.com/cytoscape-dagre@2.5.0/cytoscape-dagre.js"></script>
    <!-- 保留d3用于其他功能 -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 0;
            display: flex;
            justify-content: stretch;
            align-items: stretch;
        }
        
        /* === App Wrapper: 控制整体布局与分屏 === */
        .app-wrapper {
            width: 100%;
            max-width: 100%;
            height: 100vh;
            min-height: 0;
            display: flex;
            gap: 0;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .app-wrapper.split-mode {
            width: 100%;
            max-width: 100%;
            height: 100%;
            min-height: 0;
            gap: 0;
        }

        .chat-container {
            flex: 1;
            min-width: 0;
            height: 100%;
            background: white;
            border-radius: 0;
            box-shadow: none;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: flex 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .app-wrapper.split-mode .chat-container {
            flex: 0 1 clamp(300px, 32%, 560px);
            max-width: none;
            min-width: min(300px, 48vw);
            border-radius: 0;
        }

        /* === 图谱 Tab 切换 === */
        .graph-tabs {
            display: flex;
            gap: 0;
            margin-right: auto;
        }
        .graph-tab-btn {
            padding: 5px 14px;
            font-size: 12px;
            font-weight: 600;
            color: #94a3b8;
            background: none;
            border: 1px solid #e2e8f0;
            border-bottom: none;
            cursor: pointer;
            transition: all 0.2s;
        }
        .graph-tab-btn:first-child { border-radius: 6px 0 0 0; }
        .graph-tab-btn:last-child { border-radius: 0 6px 0 0; }
        .graph-tab-btn.active {
            color: #1e293b;
            background: #fff;
            border-bottom: 2px solid #3b82f6;
        }
        .graph-tab-btn:hover:not(.active) { color: #3b82f6; background: #f1f5f9; }

        /* 视图容器 */
        .graph-view-task {
            display: flex;
            flex-direction: column;
            flex: 1;
            overflow: hidden;
        }
        .graph-view-task.hidden { display: none; }
        .graph-view-memory {
            display: none;
            flex-direction: column;
            flex: 1;
            overflow: hidden;
            background: #0f172a;
        }
        .graph-view-memory.active { display: flex; }

        .mg-content-row {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* 记忆图谱内部样式 */
        .mg-toolbar {
            padding: 6px 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #334155;
            background: #1e293b;
            flex-shrink: 0;
        }
        .mg-toolbar-spacer { flex: 1; }
        .mg-tool-btn {
            height: 24px;
            padding: 0 10px;
            border-radius: 6px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #cbd5e1;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }
        .mg-tool-btn:hover {
            border-color: #8b5cf6;
            color: #f8fafc;
            background: #1e1b4b;
        }
        .mg-zoom-readout {
            min-width: 42px;
            text-align: right;
            font-size: 11px;
            font-weight: 700;
            color: #94a3b8;
        }
        .mg-stats {
            font-size: 11px;
            color: #94a3b8;
        }
        .mg-body {
            flex: 1;
            overflow: hidden;
            position: relative;
        }
        .mg-body svg {
            width: 100%;
            height: 100%;
        }
        .mg-legend {
            padding: 6px 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            border-top: 1px solid #334155;
            background: #1e293b;
            flex-shrink: 0;
        }
        .mg-leg {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 10px;
            color: #94a3b8;
        }
        .mg-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }
        .mg-node-label {
            font-size: 9px;
            fill: #94a3b8;
            pointer-events: none;
        }
        .mg-link {
            stroke-opacity: 0.5;
        }

        /* 记忆图谱节点详情面板 */
        .mg-detail-panel {
            width: 320px;
            background: #1e293b;
            border-left: 1px solid #334155;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            overflow: hidden;
            transition: width 0.3s ease;
        }
        .mg-detail-panel.collapsed {
            width: 0;
            border-left: none;
            overflow: hidden;
            opacity: 0;
            pointer-events: none;
        }
        .mg-detail-header {
            padding: 10px 14px;
            border-bottom: 1px solid #334155;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }
        .mg-detail-header h3 {
            font-size: 13px;
            font-weight: 700;
            color: #e2e8f0;
            margin: 0;
        }
        .mg-detail-close {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 16px;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .mg-detail-close:hover { color: #e2e8f0; background: #334155; }
        .mg-detail-body {
            flex: 1;
            overflow-y: auto;
            padding: 12px 14px;
        }
        .mg-detail-placeholder {
            color: #64748b;
            font-size: 12px;
            text-align: center;
            padding: 40px 20px;
            line-height: 1.8;
        }
        .mg-detail-field {
            margin-bottom: 12px;
        }
        .mg-detail-field-label {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            color: #64748b;
            letter-spacing: 0.5px;
            margin-bottom: 3px;
        }
        .mg-detail-field-value {
            font-size: 12px;
            color: #cbd5e1;
            line-height: 1.6;
            word-break: break-all;
        }
        .mg-detail-content-box {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 10px;
            font-size: 12px;
            color: #e2e8f0;
            line-height: 1.7;
            max-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .mg-detail-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: 600;
        }
        .mg-detail-neighbors {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .mg-detail-neighbors li {
            padding: 6px 8px;
            border-bottom: 1px solid #1e293b;
            font-size: 11px;
            color: #94a3b8;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }
        .mg-detail-neighbors li:hover {
            background: #334155;
            color: #e2e8f0;
        }
        .mg-neighbor-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        /* 记忆图谱 - 文件卡片 */
        .mg-detail-file-card {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: border-color .2s;
        }
        .mg-detail-file-card:hover {
            border-color: #3b82f6;
            background: #1e293b;
        }
        .mg-detail-file-name {
            font-size: 12px;
            color: #3b82f6;
            font-weight: 600;
        }
        .mg-detail-file-path {
            font-size: 10px;
            color: #64748b;
            word-break: break-all;
            margin-top: 2px;
        }
        .mg-detail-img-preview {
            max-width: 100%;
            max-height: 200px;
            border-radius: 4px;
            border: 1px solid #334155;
            margin-top: 8px;
            overflow: hidden;
        }
        .mg-detail-img-preview img {
            width: 100%;
            height: auto;
            max-height: 200px;
            object-fit: contain;
            display: block;
        }
        .mg-detail-file-btn {
            padding: 4px 10px;
            font-size: 10px;
            border-radius: 4px;
            border: 1px solid #334155;
            background: #1e293b;
            color: #94a3b8;
            cursor: pointer;
            margin-top: 6px;
            display: inline-block;
        }
        .mg-detail-file-btn:hover {
            background: #334155;
            color: #e2e8f0;
        }

        /* === 拖拽分隔条 + 图谱折叠按钮 === */
        .resize-handle {
            display: none;
            width: 6px;
            height: 100%;
            cursor: col-resize;
            background: transparent;
            position: relative;
            flex-shrink: 0;
            transition: background 0.2s;
            z-index: 10;
        }
        .resize-handle:hover, .resize-handle.dragging {
            background: #3b82f6;
        }
        .app-wrapper.split-mode .resize-handle {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .graph-collapse-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 48px;
            background: #e2e8f0;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            cursor: pointer;
            font-size: 10px;
            color: #64748b;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s, background 0.2s;
        }
        .resize-handle:hover .graph-collapse-btn {
            opacity: 1;
        }
        .graph-collapse-btn:hover {
            background: #3b82f6;
            color: #fff;
            border-color: #3b82f6;
        }

        /* === 图谱面板 === */
        .graph-panel {
            display: none;
            flex: 1;
            min-width: 0;
            height: 100%;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            flex-direction: column;
            overflow: hidden;
            animation: graphSlideIn 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .app-wrapper.split-mode .graph-panel {
            display: flex;
            flex: 1 1 0;
            min-width: min(300px, 48vw);
        }

        @keyframes graphSlideIn {
            from { opacity: 0; transform: translateX(40px); }
            to   { opacity: 1; transform: translateX(0); }
        }

        /* 图谱面板内部结构 */
        .graph-header {
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }
        .graph-header h2 {
            font-size: 15px;
            font-weight: 700;
            color: #1e293b;
        }
        .graph-header h2 .accent { color: #3b82f6; }
        .graph-progress { display: flex; align-items: center; gap: 10px; font-size: 12px; color: #64748b; }
        .graph-progress-bar { width: 140px; height: 6px; background: #e2e8f0; border-radius: 3px; overflow: hidden; }
        .graph-progress-fill { height: 100%; background: linear-gradient(90deg,#22c55e,#16a34a); border-radius: 3px; transition: width .4s; }
        .graph-body { flex: 1; display: flex; overflow: hidden; }
        .graph-svg-area { flex: 1; overflow: hidden; background: #f8fafc; position: relative; cursor: grab; min-height: 200px; }
        .graph-svg-area.panning { cursor: grabbing; }
        .graph-svg-area svg { display: block; transform-origin: 0 0; will-change: transform; }

        /* 图谱节点 */
        .graph-panel .gnode { cursor: pointer; }
        .graph-panel .gnode .card { fill: #fff; stroke: #e2e8f0; stroke-width: 1.5; }
        .graph-panel .gnode:hover .card { stroke: #3b82f6; stroke-width: 2.5; }
        .graph-panel .gnode.selected .card { stroke: #3b82f6; stroke-width: 3; }
        .graph-panel .gnode .title { font-size: 11.5px; font-weight: 600; fill: #1e293b; }
        .graph-panel .gnode .subtitle { font-size: 10px; fill: #64748b; }
        .graph-panel .gnode.dimmed { opacity: .18; }
        .graph-panel .dep-group { }

        .tg-single-node-wrap {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .tg-single-node-card {
            width: min(360px, 84%);
            min-height: 112px;
            padding: 16px 18px;
            border-radius: 10px;
            border: 2px solid #3b82f6;
            background: #1e293b;
            color: #f8fafc;
            box-shadow: 0 18px 36px rgba(15, 23, 42, 0.35);
            cursor: pointer;
            transition: transform .18s, box-shadow .18s, border-color .18s;
        }
        .tg-single-node-card:hover,
        .tg-single-node-card.selected {
            transform: translateY(-2px);
            border-color: #60a5fa;
            box-shadow: 0 22px 44px rgba(37, 99, 235, 0.28);
        }
        .tg-single-node-title {
            font-size: 14px;
            line-height: 1.5;
            font-weight: 700;
            overflow-wrap: anywhere;
        }
        .tg-single-node-meta {
            margin-top: 10px;
            font-size: 12px;
            line-height: 1.4;
            color: #cbd5e1;
        }

        /* 图谱边 */
        .graph-panel .edge-hier { fill: none; stroke: #cbd5e1; stroke-width: 1.4; }
        .graph-panel .edge-hier.dimmed { opacity: .1; }
        .graph-panel .dep-group { transition: opacity .3s; }
        .graph-panel .dep-group .dep-line { fill: none; stroke-width: 2; stroke-dasharray: 7 4; }
        .graph-panel .dep-group .dep-label { font-size: 9.5px; font-weight: 600; }
        .graph-panel .dep-group.satisfied .dep-line { stroke: #22c55e; }
        .graph-panel .dep-group.unsatisfied .dep-line { stroke: #ef4444; }
        .graph-panel .dep-group.satisfied .dep-label { fill: #16a34a; }
        .graph-panel .dep-group.unsatisfied .dep-label { fill: #dc2626; }
        .graph-panel .dep-group.dimmed { opacity: .08; }
        .graph-panel .dep-group.highlighted .dep-line { stroke-width: 3; }
        .graph-panel .dep-group.highlighted.satisfied .dep-line { stroke-width: 3; }
        @keyframes dash { to { stroke-dashoffset: -22; } }
        .graph-panel .dep-group:hover .dep-line { animation: dash .8s linear infinite; }

        /* 图谱右侧详情面板 */
        .graph-detail-panel {
            width: 320px;
            background: #fff;
            border-left: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            overflow: visible;
            position: relative;
        }
        .gp-tabs { display: flex; border-bottom: 1px solid #e2e8f0; background: #f8fafc; flex-shrink: 0; }
        .gp-tab {
            flex: 1; padding: 8px 4px; font-size: 11.5px; font-weight: 600;
            color: #94a3b8; background: none; border: none;
            border-bottom: 2px solid transparent; cursor: pointer; transition: all .2s;
        }
        .gp-tab:hover { color: #3b82f6; }
        .gp-tab.active { color: #3b82f6; border-bottom-color: #3b82f6; background: #fff; }
        .gp-collapse-btn {
            flex: 0 0 auto;
            padding: 6px 10px;
            font-size: 14px;
            font-weight: 700;
            color: #94a3b8;
            background: none;
            border: none;
            border-bottom: 2px solid transparent;
            cursor: pointer;
            transition: all .2s;
        }
        .gp-collapse-btn:hover { color: #3b82f6; background: #eff6ff; }
        .gp-tab-body { flex: 1; overflow-y: auto; padding: 14px; }
        .gp-tab-body.hidden { display: none; }
        .gp-tab-body h3 { font-size: 13px; font-weight: 700; margin-bottom: 8px; }
        .gp-field { margin-bottom: 10px; }
        .gp-field-label { font-size: 10px; font-weight: 700; text-transform: uppercase; color: #94a3b8; letter-spacing: .5px; margin-bottom: 2px; }
        .gp-field-value { font-size: 12px; color: #334155; line-height: 1.6; }
        .gp-dep-card {
            background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px;
            padding: 8px; margin-bottom: 5px;
        }
        .gp-dep-card .dep-id { font-size: 11px; font-weight: 700; }
        .gp-dep-card .dep-id.in { color: #dc2626; }
        .gp-dep-card .dep-id.out { color: #3b82f6; }
        .gp-dep-card .dep-via { font-size: 10px; color: #64748b; margin-top: 2px; }
        .gp-dep-card .dep-result { font-size: 11px; color: #334155; margin-top: 4px; padding-top: 4px; border-top: 1px dashed #e2e8f0; }
        .gp-llm-box {
            background: #1e293b; color: #e2e8f0; font-family: Consolas, Monaco, Menlo, monospace;
            font-size: 11px; line-height: 1.6; padding: 12px; border-radius: 8px;
            white-space: pre-wrap; word-break: break-all;
        }
        .gp-placeholder { text-align: center; color: #94a3b8; padding: 30px 14px; font-size: 12px; line-height: 1.8; }

        /* 图谱底部图例 */
        .graph-legend {
            display: flex; gap: 14px; padding: 6px 16px; background: #fff;
            border-top: 1px solid #e2e8f0; font-size: 11px; color: #64748b;
            flex-shrink: 0; align-items: center; flex-wrap: wrap;
        }
        .graph-legend .gl-item { display: flex; align-items: center; gap: 4px; }
        .graph-legend .gl-line { width: 18px; height: 0; border-top: 2px solid; }
        .graph-legend .gl-dash { width: 18px; height: 0; border-top: 2px dashed; }
        .graph-legend .gl-dot { width: 8px; height: 8px; border-radius: 2px; }

        /* 图谱关闭按钮 */
        .graph-close-btn {
            background: none; border: 1px solid #e2e8f0; border-radius: 6px;
            padding: 4px 12px; font-size: 12px; color: #64748b; cursor: pointer;
            transition: all 0.2s;
        }
        .graph-close-btn:hover { background: #fee2e2; color: #dc2626; border-color: #fca5a5; }

        /* 对话框里的图谱开关按钮 */
        .graph-toggle-btn {
            background: rgba(255,255,255,0.2);
            border: none; border-radius: 8px;
            padding: 5px 12px; color: white; cursor: pointer;
            font-size: 13px; font-weight: 600;
            transition: background 0.3s;
        }
        .graph-toggle-btn:hover { background: rgba(255,255,255,0.35); }

        /* === 会话列表 === */
        .session-list {
            background: #f8f8fc;
            border-bottom: 1px solid #e2e8f0;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            max-height: 180px;
            overflow: hidden;
        }
        .session-list-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 12px;
            flex-shrink: 0;
        }
        .session-list-header span {
            font-size: 11px;
            font-weight: 700;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: .5px;
        }
        .new-session-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 3px 10px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .new-session-btn:hover { opacity: 0.85; }
        .session-items {
            flex: 1;
            overflow-y: auto;
            padding: 0 6px 6px;
        }
        .session-item {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 7px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            color: #475569;
            transition: background 0.15s;
            position: relative;
        }
        .session-item:hover { background: #eef2ff; }
        .session-item.active {
            background: linear-gradient(135deg, rgba(102,126,234,0.12), rgba(118,75,162,0.1));
            color: #4338ca;
            font-weight: 600;
        }
        .session-item .session-title {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .session-item .session-title-input {
            flex: 1;
            min-width: 0;
            border: 1px solid #667eea;
            border-radius: 4px;
            padding: 1px 6px;
            font-size: 13px;
            outline: none;
            background: white;
        }
        .session-item .session-delete {
            display: none;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 13px;
            color: #94a3b8;
            padding: 0 2px;
            flex-shrink: 0;
            transition: color 0.2s;
        }
        .session-item:hover .session-delete { display: block; }
        .session-item .session-delete:hover { color: #ef4444; }

        /* === 图谱列表（类似会话列表） === */
        .graph-list {
            background: #f8f8fc;
            border-bottom: 1px solid #e2e8f0;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
